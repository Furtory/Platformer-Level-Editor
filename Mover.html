/* ==================== 平台组合（Group）功能 ==================== */
let gidCounter = 1; // 组号自增（整数）

// 根据当前 platforms 数组内容重建组合内外部映射
function rebuildGroupsFromPlatforms() {
  platforms.forEach(p => {
    if (!p.isGround && p.gid == null) { /* 无组，保持 */ }
  });
  // 清理孤立的 gid（如果某组只剩 0 或 1 个则移除 gid）
  const gidCount = {};
  platforms.forEach(p => { if (!p.isGround && p.gid != null) gidCount[p.gid] = (gidCount[p.gid] || 0) + 1; });
  platforms.forEach(p => {
    if (!p.isGround && p.gid != null && (gidCount[p.gid] || 0) < 2) delete p.gid;
  });
  // 修正 gidCounter 使之总是比所有现存 gid 大
  let maxGid = 0;
  platforms.forEach(p => { if (!p.isGround && p.gid > maxGid) maxGid = p.gid; });
  if (maxGid >= gidCounter) gidCounter = maxGid + 1;
}

// 比较两个 pid（数字 / 字符串兼容）
function pidEq(a, b) {
  if (a == null || b == null) return false;
  return '' + a === '' + b;
}
// 给定一组 pids，把它们绑定成新组合（解散各自原有组，分配新 gid）；返回创建的组号
function createGroupFromPids(pidArray) {
  if (!pidArray || pidArray.length < 2) return null;
  const gid = gidCounter++;
  // 解散这些平台的原有组
  pidArray.forEach(pid => {
    const p = platforms.find(function(pp){ return pidEq(pp.pid, pid); });
    if (p && !p.isGround) p.gid = gid;
  });
  // 解散所有只剩 <2 个的孤立组
  rebuildGroupsFromPlatforms();
  return gid;
}

// 解散一个给定 gid 的组合（传 null 则解散所有组）
function dissolveGroup(gid) {
  if (gid == null) {
    // 传 null → 解散全部
    platforms.forEach(p => { if (!p.isGround && p.gid != null) delete p.gid; });
    return;
  }
  platforms.forEach(p => { if (!p.isGround && p.gid === gid) delete p.gid; });
}

// 传入一个 pid，获取同组其它平台的 pids；若该平台无组返回空数组
function getGroupPidsOfPid(pid) {
  const p = platforms.find(function(pp){ return pidEq(pp.pid, pid); });
  if (!p || p.isGround || p.gid == null) return [];
  const gid = p.gid;
  const result = [];
  platforms.forEach(pp => { if (!pp.isGround && pp.gid === gid) result.push(pp.pid); });
  // 组少于 2 视为已解散
  return result.length < 2 ? [] : result;
}

// 若该 pid 属于某组，把组内其它平台也加入选中集合并刷新 UI；未入组时什么也不做；返回实际加入的 pid 列表
function extendSelectionToGroup(pid) {
  const pids = getGroupPidsOfPid(pid);
  if (pids.length < 2) return [];
  pids.forEach(p => selectedPlatformPids.add(toPidKey(p)));
  applyPlatformSelectionUI();
  return pids;
}

// 从组合中移除一个 pid（删除时调用）；若移除后组 <2 则解散该组
function removePidFromGroup(pid) {
  const p = platforms.find(function(pp){ return pidEq(pp.pid, pid); });
  if (!p || p.isGround || p.gid == null) return;
  const gid = p.gid;
  delete p.gid;
  // 解散残留的孤立组（<2）
  rebuildGroupsFromPlatforms();
  // 同时从选中集合剔除（若此时已被删除）
  selectedPlatformPids.delete(toPidKey(pid));
}

// 关键修复：手柄全部推到平台外部（不与平台区域重叠），避免被平台 DOM 遮挡
// 使用固定像素尺寸（不受世界缩放影响），通过 mapEl 的 CSS transform 自动适配缩放
function positionResizeHandles() {
  if (resizeTarget === null) return;
  const p = platforms[resizeTarget];
  if (!p) { hideResizeHandles(); return; }

  const HS_W = 20; // 水平手柄(n/s)的固定屏幕宽度 px
  const HS_H = 12; // 水平手柄的固定屏幕高度 px
  const VS_W = 12; // 垂直手柄(e/w)的固定屏幕宽度 px
  const VS_H = 20; // 垂直手柄的固定屏幕高度 px
  const GAP  = 3;  // 手柄与平台的间距 px

  // 平台在 mapEl 内部坐标系的边界（像素，未经缩放）
  const pl = p.x * GRID;
  const pb = p.y * GRID;
  const pw = p.w * GRID;
  const ph = p.h * GRID;
  const cx = pl + pw / 2;
  const cy = pb + ph / 2;

  // 每个手柄的"中心"位置（世界 px 坐标），然后减去自身尺寸/2
  // n: 上边正上方；s: 下边正下方；e: 右边正右方；w: 左边正左方
  resizeHandles.forEach(hdl => {
    const edge = hdl.dataset.edge;
    let centerX, centerY, w, h;
    if (edge === 'n') {
      w = HS_W / zoom; h = HS_H / zoom;
      centerX = cx;
      centerY = pb + ph + (GAP + HS_H / 2) / zoom;
    } else if (edge === 's') {
      w = HS_W / zoom; h = HS_H / zoom;
      centerX = cx;
      centerY = pb - (GAP + HS_H / 2) / zoom;
    } else if (edge === 'e') {
      w = VS_W / zoom; h = VS_H / zoom;
      centerX = pl + pw + (GAP + VS_W / 2) / zoom;
      centerY = cy;
    } else { // w
      w = VS_W / zoom; h = VS_H / zoom;
      centerX = pl - (GAP + VS_W / 2) / zoom;
      centerY = cy;
    }
    hdl.style.width  = w + 'px';
    hdl.style.height = h + 'px';
    hdl.style.left   = (centerX - w / 2) + 'px';
    hdl.style.bottom = (centerY - h / 2) + 'px';
  });

  // === 平台尺寸标签（与列表悬浮坐标标签同逻辑：showCenteredTag） ===
  showCenteredTag(platSizeTag, p,
    '宽度: ' + p.w + '格<br>高度: ' + p.h + '格',
    '宽度: ' + p.w + '格 X 高度: ' + p.h + '格');
}

function screenToMapCoord(clientX, clientY, curZoom, mapLeft, mapTop) {
  const stageRect = stageEl.getBoundingClientRect();
  const localX = (clientX - stageRect.left - mapLeft) / curZoom;
  const mapBottomScreen = mapTop + mapTotalH * curZoom;
  const localY = (mapBottomScreen - (clientY - stageRect.top)) / curZoom;
  return { x: localX, y: localY };
}

/* ==================== 火星粒子（删除平台时从舞台底部升起） ==================== */
function createSparks(centerStageX, platWidthStage) {
  playSnd(sndFire);   // 火花出现时播放 fire 音效
  const stageRect = stageEl.getBoundingClientRect();
  // 若未提供中心点，则默认舞台底部居中
  let cx = centerStageX != null ? centerStageX : stageRect.width / 2;
  // 限制在舞台范围之内（留出边距）
  cx = Math.max(80, Math.min(stageRect.width - 80, cx));

  // 火星生成总宽度 = 平台宽度 × 2（每侧扩展 1×平台宽度 超出平台边缘）
  const basePlatW = platWidthStage && platWidthStage > 0 ? platWidthStage : 160;
  const halfSpawnW = basePlatW;           // 单侧半宽 = 1× 平台宽度 → 总宽度 = 2×
  const maxHalf = Math.min(stageRect.width / 2 - 60, halfSpawnW);

  // 火星数量：与平台宽度成正比（每80px 至少4颗 + 基础5颗，最少8，最多22）
  const densityBase = Math.round(5 + (basePlatW / 80) * 5);
  const count = Math.max(8, Math.min(22, densityBase + Math.floor(Math.random() * 4)));

  const DURATION = 1.8; // 所有火星共用同一动画时长（缩放与透明速度一致）

  for (let i = 0; i < count; i++) {
    const s = document.createElement('div');
    s.className = 'spark';

    // 大小不一致：4px ~ 19px，偏向中小尺寸
    const rnd = Math.random();
    const size = rnd < 0.55
      ? 4 + Math.random() * 6          // 4~10（偏小，55%）
      : (rnd < 0.85
          ? 10 + Math.random() * 5     // 10~15（中等，30%）
          : 14 + Math.random() * 5);   // 14~19（偏大，15%）

    // 位置分布：距离中心越远，生成越稀疏
    // 使用 Math.pow(rand, power) 将均匀分布推近中心（power>1 → 集中，power越大越集中）
    const POWER = 1.75;
    const signed = Math.random() < 0.5 ? -1 : 1;
    const tNorm = Math.pow(Math.random(), POWER);  // 0~1，越靠近0越密集
    const xOffset = signed * tNorm * maxHalf;      // 映射到 ±maxHalf

    // S 形晃动：s1 与 s2 符号相反，形成先弯一侧、反曲后弯另一侧的 S
    // 起始方向随机（左或右），幅度随平台宽度增加（平台越宽火星晃动越大）
    const sDir = Math.random() < 0.5 ? 1 : -1;
    const sAmpBase = 18 + Math.min(50, basePlatW * 0.22);   // 基础幅度 + 平台宽度贡献
    const s1 = sDir * (sAmpBase * (0.7 + Math.random() * 0.7));
    const s2 = -s1 * (0.75 + Math.random() * 0.5);           // 反方向，幅度 0.75~1.25× s1

    // 出现时机不一致：0 ~ 1s 错开（从第一个出现到最后一个出现共1秒）
    const delay = Math.random() * 1.0;

    s.style.setProperty('--sp-size',  size.toFixed(1) + 'px');
    s.style.setProperty('--sp-x',     xOffset.toFixed(1) + 'px');
    s.style.setProperty('--sp-s1',    s1.toFixed(1) + 'px');
    s.style.setProperty('--sp-s2',    s2.toFixed(1) + 'px');
    s.style.setProperty('--sp-delay', delay.toFixed(3) + 's');
    s.style.setProperty('--sp-dur',   DURATION.toFixed(2) + 's');

    // left 设为中心点（火星内部再通过 --sp-x 偏移散布）
    s.style.left = cx + 'px';
    stageEl.appendChild(s);

    // 动画结束后自动清理 DOM（总寿命 = delay + duration + 余量）
    const ttl = (delay + DURATION + 0.08) * 1000;
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, ttl);
  }
}

/* ==================== 平台删除动画（拖动删除 / 列表删除 / 全部删除 共用） ====================
   platEl: 要删除的平台 DOM 元素（.platform.normal）
   流程：立即从数据层移除 → 坠落动画(0.5s) → 480ms 触发火星 → 背景状态机(confirm→draw) → 动画结束清理DOM+刷新列表 */
function playDeleteAnimation(platEl) {
  if (!platEl) return;
  playSnd(sndSprint);   // 删除平台时播放 sprint 音效

  // 先立刻清理平台上的交互子节点（坐标标签/手柄/尺寸标签），防止坠落动画期间它们显示错位或残留
  platEl.querySelectorAll('.sel-coord-tag, .resize-handle, .plat-size-tag, .handle-e, .handle-w, .handle-n, .handle-s, .handle-ne, .handle-nw, .handle-se, .handle-sw').forEach(function(n){ n.remove(); });
  platEl.classList.remove('coord-fits');

  // 通过 data-pid 精确定位当前在 platforms 数组中的索引（避免连续删除时索引漂移）
  const pid = +platEl.dataset.pid;
  const idx = platforms.findIndex(function(p){ return p.pid === pid; });
  // 先移除该平台在组合中的登记（如组只剩 0 或 1 个则自动解散该组），并从选中集合剔除
  removePidFromGroup(pid);
  if (idx >= 0 && !platforms[idx].isGround) {
    platforms.splice(idx, 1); // 立即从数据层移除，避免动画过程中被交互
  }

  // 清除拖动删除态残留，进入坠落动画
  platEl.classList.remove('drag-delete');
  platEl.style.removeProperty('--del-fs');
  platEl.classList.add('falling');

  // 计算被删平台中心在舞台坐标系中的 X 位置，以及平台显示宽度（受世界缩放影响）
  // 火星生成宽度 = 平台宽度 × 2（火星从该点正下方舞台底部升起）
  let sparkCenterX = null;
  let platWidthStage = 0;
  try {
    const sRect = stageEl.getBoundingClientRect();
    const eRect = platEl.getBoundingClientRect();
    sparkCenterX = (eRect.left + eRect.width / 2) - sRect.left;
    platWidthStage = eRect.width;
  } catch (e) { sparkCenterX = null; platWidthStage = 0; }

  // 坠落动画 0.5s：平台即将消失时（480ms）触发火星从舞台底部升起
  setTimeout(function(){ createSparks(sparkCenterX, platWidthStage); }, 480);

  // 坠落动画时长 0.5s；消失后 0.1s 开始第二阶段背景
  bgTimer1 = setTimeout(function(){
    clearBgTimers(); // 清理自身(t1)，确保 t2/t3 可再排
    // 警示渐变（0.2s 过渡）
    setMapBg('confirm', 0.2);
    // 警示渐变显示 0.6s（过渡 0.2 + 停留 0.6 = 0.8s 触发还原）
    bgTimer2 = setTimeout(function(){
      // 回到"绘制模式颜色"#2263ad（不是用户设定的世界颜色）
      restoreDrawBg(0.8);
    }, 600 + 200);
  }, 500 + 100);

  // 坠落动画结束后重建 UI（确保坠落后列表同步、且 DOM 最终清理）
  (function(animEl){
    function onEnd(){
      animEl.removeEventListener('animationend', onEnd);
      animEl.removeEventListener('webkitAnimationEnd', onEnd);
      if (animEl.parentNode) animEl.parentNode.removeChild(animEl);
      updatePlatListUI();
      hideResizeHandles();
    }
    animEl.addEventListener('animationend', onEnd);
    animEl.addEventListener('webkitAnimationEnd', onEnd);
  })(platEl);
}

platDrawBtn.addEventListener('click', function() {
  drawMode = !drawMode;
  const DUR = 0.3;
  const transition = 'opacity ' + DUR + 's ease';
  if (drawMode) {
    platDrawBtn.textContent = '完成绘制';
    platDrawBtn.style.background = '#2263ad';
    platDrawBtn.style.borderColor = '#1a4a85';
    stageEl.classList.add('drawing');
    mapGridEl.style.display = 'none';
    savedWorldColor = worldColor.value;
    clearBgTimers();

    // 进入绘制模式：
    // 1) map 底层保留用户设定的纯色（不直接写 mapEl.style.background，避免退出时瞬切）
    // 2) 通过 mapBgDraw 叠层 0.3s 淡入 #2263ad，实现平滑颜色过渡
    mapBgDraw.style.transition    = transition;
    mapBgDanger.style.transition  = 'none';
    mapBgConfirm.style.transition = 'none';
    mapBgDanger.style.opacity  = '0';
    mapBgConfirm.style.opacity = '0';
    // 同步舞台叠层：stageBgDraw 0.3s 淡入
    stageBgDraw.style.transition    = transition;
    stageBgDanger.style.transition  = 'none';
    stageBgConfirm.style.transition = 'none';
    stageBgDanger.style.opacity  = '0';
    stageBgConfirm.style.opacity = '0';
    requestAnimationFrame(function(){
      mapBgDraw.style.opacity   = '1';
      stageBgDraw.style.opacity = '1';
    });

    applyDrawGrid();
    setHintMode(true);
    updatePlatListUI(); // 启用宽高输入框与删除按钮
    platEditRow.style.display = 'flex'; // 显示撤回/还原/全部删除
    platDelAllBtn.disabled = false;     // 启用全部删除按钮
    updateUndoRedoBtns();               // 刷新撤回还原按钮状态
    applyPlatformDrawZIndex();          // 绘制模式下：面积小的平台在上层可点击

    // 创建十字虚线和坐标提示（SVG放到stageEl，使用屏幕坐标，不受地图缩放影响）
    if (!drawCrosshairV) {
      // 创建SVG容器（放到stageEl，100%填充，自动适应尺寸变化）
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'crosshair-svg');
      svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:60;overflow:visible;';
      stageEl.appendChild(svg);

      // 定义蒙版：白色区域显示虚线，黑色区域隐藏虚线（鼠标附近）
      // 使用 userSpaceOnUse 单位，避免 objectBoundingBox 对线条解析异常
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const mask = document.createElementNS('http://www.w3.org/2000/svg', 'mask');
      mask.setAttribute('id', 'crosshair-mask');
      mask.setAttribute('maskUnits', 'userSpaceOnUse');
      mask.setAttribute('maskContentUnits', 'userSpaceOnUse');
      // 白色全覆盖矩形（显示）— 用超大范围确保覆盖整个舞台
      const maskWhite = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      maskWhite.setAttribute('x', '-10000');
      maskWhite.setAttribute('y', '-10000');
      maskWhite.setAttribute('width', '20000');
      maskWhite.setAttribute('height', '20000');
      maskWhite.setAttribute('fill', 'white');
      mask.appendChild(maskWhite);
      // 黑色矩形（鼠标附近隐藏虚线），尺寸为0初始隐藏
      const maskBlack = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      maskBlack.setAttribute('class', 'crosshair-mask-hole');
      maskBlack.setAttribute('x', '0');
      maskBlack.setAttribute('y', '0');
      maskBlack.setAttribute('width', '0');
      maskBlack.setAttribute('height', '0');
      maskBlack.setAttribute('fill', 'black');
      mask.appendChild(maskBlack);
      defs.appendChild(mask);
      svg.appendChild(defs);

      // 垂直线（应用蒙版）
      const lineV = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      lineV.setAttribute('class', 'crosshair-line-v');
      lineV.setAttribute('x1', '0');
      lineV.setAttribute('y1', '0');
      lineV.setAttribute('x2', '0');
      lineV.setAttribute('y2', '100%');
      lineV.setAttribute('stroke', 'rgba(255,255,255,0.7)');
      lineV.setAttribute('stroke-width', '3');
      lineV.setAttribute('stroke-dasharray', '10,10');
      lineV.setAttribute('shape-rendering', 'crispEdges');
      lineV.setAttribute('mask', 'url(#crosshair-mask)');
      svg.appendChild(lineV);

      // 水平线（应用蒙版）
      const lineH = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      lineH.setAttribute('class', 'crosshair-line-h');
      lineH.setAttribute('x1', '0');
      lineH.setAttribute('y1', '0');
      lineH.setAttribute('x2', '100%');
      lineH.setAttribute('y2', '0');
      lineH.setAttribute('stroke', 'rgba(255,255,255,0.7)');
      lineH.setAttribute('stroke-width', '3');
      lineH.setAttribute('stroke-dasharray', '10,10');
      lineH.setAttribute('shape-rendering', 'crispEdges');
      lineH.setAttribute('mask', 'url(#crosshair-mask)');
      svg.appendChild(lineH);

      drawCrosshairV = svg;  // 存储SVG容器引用
      drawCrosshairH = svg;  // 同一容器，通过class区分线条

      // 坐标提示也放到stageEl（用屏幕坐标定位，无需反向缩放，避免缩放时顿挫）
      drawCoordTip = document.createElement('div');
      drawCoordTip.style.cssText = 'position:absolute;color:#42ffff;background:rgba(0,0,0,0.5);padding:3px 6px;border-radius:4px;font-size:14px;font-weight:bold;font-family:inherit;pointer-events:none;z-index:61;white-space:pre-line;display:none;';
      stageEl.appendChild(drawCoordTip);
    }
  } else {
    platDrawBtn.textContent = '绘制平台';
    platDrawBtn.style.background = '';
    platDrawBtn.style.borderColor = '';
    stageEl.classList.remove('drawing');
    drawGridEl.style.display = 'none';
    clearBgTimers();

    // 退出绘制模式：
    // 1) mapBgDraw 叠层 0.3s 淡出 → 露出底下用户设定的纯色（savedWorldColor），实现平滑过渡
    // 2) 同步舞台 stageBgDraw 淡出，回到用户自定义舞台渐变
    mapBgDraw.style.transition    = transition;
    mapBgDanger.style.transition  = 'none';
    mapBgConfirm.style.transition = 'none';
    mapBgDanger.style.opacity  = '0';
    mapBgConfirm.style.opacity = '0';
    stageBgDraw.style.transition    = transition;
    stageBgDanger.style.transition  = 'none';
    stageBgConfirm.style.transition = 'none';
    stageBgDanger.style.opacity  = '0';
    stageBgConfirm.style.opacity = '0';
    requestAnimationFrame(function(){
      mapBgDraw.style.opacity   = '0';
      stageBgDraw.style.opacity = '0';
    });

    // 移除十字虚线（V/H引用同一SVG容器，只移除一次）和坐标提示
    if (drawCrosshairV) { drawCrosshairV.remove(); drawCrosshairV = null; }
    drawCrosshairH = null;
    if (drawCoordTip) { drawCoordTip.remove(); drawCoordTip = null; }

    // 退出绘制模式 → 清空撤回还原历史
    undoStack = []; redoStack = []; updateUndoRedoBtns();
    platEditRow.style.display = 'none'; // 隐藏撤回/还原/全部删除

    // 0.3s 过渡结束后，如果用户在显示设置里改了世界颜色，保持最新值写回（不影响动画，只是兜底）
    bgTimer3 = setTimeout(function(){
      mapEl.style.background = worldColor.value;
      bgTimer3 = null;
    }, (DUR + 0.05) * 1000);

    if (gridOn) mapGridEl.style.display = 'block';
    if (drawPreview) {
      drawPreview.remove();
      drawPreview = null;
    }
    drawStart = null;
    isDrawing = false;
    draggingPlatform = null;
    dragOffset = null;
    dragOrig = null;
    stageEl.classList.remove('drag-active');  // 兜底：拖拽中切出绘制模式时清除
    // 清理 Shift 框选状态
    shiftSelecting = false;
    shiftSelectStart = null;
    shiftSelectDir = 0;
    if (shiftSelectBox) { shiftSelectBox.style.display = 'none'; }
    clearPlatformSelection();
    // 清理所有平台的 drag-delete / highlight 状态
    Array.from(mapEl.querySelectorAll('.platform.normal.drag-delete')).forEach(el => el.classList.remove('drag-delete'));
    Array.from(mapEl.querySelectorAll('.platform.normal.highlight')).forEach(el => el.classList.remove('highlight'));
    hideResizeHandles();
    setHintMode(false);
    updatePlatListUI(); // 禁用宽高输入框与删除按钮
    platDelAllBtn.disabled = true; // 禁用全部删除按钮
    applyPlatformDrawZIndex();     // 非绘制模式：清 z-index，恢复 CSS 默认叠加
  }
});

// 一键删除所有平台：先记录整体"删除前"快照 → 按列表顺序（自上而下）间隔 0.2s 依次调用删除动画
platDelAllBtn.addEventListener('click', function() {
  if (!drawMode) return;
  // 快照当前所有非地面平台 DOM 元素（按列表顺序 = DOM 顺序）
  const els = Array.from(mapEl.querySelectorAll('.platform.normal'));
  if (els.length === 0) return;
  const beforeSnap = snapPlatforms(); // 全删前的整体快照（撤回一步即可全部恢复）
  els.forEach(function(el, i) {
    setTimeout(function() { playDeleteAnimation(el); }, i * 200);
  });
  recordUndoStep(beforeSnap); // 只记录 1 步历史，不是 N 步（点一下撤回可一次性全部恢复）
});

stageEl.addEventListener('mousedown', function(e) {
  if (!drawMode || e.button !== 0) return;
  if (cameraLocked) return;   // 摄像机锁定时禁用平台绘制/拖拽/框选
  // 鼠标按下 → 暂停平台 hover 高亮（拖拽绘制/框选/拖动平台期间均生效，松开恢复）
  stageEl.classList.add('drag-active');
  drawZoom = zoom;
  drawMapLeft = parseFloat(mapEl.style.left) || 0;
  drawMapTop = parseFloat(mapEl.style.top) || 0;
  const coord = screenToMapCoord(e.clientX, e.clientY, drawZoom, drawMapLeft, drawMapTop);
  const target = e.target;

  // 手柄点击由手柄自身监听器处理（stopPropagation），此处不会触发
  // 点击其他任何位置 → 隐藏调整手柄（退出大小编辑模式）
  hideResizeHandles();

  // 检测是否点击在普通平台上 → 进入拖拽平台模式（单平台 / 多选平台）
  const clickedPlatform = (target && target.classList && target.classList.contains('platform') && !target.classList.contains('ground')) ? target : null;
  // ===== Shift + 左键 点空白：进入框选模式（不绘制平台）；点平台：进入多选切换 =====
  if (e.shiftKey && !clickedPlatform) {
    // 先清除之前的选中状态
    clearPlatformSelection();
    shiftSelecting = true;
    shiftSelectStart = { x: coord.x, y: coord.y };
    shiftSelectDir = 0;

    // 创建/显示框选框 DOM
    if (!shiftSelectBox) {
      shiftSelectBox = document.createElement('div');
      shiftSelectBox.id = 'shiftSelectBox';
      mapEl.appendChild(shiftSelectBox);
    }
    shiftSelectBox.style.display = 'block';
    shiftSelectBox.style.left = coord.x + 'px';
    shiftSelectBox.style.bottom = coord.y + 'px';
    shiftSelectBox.style.width = '0px';
    shiftSelectBox.style.height = '0px';
    return;
  }

  if (clickedPlatform) {
    const idx = +clickedPlatform.dataset.idx;
    const p = platforms[idx];
    if (p) {
      // 先保证组关系一致性（<2 的组自动解散）
      rebuildGroupsFromPlatforms();
      // 非 Shift + 组选择：如果该平台属于组合且当前没有多选选中，则先扩展选中到整组
      // (这样只要点击组内任意一个就能同时选中其它，后续直接进入多选拖拽流程)
      if (!e.shiftKey) {
        const hasGroup = p.gid != null;
        const gpids = hasGroup ? getGroupPidsOfPid(p.pid) : [];
        if (gpids.length >= 2) {
          // 若当前已经有一些组内成员选中但不全 → 先补齐到全部；否则从 0 个选中 → 全选
          const allGroupSelected = gpids.every(id => selectedPlatformPids.has(toPidKey(id)));
          if (!allGroupSelected) {
            // 清空其它非组内选中，保留点击的为核心再扩展全组
            clearPlatformSelection();
            selectPlatformByPid(p.pid);
            extendSelectionToGroup(p.pid);
          }
        }
      }

      // ===== Shift + 单击平台：切换多选（不清除已有选中）；再次点击取消选择 =====
      if (e.shiftKey) {
        const key = toPidKey(p.pid);
        if (selectedPlatformPids.has(key)) {
          // 已选中 → 取消单个选中
          selectedPlatformPids.delete(key);
          clickedPlatform.classList.remove('selected');
        } else {
          // 未选中 → 加入选中集合（保留其它已选）
          selectedPlatformPids.add(key);
          clickedPlatform.classList.add('selected');
        }
      }

      let clickedIsSelected = clickedPlatform.classList.contains('selected');
      let selectionCount = selectedPlatformPids.size;

      // === 多选拖拽：点击的平台已被选中，且选中数量 >= 2 ===
      if (clickedIsSelected && selectionCount >= 2) {
        multiDragging = true;
        multiDragList = [];
        const snapBefore = snapPlatforms();
        multiDragSnapBefore = snapBefore;

        // 构建所有选中平台的原始信息记录
        platforms.forEach(function(plat, i) {
          if (plat.isGround) return;
          if (!selectedPlatformPids.has(toPidKey(plat.pid))) return;
          const el = mapEl.querySelector('.platform.normal[data-pid="' + plat.pid + '"]');
          multiDragList.push({
            idx: i,
            pid: plat.pid,
            origX: plat.x,
            origY: plat.y,
            el: el
          });
        });

        // 以点击的平台为参照（delta 为 0）计算每个选中平台相对参照平台的偏移（网格单位）
        const refP = p;
        multiDragRefOrig = { x: refP.x, y: refP.y };
        multiDragCoordOffset = {
          x: coord.x - refP.x * GRID,
          y: coord.y - refP.y * GRID
        };
        multiDragList.forEach(function(item) {
          item.deltaX = item.origX - refP.x;
          item.deltaY = item.origY - refP.y;
        });
        wasInDeleteZone = false;
        return;
      }

      // === 单平台拖拽 / Shift 单选 / Shift 取消单选 ===
      if (!e.shiftKey) {
        // 非 Shift：恢复原行为（无条件清选中→选中点击的→进入拖拽）
        // 之前误把它包在"if (clickedIsSelected)"里导致单击未选中平台时既不选中也不能拖
        clearPlatformSelection();
        selectPlatformByPid(p.pid);
        draggingPlatform = { idx, el: clickedPlatform };
        const originX = p.x * GRID;
        const originY = p.y * GRID;
        dragOffset = { x: coord.x - originX, y: coord.y - originY };
        dragOrig = { x: p.x, y: p.y, el: clickedPlatform };
        wasInDeleteZone = false;
        dragOrig._snapBefore = snapPlatforms();
        return;
      }
      // Shift+点击后：只剩 1 个选中且当前是点击的那个 → 单平台拖拽（保留其他选择状态已被切换处理好）
      if (clickedIsSelected) {
        draggingPlatform = { idx, el: clickedPlatform };
        const originX = p.x * GRID;
        const originY = p.y * GRID;
        dragOffset = { x: coord.x - originX, y: coord.y - originY };
        dragOrig = { x: p.x, y: p.y, el: clickedPlatform };
        wasInDeleteZone = false;
        dragOrig._snapBefore = snapPlatforms();
        return;
      }
      // Shift+点击把自己也取消选中了 → 不进拖拽
      return;
    }
  }

  // 点击空白处 → 清除选中状态（只有非 Shift 点空白才清除；Shift 点空白已进框选）
  clearPlatformSelection();

  // 否则进入框选绘制
  const gx = Math.round(coord.x / DRAW_GRID) * DRAW_GRID;
  const gy = Math.round(coord.y / DRAW_GRID) * DRAW_GRID;
  drawStart = { x: gx, y: gy };
  // 记录绘制前快照（绘制完成后确有新增平台则 push 到 undo 栈）
  drawStart._snapBefore = snapPlatforms();
  isDrawing = true;

  if (!drawPreview) {
    drawPreview = document.createElement('div');
    drawPreview.style.cssText = 'position:absolute;border:2px solid #FF0000;background:rgba(255,0,0,0.1);pointer-events:none;z-index:50;';
    mapEl.appendChild(drawPreview);
    // 尺寸标签（与编辑平台时的 platSizeTag 风格一致，显示在预览矩形内部中央）
    const tag = document.createElement('div');
    tag.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-weight:bold;-webkit-text-stroke:0.8px #000;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;pointer-events:none;white-space:nowrap;text-align:center;font-size:14px;line-height:1.35;letter-spacing:0.5px;font-family:inherit;';
    drawPreview.appendChild(tag);
  }
  drawPreview.style.left = gx + 'px';
  drawPreview.style.bottom = gy + 'px';
  drawPreview.style.width = '0px';
  drawPreview.style.height = '0px';
  // 初始空尺寸
  const tag = drawPreview.firstChild;
  if (tag) { tag.style.display = 'none'; }
});

// 双击平台 → 显示调整手柄
stageEl.addEventListener('dblclick', function(e) {
  if (!drawMode) return;
  const target = e.target;
  if (!(target && target.classList && target.classList.contains('platform') && !target.classList.contains('ground'))) return;
  const idx = +target.dataset.idx;
  const p = platforms[idx];
  if (!p) return;
  const pid = p.pid;

  // 先确保 group 状态一致（<2 的组解散）
  rebuildGroupsFromPlatforms();

  // 1. 双击一个已进入组合的平台 = 解除该平台所在组合（优先级最高，避免被建组分支拦截）
  //    注意：建组后会保留 selectedPlatformPids，所以双击组内平台时也会满足"多选建组"条件；
  //          必须先判断"已组合"才能让解组生效。
  const groupPids = getGroupPidsOfPid(pid);
  if (groupPids.length >= 2) {
    const snapBefore = snapPlatforms();
    // 解散该组（先取 gid，因为 getGroupPidsOfPid 已验证 >=2）
    const gid = p.gid;
    if (gid != null) dissolveGroup(gid);
    recordUndoStep(snapBefore);
    // 只保留点击的那个平台单独选中
    clearPlatformSelection();
    selectPlatformByPid(pid);
    hideResizeHandles();
    showGroupBubble('✂ 已解除组合（' + groupPids.length + ' 个平台）');
    return;
  }

  // 2. 当前有 2 个及以上选中的平台（多选状态下双击任意选中平台 = 绑定成组合）
  //    走到这里说明双击的平台不在任何组合中，此时若它在多选集合里 → 合并到同一个新组
  //    合并规则：若选中的任一平台已属于其他组 → 把那些组的全部平台一起并入（全选+合并）
  const selCount = selectedPlatformPids.size;
  if (selCount >= 2 && selectedPlatformPids.has(toPidKey(pid))) {
    const rawPidList = Array.from(selectedPlatformPids);
    // 收集涉及到的所有 gid（包括未分组平台自身 = null）
    const gidsInvolved = new Set();
    rawPidList.forEach(function(key) {
      const plat = platforms.find(function(pp){ return pidEq(pp.pid, key); });
      if (plat && plat.gid != null) gidsInvolved.add(plat.gid);
    });
    // 最终并集：所有被选中的平台 + 涉及组里的全部平台
    const mergedSet = new Set();
    rawPidList.forEach(k => mergedSet.add(k));
    platforms.forEach(function(plat) {
      if (plat.isGround) return;
      if (plat.gid != null && gidsInvolved.has(plat.gid)) {
        mergedSet.add(toPidKey(plat.pid));
      }
    });
    const pidList = Array.from(mergedSet);
    // 合并涉及多个组 → 把新并入的平台也选中（UI 反馈"已全部选中合并到一组"）
    if (pidList.length > rawPidList.length) {
      pidList.forEach(k => selectedPlatformPids.add(k));
      applyPlatformSelectionUI();
    }
    // 记录建组前快照（撤回 → 解散新建的组回到未分组状态）
    const snapBefore = snapPlatforms();
    // 解散这些平台的原有组，再分配一个新组号
    const newGid = createGroupFromPids(pidList);
    if (newGid != null) {
      recordUndoStep(snapBefore);
      showGroupBubble('🔗 已绑定为一组（' + pidList.length + ' 个平台）');
    }
    // 保留当前选中状态，不显示手柄
    hideResizeHandles();
    return;
  }

  // 3. 无组 / 非多选 → 保持原行为：显示调整大小手柄
  showResizeHandles(idx);
});

// 根据鼠标屏幕坐标刷新十字虚线与坐标提示（内容、定位）
// 同时被 mousemove 与缩放逻辑调用：缩放时鼠标静止，需据此重算 X/Y 世界坐标
// 返回当前鼠标对应的世界像素坐标 {x, y}（供 resizing/框选等复用）
function updateDrawCrosshairAndTip(clientX, clientY) {
  if (!drawMode) return null;
  // 十字虚线SVG放到stageEl中，使用舞台屏幕坐标（不随地图缩放），精确对齐像素
  const stageRect = stageEl.getBoundingClientRect();
  const screenX = clientX - stageRect.left;  // 舞台内屏幕X（left=0）
  const screenY = clientY - stageRect.top;   // 舞台内屏幕Y（top=0）
  // stroke-width=3为奇数，坐标+0.5对齐像素边界；用Math.round取整再偏移
  const snapX = Math.round(screenX) + 0.5;
  const snapY = Math.round(screenY) + 0.5;
  const stageW = stageEl.clientWidth || stageRect.width;
  const stageH = stageEl.clientHeight || stageRect.height;

  // 坐标提示使用世界坐标计算数值，但用屏幕坐标定位（在stageEl内，无需反向缩放）
  const curMapLeft = parseFloat(mapEl.style.left) || 0;
  const curMapTop = parseFloat(mapEl.style.top) || 0;
  const coord = screenToMapCoord(clientX, clientY, zoom, curMapLeft, curMapTop);

  if (drawCrosshairV && drawCrosshairH) {
    const lineV = drawCrosshairV.querySelector('.crosshair-line-v');
    const lineH = drawCrosshairV.querySelector('.crosshair-line-h');
    if (lineV) {
      lineV.setAttribute('x1', snapX);
      lineV.setAttribute('x2', snapX);
      lineV.setAttribute('y1', 0);
      lineV.setAttribute('y2', stageH);
    }
    if (lineH) {
      lineH.setAttribute('x1', 0);
      lineH.setAttribute('x2', stageW);
      lineH.setAttribute('y1', snapY);
      lineH.setAttribute('y2', snapY);
    }
    // 更新蒙版黑色矩形（鼠标附近隐藏虚线，避免与鼠标重叠）
    const maskHole = drawCrosshairV.querySelector('.crosshair-mask-hole');
    if (maskHole) {
      const holeSize = 24; // 鼠标周围24px范围隐藏虚线
      maskHole.setAttribute('x', screenX - holeSize / 2);
      maskHole.setAttribute('y', screenY - holeSize / 2);
      maskHole.setAttribute('width', holeSize);
      maskHole.setAttribute('height', holeSize);
    }
  }
  if (drawCoordTip) {
    // 坐标提示（网格单位，基于世界左上角，规整到0.25格）
    const rawGx = coord.x / GRID;
    const rawGy = coord.y / GRID;
    const gx = (Math.round(rawGx * 4) / 4).toFixed(2);
    const gy = (Math.round(rawGy * 4) / 4).toFixed(2);
    drawCoordTip.textContent = 'X: ' + gx + '格\nY: ' + gy +'格';
    drawCoordTip.style.display = 'block';
    // 测量提示框尺寸
    const tipW = drawCoordTip.offsetWidth;
    const tipH = drawCoordTip.offsetHeight;
    // 初始定位在鼠标右下（屏幕坐标，top定位）
    let tipLeft = screenX + 15;
    let tipTop = screenY + 15;
    // 避开正在绘制的预览框（预览框在mapEl内用世界坐标+bottom，需转为屏幕坐标）
    if (drawPreview && drawPreview.style.display !== 'none' && drawPreview.style.width !== '0px') {
      const prLeft = parseFloat(drawPreview.style.left);
      const prBottom = parseFloat(drawPreview.style.bottom);
      const prW = parseFloat(drawPreview.style.width);
      const prH = parseFloat(drawPreview.style.height);
      // 世界坐标 → 屏幕坐标
      const prScrLeft = curMapLeft + prLeft * zoom;
      const prScrTop = curMapTop + (mapTotalH - prBottom - prH) * zoom;
      const prScrW = prW * zoom;
      const prScrH = prH * zoom;
      const prScrRight = prScrLeft + prScrW;
      const prScrBottom = prScrTop + prScrH;
      // 鼠标在预览框内 → 将提示移到预览框外
      if (screenX >= prScrLeft - 4 && screenX <= prScrRight + 4 &&
          screenY >= prScrTop - 4 && screenY <= prScrBottom + 4) {
        const tipRight = tipLeft + tipW;
        const tipBottom = tipTop + tipH;
        if (prScrLeft > tipRight + 10) {
          tipLeft = Math.max(2, prScrLeft - tipW - 10);
        } else if (prScrRight < tipLeft - 10) {
          tipLeft = Math.min(stageW - tipW - 2, prScrRight + 10);
        }
        if (prScrTop > tipBottom + 10) {
          tipTop = Math.max(2, prScrTop - tipH - 10);
        } else if (prScrBottom < tipTop - 10) {
          tipTop = Math.min(stageH - tipH - 2, prScrBottom + 10);
        }
      }
    }
    // 边界裁剪
    if (tipLeft < 2) tipLeft = 2;
    if (tipTop < 2) tipTop = 2;
    if (tipLeft + tipW > stageW) tipLeft = stageW - tipW - 2;
    if (tipTop + tipH > stageH) tipTop = stageH - tipH - 2;
    drawCoordTip.style.left = tipLeft + 'px';
    drawCoordTip.style.top = tipTop + 'px';
  }
  return coord;
}

document.addEventListener('mousemove', function(e) {
  if (!drawMode) return;

  // ========= 更新十字虚线和坐标提示 =========
  drawLastMouseClientX = e.clientX;
  drawLastMouseClientY = e.clientY;
  drawMouseInStage = true;
  const coord = updateDrawCrosshairAndTip(e.clientX, e.clientY);

  // ========= 调整平台大小（使用世界像素坐标，避免浮点精度问题） =========
  if (resizingEdge && resizeTarget !== null && resizeStart) {
    const p = platforms[resizeTarget];
    if (!p) { resizingEdge = null; return; }
    // 使用函数开头的 coord 变量
    // 吸至 25px 绘制网格
    const snapX = Math.round(coord.x / DRAW_GRID) * DRAW_GRID;
    const snapY = Math.round(coord.y / DRAW_GRID) * DRAW_GRID;

    const sxPx = resizeStart.x * GRID; // 起始左边界（世界 px）
    const syPx = resizeStart.y * GRID; // 起始下边界（世界 px）
    const swPx = resizeStart.w * GRID; // 起始宽度（世界 px）
    const shPx = resizeStart.h * GRID; // 起始高度（世界 px）
    const minPx = DRAW_GRID;           // 最小尺寸 25px

    let newXPx = sxPx, newYPx = syPx, newWPx = swPx, newHPx = shPx;

    switch (resizingEdge) {
      case 'e': {
        // 钳制右边界不超过世界宽度（sxPx + newWPx <= worldW）
        newWPx = Math.max(minPx, Math.min(snapX - sxPx, worldW - sxPx));
        break;
      }
      case 'w': {
        const newRight = sxPx + swPx;
        const clampedLeft = Math.min(newRight - minPx, snapX);
        newXPx = Math.max(0, clampedLeft);
        newWPx = newRight - newXPx;
        break;
      }
      case 'n': {
        // 钳制上边界不超过世界高度（syPx + newHPx <= mapTotalH）
        newHPx = Math.max(minPx, Math.min(snapY - syPx, mapTotalH - syPx));
        break;
      }
      case 's': {
        const newTop = syPx + shPx;
        const clampedBot = Math.min(newTop - minPx, snapY);
        newYPx = Math.max(0, clampedBot);
        newHPx = newTop - newYPx;
        break;
      }
    }

    // 转为网格单位（0.01 精度足够，DRAW_GRID = 25px = 0.25 格）
    p.x = +(newXPx / GRID).toFixed(2);
    p.y = +(newYPx / GRID).toFixed(2);
    p.w = +(newWPx / GRID).toFixed(2);
    p.h = +(newHPx / GRID).toFixed(2);

    // 更新平台 DOM
    const el = mapEl.querySelector('.platform.normal[data-idx="' + resizeTarget + '"]');
    if (el) {
      el.style.left   = newXPx + 'px';
      el.style.bottom = newYPx + 'px';
      el.style.width  = newWPx + 'px';
      el.style.height = newHPx + 'px';
      // 调整大小/位置时实时刷新内部 XY 坐标标签（显示与 renderPlatforms 一致，含尺寸不足隐藏）
      refreshSelCoordFit(el, p);
    }
    positionResizeHandles();
    return;
  }

  // ========= 其余事件需要 drawStart / dragOffset / shiftSelectStart → 它们在 stage mousedown 中才设置 drawZoom 等 =========
  // 使用函数开头的 coord 变量

  // ===== Shift 框选：实时更新框选框位置 & 高亮选中 =====
  if (shiftSelecting && shiftSelectStart) {
    const sx = shiftSelectStart.x;
    const sy = shiftSelectStart.y;
    const cx = coord.x;
    const cy = coord.y;

    // 计算方向（基于 X 轴）：1 = 左→右，-1 = 右→左
    if (cx !== sx) shiftSelectDir = (cx > sx) ? 1 : -1;

    // 框选框（归一化坐标用于显示）
    const bx1 = Math.min(sx, cx);
    const by1 = Math.min(sy, cy);
    const bx2 = Math.max(sx, cx);
    const by2 = Math.max(sy, cy);

    if (shiftSelectBox) {
      shiftSelectBox.style.left = bx1 + 'px';
      shiftSelectBox.style.bottom = by1 + 'px';
      shiftSelectBox.style.width = (bx2 - bx1) + 'px';
      shiftSelectBox.style.height = (by2 - by1) + 'px';
    }

    // 根据方向判定选中
    // dir > 0（左→右）：平台与框选矩形有任何重叠即选中
    // dir < 0（右→左）：平台必须被框选矩形完整包含才选中
    const normalPlats = platforms.filter(function(p){ return !p.isGround; });

    normalPlats.forEach(function(p){
      const px = p.x * GRID;
      const py = p.y * GRID;
      const pw = p.w * GRID;
      const ph = p.h * GRID;
      // 平台矩形右/上
      const pRight = px + pw;
      const pTop   = py + ph;

      let hit = false;
      if (shiftSelectDir > 0) {
        // 重叠判定：!（完全不相交）
        const noOverlap = (pRight < bx1) || (px > bx2) || (pTop < by1) || (py > by2);
        hit = !noOverlap;
      } else if (shiftSelectDir < 0) {
        // 完整包含：平台四边都在框选范围内
        hit = (px >= bx1) && (pRight <= bx2) && (py >= by1) && (pTop <= by2);
      }

      if (hit) {
        // 添加到集合 + UI 标记
        selectedPlatformPids.add(toPidKey(p.pid));
        const el = mapEl.querySelector('.platform.normal[data-pid="' + p.pid + '"]');
        if (el) el.classList.add('selected');
      } else {
        selectedPlatformPids.delete(toPidKey(p.pid));
        const el = mapEl.querySelector('.platform.normal[data-pid="' + p.pid + '"]');
        if (el) el.classList.remove('selected');
      }
    });
    return;
  }

  // ===== 多选平台同步拖拽 =====
  if (multiDragging && multiDragList.length > 0 && multiDragCoordOffset) {
    // 计算参照平台的新位置（按 0.25 格吸附）
    const refNewXPx = coord.x - multiDragCoordOffset.x;
    const refNewYPx = coord.y - multiDragCoordOffset.y;
    const refSnapXPx = Math.round(refNewXPx / DRAW_GRID) * DRAW_GRID;
    const refSnapYPx = Math.round(refNewYPx / DRAW_GRID) * DRAW_GRID;
    const refNewGridX = refSnapXPx / GRID;
    const refNewGridY = refSnapYPx / GRID;

    // 相对于原始参照位置的位移（网格单位）
    const dxG = refNewGridX - multiDragRefOrig.x;
    const dyG = refNewGridY - multiDragRefOrig.y;

    // 同步移动所有选中的平台（网格单位 + 钳制到世界边界内）
    let firstPlatForDelete = null;
    let firstElForDelete = null;

    multiDragList.forEach(function(item) {
      const p = platforms[item.idx];
      if (!p) return;
      let targetXG = item.origX + dxG;
      let targetYG = item.origY + dyG;
      // 钳制：平台右边不超过世界右、上边不超过世界上
      // 下边界不钳制：允许向下拖出世界到底部删除区（用户可能要删除平台）
      targetXG = Math.max(0, Math.min(targetXG, (worldW / GRID) - p.w));
      targetYG = Math.min(targetYG, (mapTotalH / GRID) - p.h);
      targetXG = +targetXG.toFixed(2);
      targetYG = +targetYG.toFixed(2);
      p.x = targetXG;
      p.y = targetYG;
      if (item.el) {
        item.el.style.left = (targetXG * GRID) + 'px';
        item.el.style.bottom = (targetYG * GRID) + 'px';
        // 多选拖拽中每帧实时刷新被拖平台内部 XY 坐标标签
        refreshSelCoordFit(item.el, p);
      }
      if (!firstPlatForDelete) { firstPlatForDelete = p; firstElForDelete = item.el; }
    });

    // 删除区域判定（复用第一个平台来判断）
    const stageRect = stageEl.getBoundingClientRect();
    const inBottomZone = e.clientY >= stageRect.bottom - stageRect.height * 0.1;
    if (inBottomZone) {
      let anyNotInDelete = false;
      multiDragList.forEach(function(item) {
        const el = item.el;
        if (el && !el.classList.contains('drag-delete')) {
          const phPx = (platforms[item.idx] ? platforms[item.idx].h : 1) * GRID;
          const fs = Math.max(9, Math.min(22, phPx * 0.32));
          el.style.setProperty('--del-fs', fs + 'px');
          el.classList.add('drag-delete');
          wasInDeleteZone = true;
        }
      });
      if (wasInDeleteZone) {
        clearBgTimers();
        setMapBg('danger', 0.2);
      }
    } else {
      let anyInDelete = false;
      multiDragList.forEach(function(item) {
        const el = item.el;
        if (el && el.classList.contains('drag-delete')) {
          el.classList.remove('drag-delete');
          el.style.removeProperty('--del-fs');
          anyInDelete = true;
        }
      });
      if (anyInDelete) {
        clearBgTimers();
        restoreDrawBg(0.5);
      }
    }
    return;
  }

  // 拖拽平台
  if (draggingPlatform) {
    const p = platforms[draggingPlatform.idx];
    if (!p) { draggingPlatform = null; return; }
    let newX = Math.round((coord.x - dragOffset.x) / DRAW_GRID) * DRAW_GRID;
    let newY = Math.round((coord.y - dragOffset.y) / DRAW_GRID) * DRAW_GRID;
    // 钳制到世界边界内（与多选拖拽一致），避免拖出边缘后释放无法渲染
    // 下边界不钳制：允许向下拖出世界到底部删除区（用户可能要删除平台）
    const maxXg = Math.max(0, (worldW / GRID) - p.w);
    const maxYg = Math.max(0, (mapTotalH / GRID) - p.h);
    const newGridX = Math.max(0, Math.min(newX / GRID, maxXg));
    const newGridY = Math.min(newY / GRID, maxYg);
    p.x = +newGridX.toFixed(2);
    p.y = +newGridY.toFixed(2);
    draggingPlatform.el.style.left = (newGridX * GRID) + 'px';
    draggingPlatform.el.style.bottom = (newGridY * GRID) + 'px';
    // 单平台拖拽中每帧实时刷新内部 XY 坐标标签
    refreshSelCoordFit(draggingPlatform.el, p);

    // 检测鼠标是否处于舞台底部 10% 区域内 → 触发删除确认视觉效果
    const stageRect = stageEl.getBoundingClientRect();
    const inBottomZone = e.clientY >= stageRect.bottom - stageRect.height * 0.1;
    const el = draggingPlatform.el;
    if (inBottomZone) {
      if (!el.classList.contains('drag-delete')) {
        // 刚进入底部删除区域：设置删除提示字号（与 plat-size-tag 同款自适应公式）
        const phPx = p.h * GRID; // 平台世界像素高度
        const fs = Math.max(9, Math.min(22, phPx * 0.32));
        el.style.setProperty('--del-fs', fs + 'px');
        el.classList.add('drag-delete');
        wasInDeleteZone = true; // 标记：本次拖拽曾进入过删除区域
        // 渐变背景 0.2s 过渡为危险色
        clearBgTimers();
        setMapBg('danger', 0.2);
      }
    } else {
      if (el.classList.contains('drag-delete')) {
        el.classList.remove('drag-delete');
        el.style.removeProperty('--del-fs');
        // 背景 0.5s 还原绘制纯色
        clearBgTimers();
        restoreDrawBg(0.5);
      }
    }
    return;
  }

  // 框选绘制预览
  if (!drawStart) return;
  lastDrawMoveTs = performance.now();   // 记录绘制中鼠标移动时间（pen 音效据此暂停/恢复）
  const gx = Math.round(coord.x / DRAW_GRID) * DRAW_GRID;
  const gy = Math.round(coord.y / DRAW_GRID) * DRAW_GRID;

  const x1 = Math.min(drawStart.x, gx);
  const y1 = Math.min(drawStart.y, gy);
  const x2 = Math.max(drawStart.x, gx);
  const y2 = Math.max(drawStart.y, gy);

  drawPreview.style.left = x1 + 'px';
  drawPreview.style.bottom = y1 + 'px';
  drawPreview.style.width = (x2 - x1) + 'px';
  drawPreview.style.height = (y2 - y1) + 'px';
  // 更新尺寸标签（显示在预览矩形内部中央，与编辑平台时的宽高提示一致，但不显示手柄）
  // 复用 showPlatTag 测量逻辑（CSS 居中定位，仅控制 inline display）
  const tag = drawPreview.firstChild;
  if (tag) {
    const pw = (x2 - x1) / GRID;
    const ph = (y2 - y1) / GRID;
    const shown = showPlatTag(tag, { w: pw, h: ph },
      '宽度: ' + pw.toFixed(2) + '格<br>高度: ' + ph.toFixed(2) + '格',
      '宽度: ' + pw.toFixed(2) + '格 X 高度: ' + ph.toFixed(2) + '格');
    tag.style.display = shown ? 'block' : 'none';
  }
});

document.addEventListener('mouseup', function(e) {
  if (!drawMode) return;
  // 鼠标松开 → 恢复平台 hover 高亮
  stageEl.classList.remove('drag-active');

  // 结束调整大小
  if (resizingEdge) {
    const snapBefore = resizeStart && resizeStart._snapBefore ? resizeStart._snapBefore : null;
    const oldX = resizeStart ? resizeStart.x : null;
    const oldY = resizeStart ? resizeStart.y : null;
    const oldW = resizeStart ? resizeStart.w : null;
    const oldH = resizeStart ? resizeStart.h : null;
    resizingEdge = null;
    resizeStart = null;
    renderPlatforms(); // 重建 DOM，保持手柄对应正确平台
    showResizeHandles(resizeTarget);
    // 如确有变化，记录撤回一步（传 before 快照）
    if (snapBefore) {
      const p = platforms[resizeTarget];
      if (p && (p.x !== oldX || p.y !== oldY || p.w !== oldW || p.h !== oldH)) {
        recordUndoStep(snapBefore);
      }
    }
    return;
  }

  // 结束平台拖拽
  if (draggingPlatform) {
    const stageRect = stageEl.getBoundingClientRect();
    const inBottomZone = e.clientY >= stageRect.bottom - stageRect.height * 0.1;
    const idx = draggingPlatform.idx;
    const el = draggingPlatform.el;
    const snapBefore = dragOrig && dragOrig._snapBefore ? dragOrig._snapBefore : null;
    const origX = dragOrig ? dragOrig.x : null;
    const origY = dragOrig ? dragOrig.y : null;

    if (inBottomZone && dragOrig) {
      // === 删除流程：先记录删除前快照，再调坠落动画 ===
      playDeleteAnimation(el);
      if (snapBefore) recordUndoStep(snapBefore);

    } else if (dragOrig) {
      // === 根据 wasInDeleteZone 决定：返回原位 OR 接受新位置 ===
      const p = platforms[idx];
      clearBgTimers();
      if (el) {
        el.classList.remove('drag-delete');
        el.style.removeProperty('--del-fs');
      }

      if (wasInDeleteZone) {
        // 曾进入过删除区域 → 取消删除，平台 0.5s 返回原位置，背景 0.5s 还原
        // 未接受新位置（最终回到 origX origY，若 origX origY 与起始一致，不记录撤回
        restoreDrawBg(0.5);
        if (p) {
          p.x = dragOrig.x;
          p.y = dragOrig.y;
          const origXPx = dragOrig.x * GRID;
          const origYPx = dragOrig.y * GRID;
          if (el) {
            el.classList.add('returning');
            // 下一帧触发过渡动画（浏览器应用新 class 后再设置位置）
            requestAnimationFrame(function(){
              el.style.left = origXPx + 'px';
              el.style.bottom = origYPx + 'px';
            });
            // 动画结束清理
            (function(_el){
              function cleanup(){
                _el.removeEventListener('transitionend', cleanup);
                _el.removeEventListener('webkitTransitionEnd', cleanup);
                _el.classList.remove('returning');
              }
              _el.addEventListener('transitionend', cleanup);
              _el.addEventListener('webkitTransitionEnd', cleanup);
              // 兜底 0.6s 强制清理
              setTimeout(cleanup, 600);
            })(el);
          }
        }
      } else {
        // 从未进入过删除区域 → 接受新位置（mousemove 已做网格吸附），背景无动画
        // 安全钳制：若向下拖出世界（Y<0），钳制回 Y=0
        if (p && p.y < 0) {
          p.y = 0;
          if (el) el.style.bottom = '0px';
        }
        // 如果位置确有变化则记录撤回一步
        if (snapBefore && p && (p.x !== origX || p.y !== origY)) {
          recordUndoStep(snapBefore);
        }
        restoreDrawBg(0.2);
      }
      updatePlatListUI();
    } else {
      if (el) { el.classList.remove('drag-delete'); el.style.removeProperty('--del-fs'); }
      clearBgTimers();
      restoreDrawBg(0.5);
      updatePlatListUI();
    }

    draggingPlatform = null;
    dragOffset = null;
    dragOrig = null;
    return;
  }

  // ===== 结束多选平台拖拽 =====
  if (multiDragging) {
    const stageRect = stageEl.getBoundingClientRect();
    const inBottomZone = e.clientY >= stageRect.bottom - stageRect.height * 0.1;
    const snapBefore = multiDragSnapBefore;
    // 记录起始位置以便比较是否有变化
    const startPositions = multiDragList.map(i => ({ idx: i.idx, origX: i.origX, origY: i.origY }));
    const dragListCopy = multiDragList.slice();

    // 先移除所有 drag-delete 类和过渡清理
    dragListCopy.forEach(function(item){
      if (item.el) {
        item.el.classList.remove('drag-delete');
        item.el.style.removeProperty('--del-fs');
      }
    });
    clearBgTimers();

    if (inBottomZone) {
      // === 多选删除流程：对所有选中平台播放坠落动画，同步记录撤回一步 ===
      if (snapBefore) recordUndoStep(snapBefore);
      // 播放动画后移除所有平台
      dragListCopy.forEach(function(item, i) {
        const el = item.el;
        const delay = i * 0.08; // 依次坠落
        if (el) {
          el.style.transitionDelay = delay + 's';
          playDeleteAnimation(el);
        }
      });
    } else {
      if (wasInDeleteZone) {
        // === 多选取消删除：所有平台 0.5s 返回原位置 ===
        restoreDrawBg(0.5);
        dragListCopy.forEach(function(item){
          const p = platforms[item.idx];
          if (!p) return;
          p.x = item.origX;
          p.y = item.origY;
          const el = item.el;
          if (el) {
            el.classList.add('returning');
            const origXPx = item.origX * GRID;
            const origYPx = item.origY * GRID;
            requestAnimationFrame(function(){
              el.style.left = origXPx + 'px';
              el.style.bottom = origYPx + 'px';
            });
            (function(_el){
              function cleanup(){
                _el.removeEventListener('transitionend', cleanup);
                _el.removeEventListener('webkitTransitionEnd', cleanup);
                _el.classList.remove('returning');
              }
              _el.addEventListener('transitionend', cleanup);
              _el.addEventListener('webkitTransitionEnd', cleanup);
              setTimeout(cleanup, 600);
            })(el);
          }
        });
      } else {
        // === 接受新位置：只要有任一平台位置变化，即记录撤回一步 ===
        // 安全钳制：若向下拖出世界（Y<0），钳制回 Y=0
        dragListCopy.forEach(function(item){
          const p = platforms[item.idx];
          if (p && p.y < 0) {
            p.y = 0;
            if (item.el) item.el.style.bottom = '0px';
          }
        });
        let anyMoved = false;
        for (let k = 0; k < startPositions.length; k++) {
          const sp = startPositions[k];
          const p = platforms[sp.idx];
          if (p && (p.x !== sp.origX || p.y !== sp.origY)) { anyMoved = true; break; }
        }
        if (snapBefore && anyMoved) recordUndoStep(snapBefore);
        restoreDrawBg(0.2);
      }
    }

    updatePlatListUI();

    // 重置多选拖拽状态
    multiDragging = false;
    multiDragList = [];
    multiDragCoordOffset = null;
    multiDragRefOrig = null;
    multiDragSnapBefore = null;
    return;
  }

  // 结束 Shift 框选
  if (shiftSelecting) {
    shiftSelecting = false;
    shiftSelectStart = null;
    shiftSelectDir = 0;
    if (shiftSelectBox) {
      shiftSelectBox.style.display = 'none';
    }
    return;
  }

  if (!drawStart) return;
  const coord = screenToMapCoord(e.clientX, e.clientY, drawZoom, drawMapLeft, drawMapTop);
  const gx = Math.round(coord.x / DRAW_GRID) * DRAW_GRID;
  const gy = Math.round(coord.y / DRAW_GRID) * DRAW_GRID;

  // 钳制两个角点到世界边界内，避免绘制出界（与单平台拖拽 clamp 逻辑一致：worldW × mapTotalH）
  const cx1 = Math.max(0, Math.min(Math.min(drawStart.x, gx), worldW));
  const cy1 = Math.max(0, Math.min(Math.min(drawStart.y, gy), mapTotalH));
  const cx2 = Math.max(0, Math.min(Math.max(drawStart.x, gx), worldW));
  const cy2 = Math.max(0, Math.min(Math.max(drawStart.y, gy), mapTotalH));

  const wPx = cx2 - cx1;
  const hPx = cy2 - cy1;

  if (wPx > 0 && hPx > 0) {
    const beforeSnap = drawStart && drawStart._snapBefore ? drawStart._snapBefore : snapPlatforms();
    // 先算出理论尺寸，再钳制宽高不超过世界空间（防止角点出界后反向扩大导致越界渲染）
    let pw = +(wPx / GRID).toFixed(2);
    let ph = +(hPx / GRID).toFixed(2);
    const maxXG = worldW / GRID;
    const maxYG = mapTotalH / GRID;
    let pxG = +(cx1 / GRID).toFixed(2);
    let pyG = +(cy1 / GRID).toFixed(2);
    // 钳制位置 & 尺寸：确保 x+w ≤ worldW, y+h ≤ mapTotalH, 且 x,y ≥ 0
    pxG = Math.max(0, Math.min(pxG, maxXG - pw));
    pyG = Math.max(0, Math.min(pyG, maxYG - ph));
    if (pxG < 0) { pw += pxG; pxG = 0; }
    if (pyG < 0) { ph += pyG; pyG = 0; }
    pw = Math.min(pw, maxXG - pxG);
    ph = Math.min(ph, maxYG - pyG);
    // 钳制后若尺寸无效则跳过
    if (pw <= 0 || ph <= 0) {
      if (drawPreview) { drawPreview.remove(); drawPreview = null; }
      drawStart = null;
      isDrawing = false;
      return;
    }
    const p = {
      x: +(pxG).toFixed(2),
      y: +(pyG).toFixed(2),
      w: +(pw).toFixed(2),
      h: +(ph).toFixed(2),
      pid: pidCounter++        // 分配唯一标识
    };
    // 高度=0.25或0.5格 → 自动转为可穿越平台（优先）
    // 宽度=0.25或0.5格（且高度不符合可穿越条件） → 自动转为可攀登平台
    if (p.h === 0.25 || p.h === 0.5) {
      p.passable = true;
    } else if (p.w === 0.25 || p.w === 0.5) {
      p.climbable = true;
    }
    platforms.push(p);
    renderPlatforms();
    recordUndoStep(beforeSnap); // 记录"新增前快照"——撤回→回到新增前
  }

  if (drawPreview) {
    drawPreview.remove();
    drawPreview = null;
  }
  drawStart = null;
  isDrawing = false;
});

/* ==================== 地图尺寸（同步更新地面平台） ==================== */
function applyMapSize() {
  const w = Math.max(2, +mapWInput.value || 30);
  const h = Math.max(2, +mapHInput.value || 20);

  worldW = w * GRID;
  worldH = h * GRID;
  mapTotalW = worldW;
  mapTotalH = worldH + GROUND_H;

  mapEl.style.width  = mapTotalW + 'px';
  mapEl.style.height = mapTotalH + 'px';
  mapGridEl.style.bottom = GROUND_H + 'px';
  drawGridEl.style.bottom = GROUND_H + 'px';

  // 更新地面平台宽度
  if (platforms.length > 0 && platforms[0].isGround) {
    platforms[0].w = worldW / GRID;
  }

  clampPlatforms();
  charX = Math.max(colW / 2, Math.min(worldW - colW / 2, charX));
  renderPlatforms();
  autoFitZoom();
}
[mapWInput, mapHInput].forEach(el => el.addEventListener('input', applyMapSize));

/* ==================== 缩放 ==================== */
let zoom = 1.0;
function applyZoom() {
  mapEl.style.transform = 'scale(' + zoom + ')';
  zoomResetBtn.textContent = Math.round(zoom * 100) + '%';
  // 体力条反向缩放，保持屏幕上大小不变
  if (staminaRing) {
    staminaRing.style.transform = 'translateX(-50%) scale(' + (1 / zoom) + ')';
  }
  // 坐标提示在stageEl中用屏幕坐标定位，无需反向缩放
  if (drawMode) {
    applyDrawGrid();
  } else {
    applyGridColor();
  }
  if (resizeTarget !== null) positionResizeHandles();
  // 缩放后鼠标静止，需据此重算坐标提示的 X/Y 世界坐标与定位
  if (drawMode && drawMouseInStage) {
    updateDrawCrosshairAndTip(drawLastMouseClientX, drawLastMouseClientY);
  }
}
function centerMap() {
  const sw = stageEl.clientWidth || 800;
  const sh = stageEl.clientHeight || 600;
  const scaledW = mapTotalW * zoom;
  const scaledH = mapTotalH * zoom;
  const ox = Math.max(0, (sw - scaledW) / 2);
  const oy = Math.max(0, (sh - scaledH) / 2);
  mapEl.style.left = ox + 'px';
  mapEl.style.top  = oy + 'px';
  // centerMap 会在 autoFitZoom/resize 中 applyZoom 之后再次移动地图，
  // 此前 applyZoom 内的刷新使用了旧位置，这里用最终位置重算一次
  if (drawMode && drawMouseInStage) {
    updateDrawCrosshairAndTip(drawLastMouseClientX, drawLastMouseClientY);
  }
}
function autoFitZoom() {
  const sw = stageEl.clientWidth || 800;
  const sh = stageEl.clientHeight || 600;
  const margin = 40;
  const fitW = (sw - margin * 2) / mapTotalW;
  const fitH = (sh - margin * 2) / mapTotalH;
  zoom = Math.min(3, Math.max(0.1, Math.min(fitW, fitH)));
  zoom = Math.round(zoom * 100) / 100;
  applyZoom();
  centerMap();
}
zoomInBtn.addEventListener('click',  () => { if (!isDrawing && !draggingPlatform && !resizingEdge) { zoomAtCenter(+(zoom + 0.1).toFixed(1)); if (resizeTarget !== null) positionResizeHandles(); } });
zoomOutBtn.addEventListener('click', () => { if (!isDrawing && !draggingPlatform && !resizingEdge) { zoomAtCenter(+(zoom - 0.1).toFixed(1)); if (resizeTarget !== null) positionResizeHandles(); } });
zoomResetBtn.addEventListener('click', () => { if (!isDrawing && !draggingPlatform && !resizingEdge) { zoomAtCenter(1.0); if (resizeTarget !== null) positionResizeHandles(); } });

// 摄像机跟随角色：将角色居中于舞台
function followCharacter() {
  if (!cameraLocked) return;
  const sw = stageEl.clientWidth || 800;
  const sh = stageEl.clientHeight || 600;
  const loopColH = getColH();
  // 角色中心在世界像素坐标（mapEl左上为原点）
  const charCenterX = charX;
  const charCenterYFromTop = mapTotalH - posY - loopColH / 2;
  // 缩放后定位，使角色中心对齐舞台中心
  mapEl.style.left = (sw / 2 - charCenterX * zoom) + 'px';
  mapEl.style.top  = (sh / 2 - charCenterYFromTop * zoom) + 'px';
}

// 以屏幕中心为基准缩放
function zoomAtCenter(newZoomVal) {
  const newZoom = Math.min(3, Math.max(0.1, newZoomVal));
  const rect = mapEl.getBoundingClientRect();
  const stageRect = stageEl.getBoundingClientRect();
  // 计算屏幕中心在地图坐标系中的位置
  const mx = (stageRect.width / 2) - rect.left;
  const my = (stageRect.height / 2) - rect.top;
  const ratio = newZoom / zoom;
  const curLeft = parseFloat(mapEl.style.left) || 0;
  const curTop  = parseFloat(mapEl.style.top)  || 0;
  mapEl.style.left = (curLeft - mx * (ratio - 1)) + 'px';
  mapEl.style.top  = (curTop  - my * (ratio - 1)) + 'px';
  zoom = newZoom;
  applyZoom();
}
window.addEventListener('resize', () => { applyZoom(); centerMap(); if (drawMode && resizeTarget !== null) positionResizeHandles(); });

stageEl.addEventListener('wheel', function(e) {
  if (isDrawing || draggingPlatform || resizingEdge) return;
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.05 : 0.05;
  const newZoom = Math.min(3, Math.max(0.1, +(zoom + delta).toFixed(2)));
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const ratio = newZoom / zoom;
  const curLeft = parseFloat(mapEl.style.left) || 0;
  const curTop  = parseFloat(mapEl.style.top)  || 0;
  mapEl.style.left = (curLeft - mx * (ratio - 1)) + 'px';
  mapEl.style.top  = (curTop  - my * (ratio - 1)) + 'px';
  zoom = newZoom;
  applyZoom();
}, { passive:false });

/* ==================== 鼠标拖拽 ==================== */
let dragOn = false;

stageEl.addEventListener('mousedown', function(e) {
  if (e.button !== 2) return;
  if (cameraLocked) return;   // 摄像机锁定时禁用地图拖拽
  e.preventDefault();
  const tag = e.target.tagName;
  if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'LABEL') return;
  if (e.target.id === 'hintTip' || e.target.closest('#hintTip')) return;
  // 绘制模式下：右键普通平台 → 循环切换 普通 → 可穿越 → 可攀登 → 普通
  if (drawMode) {
    const pEl = e.target.closest && e.target.closest('.platform.normal');
    if (pEl) {
      const pid = +pEl.dataset.pid;
      const p = platforms.find(function(pp){ return pp.pid === pid; });
      if (p) {
        const snapBefore = snapPlatforms();
        let bubbleText;
        if (p.passable) {
          // 可穿越 → 可攀登
          delete p.passable;
          p.climbable = true;
          bubbleText = '🧗 已设为可攀登平台（贴墙慢降）';
        } else if (p.climbable) {
          // 可攀登 → 普通
          delete p.climbable;
          bubbleText = '🗻 已恢复为普通平台';
        } else {
          // 普通 → 可穿越
          p.passable = true;
          bubbleText = '🛫 已设为可穿越平台（仅顶部碰撞）';
        }
        renderPlatforms();
        recordUndoStep(snapBefore);
        showGroupBubble(bubbleText);
      }
      return;  // 不进入地图拖拽
    }
  }
  dragOn = true;
  stageEl.classList.add('dragging');
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  mapStartLeft = parseFloat(mapEl.style.left) || 0;
  mapStartTop  = parseFloat(mapEl.style.top)  || 0;
});
stageEl.addEventListener('contextmenu', function(e) { e.preventDefault(); });

/* ==================== 平台碰撞检测（统一处理地面） ==================== */
// 正在穿越的具体平台引用：仅忽略此平台，其他可穿越平台正常碰撞
// （确保一次空格只穿越一层平台，不会连带穿过下方紧邻的多层可穿越平台）
let passableDropPlatform = null;
// 上一帧角色脚底 Y（用于可穿越平台顶部穿越判定：只识别脚底而非全身碰撞框）
let prevPosY = 0;
function checkPlatformCollision() {
  const ch = getColH();
  const charLeft   = charX - colW/2;
  const charRight  = charX + colW/2;
  const charBottom = posY;
  const charTop    = posY + ch;

  let hit = false;

  for (const p of platforms) {
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pBottom = p.y * GRID;
    const pTop    = pBottom + p.h * GRID;

    // 可穿越平台：外观是矩形，逻辑上只有顶部一条线碰撞
    //   - 左/右/下面完全不阻碍角色
    //   - 上面只在角色下落（velY<0）或接近顶点（velY≈0）时阻挡，从下往上可穿过
    //   - 蹲下+空格穿越期间仅忽略"正在穿越的那一个平台"（passableDropPlatform），其他可穿越平台正常碰撞
    //   - 吸附容错：脚部在顶面下 snapTol 范围内视为落地（解决低帧率 / 跳跃高度=平台高度时穿模）
    if (p.passable) {
      if (p === passableDropPlatform) continue;  // 正在穿越此平台：完全忽略，其他可穿越平台照常碰撞
      if (charRight <= pLeft || charLeft >= pRight) continue;
      const snapTol = GRID * 0.5;        // 半格吸附容错
      const nearApex = Math.abs(velY) <= Math.max(1.0, Math.abs(JUMP_V0) * 0.05);  // 顶点附近（速度接近零）
      // 允许吸附的速度态：下落态 or 接近顶点（用于跳跃高度=平台高度的精确对位）
      if (velY < 0 || nearApex) {
        // 1. 严格穿越：上一帧脚底在顶面及以上 → 本帧穿到顶面下（正常高帧率落地）
        const strictCross = prevPosY >= pTop && posY < pTop;
        // 2. 吸附落地：脚部在顶面下 snapTol 范围内，且上一帧未远离顶面（低帧率 / 顶点对平台高度的穿模）
        //    限定 posY < pTop + 1 排除顶面上方的悬浮场景
        const snapLanded = (posY >= pTop - snapTol) && (posY < pTop + 1)
                        && (prevPosY <= pTop + snapTol);
        if (strictCross || snapLanded) {
          posY = pTop;
          velY = 0;
          hit = 'top';
          continue;
        }
      }
      continue;
    }

    if (charRight <= pLeft || charLeft >= pRight) continue;
    if (charBottom >= pTop  || charTop  <= pBottom) continue;

    const overlapLeft   = charRight - pLeft;
    const overlapRight  = pRight  - charLeft;
    const overlapTop    = charBottom - pTop;
    const overlapBottom = pBottom - charTop;

    const minOverlap = Math.min(
      Math.abs(overlapLeft), Math.abs(overlapRight),
      Math.abs(overlapTop),  Math.abs(overlapBottom)
    );

    if (minOverlap === Math.abs(overlapTop)) {
      posY = pTop;
      if (velY < 0) velY = 0;
      hit = 'top';
    } else if (minOverlap === Math.abs(overlapBottom)) {
      posY = pBottom - ch;
      velY = 0;
      hit = 'bottom';
    } else if (minOverlap === Math.abs(overlapLeft)) {
      charX = pLeft - colW/2 - 0.1;
      hit = 'left';
    } else if (minOverlap === Math.abs(overlapRight)) {
      charX = pRight + colW/2 + 0.1;
      hit = 'right';
    }
  }

  return hit;
}

/* ==================== 水平碰撞 ==================== */
function checkHorizontalCollision() {
  const ch = getColH();
  const charLeft   = charX - colW/2;
  const charRight  = charX + colW/2;
  const charBottom = posY;
  const charTop    = posY + ch;

  for (const p of platforms) {
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pBottom = p.y * GRID;
    const pTop    = pBottom + p.h * GRID;

    if (p.passable) continue;  // 可穿越平台左右不阻碍移动
    if (charRight <= pLeft || charLeft >= pRight) continue;
    if (charBottom >= pTop || charTop <= pBottom) continue;

    const overlapLeft  = charRight - pLeft;
    const overlapRight = pRight  - charLeft;

    if (overlapLeft < overlapRight) {
      charX = pLeft - colW/2 - 0.1;
    } else {
      charX = pRight + colW/2 + 0.1;
    }
  }
}

/* ==================== 重置点碰撞检测与推挤 ==================== */
// 检查指定位置是否与任何平台重叠（使用站立碰撞框）
function checkResetPointOverlap(x, y) {
  const ch = colHNormal;
  const left   = x - colW / 2;
  const right  = x + colW / 2;
  const bottom = y;
  const top    = y + ch;
  
  // 世界边界检测
  if (left < 0 || right > worldW || bottom < 0 || top > mapTotalH) return true;
  
  // 平台重叠检测
  for (const p of platforms) {
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pBottom = p.y * GRID;
    const pTop    = pBottom + p.h * GRID;

    if (p.passable) continue;  // 可穿越平台不阻碍重置点（角色可穿过）
    if (right <= pLeft || left >= pRight) continue;
    if (bottom >= pTop || top <= pBottom) continue;

    return true;  // 检测到重叠
  }
  return false;  // 无重叠
}

// 尝试推挤到指定方向
function tryPushPosition(origX, origY, dx, dy) {
  let testX = origX + dx;
  let testY = origY + dy;
  
  // 限制在世界边界内
  testX = Math.max(colW / 2, Math.min(worldW - colW / 2, testX));
  testY = Math.max(0, Math.min(mapTotalH - colHNormal, testY));
  
  // 保存当前角色状态
  const savedCharX = charX;
  const savedPosY = posY;
  const savedVelY = velY;
  const savedIsCrouching = isCrouching;
  const savedIsJumping = isJumping;
  
  // 临时设置为测试位置
  charX = testX;
  posY = testY;
  velY = 0;
  isCrouching = false;
  isJumping = false;
  
  // 应用推挤
  checkPlatformCollision();
  checkHorizontalCollision();
  
  const resultX = charX;
  const resultY = posY;
  
  // 恢复角色状态
  charX = savedCharX;
  posY = savedPosY;
  velY = savedVelY;
  isCrouching = savedIsCrouching;
  isJumping = savedIsJumping;
  
  // 检查推挤后是否还有重叠
  const stillOverlapping = checkResetPointOverlap(resultX, resultY);
  
  return {
    x: Math.max(colW / 2, Math.min(worldW - colW / 2, resultX)),
    y: Math.max(0, Math.min(mapTotalH - colHNormal, resultY)),
    overlapping: stillOverlapping,
    distance: Math.sqrt(Math.pow(resultX - origX, 2) + Math.pow(resultY - origY, 2))
  };
}

function fixResetPointCollision() {
  const origX = resetPointOrigX;
  const origY = resetPointOrigY;
  
  // 首先检查原始位置是否完全没问题
  if (!checkResetPointOverlap(origX, origY)) {
    resetPointX = origX;
    resetPointY = origY;
    return;
  }
  
  // 方向组合（优先尝试近距离推挤，再尝试远距离）
  const directions = [
    // 单方向推挤
    { dx: 0, dy: 0 },     // 原地（用于检测是否已经没问题）
    { dx: 0, dy: 20 },    // 上
    { dx: 0, dy: -20 },   // 下
    { dx: 20, dy: 0 },    // 右
    { dx: -20, dy: 0 },   // 左
    { dx: 0, dy: 50 },    // 上(远)
    { dx: 0, dy: -50 },   // 下(远)
    { dx: 50, dy: 0 },    // 右(远)
    { dx: -50, dy: 0 },   // 左(远)
    // 组合方向推挤
    { dx: 20, dy: 20 },   // 右上
    { dx: -20, dy: 20 },  // 左上
    { dx: 20, dy: -20 },  // 右下
    { dx: -20, dy: -20 }, // 左下
    { dx: 50, dy: 50 },   // 右上(远)
    { dx: -50, dy: 50 },  // 左上(远)
    { dx: 50, dy: -50 },  // 右下(远)
    { dx: -50, dy: -50 }, // 左下(远)
    // 更大范围搜索
    { dx: 100, dy: 0 },
    { dx: -100, dy: 0 },
    { dx: 0, dy: 100 },
    { dx: 0, dy: -100 },
    { dx: 100, dy: 50 },
    { dx: -100, dy: 50 },
    { dx: 100, dy: -50 },
    { dx: -100, dy: -50 },
    { dx: 50, dy: 100 },
    { dx: 50, dy: -100 },
    { dx: -50, dy: 100 },
    { dx: -50, dy: -100 },
  ];
  
  let bestResult = null;
  let bestDistance = Infinity;
  
  for (const dir of directions) {
    const result = tryPushPosition(origX, origY, dir.dx, dir.dy);
    
    if (!result.overlapping) {
      // 找到无重叠位置，记录距离最近的
      if (result.distance < bestDistance) {
        bestDistance = result.distance;
        bestResult = result;
      }
    }
  }
  
  if (bestResult) {
    // 找到无重叠位置
    resetPointX = bestResult.x;
    resetPointY = bestResult.y;
  } else {
    // 所有方向都重叠，选择推挤后移动距离最小的位置
    let minMoveDistance = Infinity;
    let fallbackResult = null;
    
    for (const dir of directions) {
      const result = tryPushPosition(origX, origY, dir.dx, dir.dy);
      const moveDist = Math.abs(dir.dx) + Math.abs(dir.dy);
      
      if (moveDist < minMoveDistance) {
        minMoveDistance = moveDist;
        fallbackResult = result;
      }
    }
    
    if (fallbackResult) {
      resetPointX = fallbackResult.x;
      resetPointY = fallbackResult.y;
    } else {
      // 实在无法处理，保持原始位置
      resetPointX = origX;
      resetPointY = origY;
    }
  }
}

/* ==================== 支撑检测（包含地面） ==================== */
function findSupportUnderneath() {
  const supLeft  = charX - colW / 2;
  const supRight = charX + colW / 2;
  const footY    = posY;

  for (const p of platforms) {
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pTop    = (p.y + p.h) * GRID;

    // 穿越坠落期间：正在穿越的那个平台不算支撑（其他可穿越平台仍可作支撑）
    if (p === passableDropPlatform) continue;
    if (supRight <= pLeft || supLeft >= pRight) continue;
    if (Math.abs(footY - pTop) <= 2.0) {
      return { type: p.isGround ? 'ground' : 'platform', top: pTop };
    }
  }

  return null;
}

// 返回角色当前所站的"可穿越平台"引用（用于蹲下+空格穿越判定）；未站在任何可穿越平台上返回 null
function getStandingPassablePlatform() {
  if (isJumping) return null;
  const supLeft  = charX - colW / 2;
  const supRight = charX + colW / 2;
  const footY    = posY;
  for (const p of platforms) {
    if (!p.passable) continue;
    const pLeft  = p.x * GRID;
    const pRight = (p.x + p.w) * GRID;
    const pTop   = (p.y + p.h) * GRID;
    if (supRight <= pLeft || supLeft >= pRight) continue;
    if (Math.abs(footY - pTop) <= 2.0) return p;
  }
  return null;
}
function isStandingOnPassable() { return !!getStandingPassablePlatform(); }

// ==================== 可攀登平台（墙贴慢降） ====================
// 攀登中标志：仍处于 JUMP 态（序列帧/记录沿用跳跃），仅右边栏文字显示"攀登"
let isClimbing = false;
// 攀壁反方向冲刺：攀登中按冲刺时锁定为"脱墙方向"，冲刺锁定期间强制使用
let climbDashDir = 0;
// 蹬壁跳反作用力：攀登中起跳后强制朝远离墙壁方向位移，直到达到最高高度（velY<=0）解除
let isWallClimbJumping = false;       // 是否处于蹬壁跳反作用力生效中
let wallClimbJumpDir = 0;             // 蹬壁跳远离方向（-1=左, +1=右）
let wallClimbJumpWalkForced = false;  // 缓加减速关闭+奔跑模式：按Shift降到WALK_SPD后锁定为走动速度标志
let wallClimbJumpInitDirLocked = false; // 缓加减速开启+奔跑模式：起跳第一帧锁定方向朝远离，本帧使用后立即清除（只锁一瞬间）
let wallClimbJumpJustStarted = false;  // 蹬壁跳反作用力本帧刚启动（防止冲刺在同一帧自动触发并清除反作用力）
let wallClimbJumpAirborne = false;    // 本次跳跃是否源自蹬壁跳（从起跳到落地期间为true，顶点不清除，用于reversalDecel减速到0）
let lastClimbContact = 0;              // 上一帧攀登检测到的墙壁方向（兜底：doJump中位置可能已滑过墙底）

// 检测角色当前是否贴在可攀登平台的某一侧面
// 返回值： +1 = 墙在右侧（角色左移贴右墙... 实为角色右边缘贴平台左边缘，朝墙=按右）
//         -1 = 墙在左侧（角色左边缘贴平台右边缘，朝墙=按左）
//          0 = 未贴可攀登墙
function detectClimbableWallContact() {
  if (!isJumping) return 0;
  const ch         = getColH();
  const charLeft   = charX - colW / 2;
  const charRight  = charX + colW / 2;
  const charBottom = posY;
  const charTop    = posY + ch;
  const touchTol   = 2;  // 与水平碰撞留下的 0.1px 间隙相容
  for (const p of platforms) {
    if (!p.climbable) continue;
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pBottom = p.y * GRID;
    const pTop    = pBottom + p.h * GRID;
    // 必须垂直重叠（身体与平台在竖直区间有交集）
    if (charBottom >= pTop || charTop <= pBottom) continue;
    // 角色右边缘贴平台左边缘 → 墙在右
    if (Math.abs(charRight - pLeft) <= touchTol) return +1;
    // 角色左边缘贴平台右边缘 → 墙在左
    if (Math.abs(charLeft - pRight) <= touchTol) return -1;
  }
  return 0;
}

// 穿越前安全检查：角色当前位于"可穿越平台A顶面"。
// 仅当下方存在"与A顶面高度一致（|高度差|<=2px）且水平重叠"的 **普通实体平台**（非可穿越、非可攀登、非地面）时才禁止穿越
//   - 可攀登平台不拦截：它是墙状平台，用于垂直攀登，不是"穿越后会卡死身体的普通桌面级平台"
function wouldNormalPlatformBlockPassableDrop(passablePlat) {
  const charLeft  = charX - colW / 2;
  const charRight = charX + colW / 2;
  const passableTop = (passablePlat.y + passablePlat.h) * GRID;
  const sameTopTolPx = 2;
  for (const p of platforms) {
    if (p.passable)  continue;                  // 可穿越平台：本身是同类型，不阻挡
    if (p.climbable) continue;                  // 可攀登平台：墙状平台，不阻挡穿越
    if (p.isGround)  continue;                  // 地面已特殊处理且不与平台叠放
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pTop    = (p.y + p.h) * GRID;
    // 水平不重叠 → 跳过
    if (charRight <= pLeft || charLeft >= pRight) continue;
    // 仅当：普通平台与可穿越平台顶部"一样高"（容差2px）时才阻挡穿越
    if (Math.abs(pTop - passableTop) <= sameTopTolPx) return true;
  }
  return false;
}

// 蹲下 + 空格：穿越"当前所站的那个"可穿越平台并坠落（坠落即进入跳跃/下落状态）
// 仅忽略该平台本身，其他可穿越平台照常碰撞 → 一次空格只穿越一层
// 穿越前先检查：若下方/同高度存在普通实体平台会阻挡穿越后身体则不执行穿越
function triggerPassableDrop() {
  const plat = getStandingPassablePlatform();
  if (!plat) return false;
  if (wouldNormalPlatformBlockPassableDrop(plat)) return false;
  passableDropPlatform = plat;                    // 仅忽略此平台（其他可穿越平台正常阻挡）
  startCrouchFlag  = !!isCrouching;               // 记录坠落开始时是否下蹲
  airCrouchRequest = sLocked || !!keys['KeyS'];   // 若 S 仍按住，落地自动回蹲
  isCrouching  = false;
  isJumping    = true;
  isFalling    = true;
  fallRecorded = false;
  velY         = 0;
  startPosY    = posY;
  maxHeightCur = posY;
  moveDistPx   = 0;
  jumpCount    = 0;
  airTimeAccum = 0;
  segElapsedList = [];
  sprintCount  = 0;
  airSprintSegUsed = 0;
  frameIdx = 0; frameTimer = 0;
  curState = JUMP;
  setCharClass(STATE_CSS[JUMP]);
  return true;
}

// 每页显示行数（绘制模式）
const HINT_LINES_PER_PAGE = 2;

// 普通模式单行
const HINT_NORMAL_LINE = '<kbd>A</kbd>/<kbd>D</kbd> 移动 &nbsp; <kbd>Shift</kbd>+方向 奔跑 &nbsp; <kbd>Space</kbd> <kbd>W</kbd>跳跃 &nbsp; <kbd>S</kbd> 下蹲';

// 翻页状态（绘制模式当前页）
let hintDrawPage = 0;

// 相关 DOM 引用
const hintContent = document.getElementById('hintContent');
const hintPrevBtn = document.getElementById('hintPrevBtn');
const hintNextBtn = document.getElementById('hintNextBtn');

// 总页数
function hintPages() {
  return Math.max(1, Math.ceil(HINT_DRAW_LINES.length / HINT_LINES_PER_PAGE));
}

// 把 hintDrawPage 钳制到合法范围
function clampHintPage() {
  const max = hintPages() - 1;
  if (hintDrawPage < 0) hintDrawPage = 0;
  if (hintDrawPage > max) hintDrawPage = max;
}

// 刷新翻页按钮可用/可见状态
function refreshHintNavBtns() {
  if (!hintPrevBtn || !hintNextBtn) return;
  if (drawMode && !isTempHintActive) {
    hintPrevBtn.style.display = '';
    hintNextBtn.style.display = '';
    hintPrevBtn.disabled = hintDrawPage <= 0;
    hintNextBtn.disabled = hintDrawPage >= hintPages() - 1;
  } else {
    hintPrevBtn.style.display = 'none';
    hintNextBtn.style.display = 'none';
  }
}

// 渲染 hintContent
// mode: 'normal' | 'draw' | 'temp'
function renderHintContent(mode, extraHtml) {
  if (!hintContent) return;
  let html = '';
  if (mode === 'normal') {
    html = '<span class="hint-line">' + HINT_NORMAL_LINE + '</span>';
  } else if (mode === 'draw') {
    clampHintPage();
    const start = hintDrawPage * HINT_LINES_PER_PAGE;
    const pageLines = HINT_DRAW_LINES.slice(start, start + HINT_LINES_PER_PAGE);
    pageLines.forEach(function(line) {
      html += '<span class="hint-line">' + line + '</span>';
    });
    const pg = hintPages();
    if (pg > 1) {
      html += '<div class="hint-pager">第 ' + (hintDrawPage + 1) + ' / ' + pg + ' 页</div>';
    }
  } else if (mode === 'temp') {
    html = '<span class="hint-line" style="color:#8be9fd;">📍 ' + extraHtml + '</span>';
  }
  hintContent.innerHTML = html;
  refreshHintNavBtns();
}

// 临时提示模式标志（期间不覆盖内容、不显示翻页按钮）
let isTempHintActive = false;

function setHintMode(isDraw) {
  if (isTempHintActive) return;
  if (isDraw) {
    hintDrawPage = 0;
    renderHintContent('draw');
    showHint();
  } else {
    renderHintContent('normal');
  }
}

function showHint() {
  hintTip.classList.add('visible');
  clearTimeout(hideTimer);
  // 临时提示期间不重新计划自动隐藏（由 showHintTip 自己控制生命周期）
  if (!isTempHintActive) {
    hideTimer = setTimeout(function() { hintTip.classList.remove('visible'); }, 10000);
  }
}
function hideHintSoon() {
  clearTimeout(hideTimer);
  hideTimer = setTimeout(function() { hintTip.classList.remove('visible'); }, 500);
}

// 翻页按钮点击 + 阻止冒泡（防止触发 draw 模式下的绘制/选择逻辑）
if (hintPrevBtn) {
  hintPrevBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
  hintPrevBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!drawMode || isTempHintActive || hintDrawPage <= 0) return;
    hintDrawPage--;
    renderHintContent('draw');
    clearTimeout(hideTimer);
    hintTip.classList.add('visible');
  });
}
if (hintNextBtn) {
  hintNextBtn.addEventListener('mousedown', function(e) { e.stopPropagation(); });
  hintNextBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!drawMode || isTempHintActive || hintDrawPage >= hintPages() - 1) return;
    hintDrawPage++;
    renderHintContent('draw');
    clearTimeout(hideTimer);
    hintTip.classList.add('visible');
  });
}

// 首次加载：初始化 hintContent 为普通模式
