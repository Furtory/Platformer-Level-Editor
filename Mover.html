/* ==================== 状态 ==================== */
const IDLE = 0, WALK = 1, RUN = 2, JUMP = 3, CROUCH = 4, SPRINT = 5, CROUCH_SPRINT = 6;
const STATE_NAME = ['站立','走动','奔跑','跳跃','下蹲','冲刺','冲刺下蹲'];
const STATE_CSS  = ['p-idle','p-walk','p-run','p-jump','p-crouch','p-sprint','p-crouch-sprint'];

/* ==================== 帧数据 ==================== */
let frames = { idle:[], walk:[], run:[], jump:[], crouch:[], sprint:[] };
let hasRealImg = { idle:false, walk:false, run:false, jump:false, crouch:false, sprint:false };

function genPlaceholder(state, count) {
  // 背景半透明色：每个状态独立色调，但同一状态内所有帧颜色一致（不闪烁）
  // alpha 0.32 半透明，既不遮挡背景网格又能区分区域
  const bgTints = {
    idle:   'rgba(122, 162, 247, 0.32)',
    walk:   'rgba(158, 206, 106, 0.32)',
    run:    'rgba(247, 118, 142, 0.32)',
    jump:   'rgba(125, 207, 255, 0.32)',
    crouch: 'rgba(187, 154, 247, 0.32)',
    sprint: 'rgba(255, 154, 198, 0.32)'
  };
  const bgColor = bgTints[state] || bgTints.idle;

  // 白兔配色：白色毛 + 粉色内耳 + 粉色鼻 + 红眼（白化兔）
  // 层次：fur(纯白·四肢/爪/耳) → bodyFur(稍灰·身体/头主体) → furShade(灰·阴影) → furDark(深灰·轮廓/底)
  const rb = {
    fur:    '#ffffff',    // 四肢、前爪、耳朵外侧（纯白，与身体区分）
    bodyFur:'#d8d8e4',    // 身体/头部主体（稍灰，和四肢拉开层次）
    furShade:'#b8b8cc',   // 毛发阴影（背部/腿内侧/腹部暗纹）
    furDark: '#9898b0',   // 更深阴影（脚掌/爪尖/轮廓底部）
    earIn:  '#ffb6c1',     // 粉色内耳
    earShade:'#ff9aab',    // 内耳稍深处
    nose:   '#ff7e9a',     // 鼻头
    eye:    '#c0392b',     // 红眼睛
    eyeHi:  '#ffeeee',     // 眼睛高光
    whisker:'#aaaacc',     // 胡须
    teeth:  '#ffffff',     // 门牙
    mouth:  '#8a4a5a'      // 嘴线
  };
  const arr = [];

  // 绘制圆角矩形工具
  function roundRect(cx, x, y, w, h, r) {
    cx.beginPath();
    cx.moveTo(x+r, y);
    cx.lineTo(x+w-r, y);
    cx.quadraticCurveTo(x+w, y, x+w, y+r);
    cx.lineTo(x+w, y+h-r);
    cx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    cx.lineTo(x+r, y+h);
    cx.quadraticCurveTo(x, y+h, x, y+h-r);
    cx.lineTo(x, y+r);
    cx.quadraticCurveTo(x, y, x+r, y);
    cx.closePath();
    cx.fill();
  }

  // 绘制椭圆（用于耳朵、脸部等）
  function ellipse(cx, x, y, w, h) {
    cx.beginPath();
    cx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI * 2);
    cx.fill();
  }

  // 绘制白兔通用函数：根据参数决定姿态
  function drawRabbit(cx, pose) {
    const { headY=0, leftEar=0, rightEar=0, earY=0, bodyLean=0,
            leftLeg=0, rightLeg=0, leftArm=0, rightArm=0,
            leftLegX=0, leftLegY=0, rightLegX=0, rightLegY=0,
            headX=0,
            leftArmX=0, leftArmY=0, rightArmX=0, rightArmY=0,
            crouchY=0, speedLines=false, jumpStretch=false,
            earFlat=false, eyeClose=false } = pose;

    const cx0 = 32, cy0 = 42; // 身体中心基准

    // 速度线（冲刺/奔跑）
    if (speedLines) {
      cx.fillStyle = 'rgba(255,255,255,0.55)';
      for (let s = 0; s < 3; s++) {
        const sy = 30 + s*10 + crouchY;
        cx.fillRect(4+s*2, sy, 12-s*2, 2);
      }
      for (let s = 0; s < 2; s++) {
        const sy = 42 + s*8 + crouchY;
        cx.fillRect(8+s*3, sy, 14-s*2, 2);
      }
    }

    cx.save();
    cx.translate(cx0, cy0 + crouchY);
    cx.rotate(bodyLean * Math.PI / 180);

    // === 兔腿（后腿粗壮，纯白毛）===
    // 右腿（后层）
    cx.save();
    cx.translate(6 + rightLegX, 10 + rightLegY);
    cx.rotate(rightLeg * Math.PI / 180);
    cx.fillStyle = rb.fur;
    roundRect(cx, -5, 0, 10, 8, 2);
    cx.fillStyle = rb.furDark;
    roundRect(cx, -6, 7, 12, 4, 2);
    cx.restore();

    // 左腿（前层，渲染在右腿上面）
    cx.save();
    cx.translate(-6 + leftLegX, 10 + leftLegY);
    cx.rotate(leftLeg * Math.PI / 180);
    // 大腿（纯白）
    cx.fillStyle = rb.fur;
    roundRect(cx, -5, 0, 10, 8, 2);
    // 脚掌（深色底）
    cx.fillStyle = rb.furDark;
    roundRect(cx, -6, 7, 12, 4, 2);
    cx.restore();

    // === 右前爪（身体后层，先画）===
    const bodyH = jumpStretch ? 24 : 20;
    const bodyW = jumpStretch ? 20 : 22;
    cx.save();
    cx.translate(bodyW/2-1 + rightArmX, -4 + rightArmY);
    cx.rotate(rightArm * Math.PI / 180);
    cx.fillStyle = rb.fur;
    roundRect(cx, -3, -2, 7, 16, 3);
    cx.fillStyle = rb.furDark;
    roundRect(cx, -3, 12, 7, 3, 2);
    cx.restore();

    // === 身体 / 躯干（躯干稍灰与四肢区分，肚皮纯白）===
    // 背部深色阴影
    cx.fillStyle = rb.furShade;
    ellipse(cx, 0, 0, bodyW+2, bodyH+2);
    // 主体（稍灰身体色，区别于纯白四肢）
    cx.fillStyle = rb.bodyFur;
    ellipse(cx, 0, 2, bodyW, bodyH);
    // 腹部（纯白肚皮）
    cx.fillStyle = rb.fur;
    ellipse(cx, 2, 4, bodyW - 10, bodyH - 8);
    // 圆圆的蓬松尾巴（在身体后下方，纯白毛）
    cx.fillStyle = rb.furShade;
    ellipse(cx, -12, 6, 7, 7);

    // === 左前爪（身体前层，后画）===
    cx.save();
    cx.translate(-(bodyW/2-1) + leftArmX, -4 + leftArmY);
    cx.rotate(leftArm * Math.PI / 180);
    cx.fillStyle = rb.fur;
    roundRect(cx, -4, -2, 7, 16, 3);
    // 爪尖
    cx.fillStyle = rb.furDark;
    roundRect(cx, -4, 12, 7, 3, 2);
    cx.restore();

    // === 长兔耳（先画，渲染在头部之后，被头部遮住根部）===
    // 旋转中心 = translate 点（耳朵和头骨连接的根部）。
    // 锚点放在头部椭圆内部（_headY+6/+7），耳朵向上延伸出头顶；头部后画会盖住根部，形成"从脑后长出"的层次
    // leftEar/rightEar: 左右耳独立旋转角度（基于根部）
    // earFlat: 仅控制耳朵 X 间距（奔跑态耳朵向外张）
    // earY: 两只耳朵底部 Y 轴高度偏置
    const _headY = -24 + headY;   // 头部基准 y（耳朵与头部都要用，提前声明）
    // 耳朵 x 间距：直立态（idle/walk/jump）稍靠中间，奔跑态（earFlat）保持外侧
    const earXBase = earFlat ? 5 : 3;
    // 右耳（后层）
    cx.save();
    cx.translate(earXBase + headX, _headY + 7 + earY);
    cx.rotate(rightEar * Math.PI / 180);
    cx.fillStyle = rb.fur;
    roundRect(cx, -4, -23, 7, 23, 3);
    cx.fillStyle = rb.earIn;
    roundRect(cx, -3, -17, 5, 15, 2);
    cx.fillStyle = rb.earShade;
    roundRect(cx, -2.5, -8, 4, 6, 1);
    cx.restore();

    // 左耳（前层）
    cx.save();
    cx.translate(-earXBase + headX, _headY + 6 + earY);
    cx.rotate(leftEar * Math.PI / 180);
    // 耳外（白）：底部 y=0，向上（负方向）延伸 23px → 旋转时底部锚点始终贴在头部
    cx.fillStyle = rb.fur;
    roundRect(cx, -3, -23, 7, 23, 3);
    // 耳内（粉）：底部 y=-2（略高于耳外），向上 15px
    cx.fillStyle = rb.earIn;
    roundRect(cx, -2, -17, 5, 15, 2);
    // 耳内最深处阴影：底部 y=-5，向上 6px
    cx.fillStyle = rb.earShade;
    roundRect(cx, -1.5, -8, 4, 6, 1);
    cx.restore();

    // === 头部 ===
    cx.save();
    cx.translate(headX, 0);
    // 头（圆形，纯白）
    cx.fillStyle = rb.fur;
    ellipse(cx, 0, _headY+10, 20, 18);
    // 脸颊阴影（两侧稍暗）
    cx.fillStyle = rb.furShade;
    ellipse(cx, -8, _headY+12, 4, 5);
    ellipse(cx, 8, _headY+12, 4, 5);

    // === 脸部五官 ===
    // 鼻子（粉色三角倒圆角）
    cx.fillStyle = rb.nose;
    cx.beginPath();
    cx.moveTo(-2, _headY+11);
    cx.lineTo(2, _headY+11);
    cx.quadraticCurveTo(2.5, _headY+13, 0, _headY+14);
    cx.quadraticCurveTo(-2.5, _headY+13, -2, _headY+11);
    cx.fill();
    // 鼻子高光
    cx.fillStyle = 'rgba(255,255,255,0.6)';
    cx.fillRect(-1, _headY+11, 1, 1);

    // 眼睛（红眼 + 高光；眨眼时闭合）
    if (eyeClose) {
      // 闭眼：两条弧线
      cx.strokeStyle = rb.eye;
      cx.lineWidth = 1.5;
      cx.beginPath();
      cx.moveTo(-6, _headY+9);
      cx.quadraticCurveTo(-4, _headY+7, -2, _headY+9);
      cx.stroke();
      cx.beginPath();
      cx.moveTo(2, _headY+9);
      cx.quadraticCurveTo(4, _headY+7, 6, _headY+9);
      cx.stroke();
    } else {
      // 左眼
      cx.fillStyle = rb.eye;
      ellipse(cx, -4, _headY+9, 4, 4.5);
      // 瞳孔深色
      cx.fillStyle = '#7a1a1a';
      ellipse(cx, -4, _headY+9, 2.5, 3);
      // 高光
      cx.fillStyle = rb.eyeHi;
      cx.fillRect(-5, _headY+7, 1.5, 1.5);
      cx.fillRect(-3, _headY+10, 1, 1);

      // 右眼
      cx.fillStyle = rb.eye;
      ellipse(cx, 4, _headY+9, 4, 4.5);
      cx.fillStyle = '#7a1a1a';
      ellipse(cx, 4, _headY+9, 2.5, 3);
      cx.fillStyle = rb.eyeHi;
      cx.fillRect(3, _headY+7, 1.5, 1.5);
      cx.fillRect(5, _headY+10, 1, 1);
    }

    // 门牙（两颗小方形白牙，根据状态开合）
    if (state === 'run' || state === 'sprint') {
      // 喘气：嘴张开，大牙+舌头
      cx.fillStyle = rb.mouth;
      roundRect(cx, -3, _headY+14, 6, 4, 1.5);
      // 舌头
      cx.fillStyle = rb.nose;
      ellipse(cx, 0, _headY+17, 3, 2);
      // 上门牙
      cx.fillStyle = rb.teeth;
      cx.fillRect(-2.5, _headY+14, 2, 2.5);
      cx.fillRect(0.5, _headY+14, 2, 2.5);
    } else if (state === 'jump') {
      // 惊讶：O型嘴
      cx.fillStyle = rb.mouth;
      ellipse(cx, 0, _headY+16, 5, 4);
      cx.fillStyle = rb.nose;
      ellipse(cx, 0, _headY+17, 3, 2);
      // 牙
      cx.fillStyle = rb.teeth;
      cx.fillRect(-2, _headY+14, 2, 2);
      cx.fillRect(0, _headY+14, 2, 2);
    } else {
      // 平静：小嘴线+门牙
      // 嘴中线（从鼻子向下的人中线）
      cx.fillStyle = rb.mouth;
      cx.fillRect(-0.3, _headY+13.5, 0.6, 2);
      // 左右小嘴弧
      cx.fillRect(-2, _headY+15.5, 2, 0.5);
      cx.fillRect(0, _headY+15.5, 2, 0.5);
      // 小门牙
      cx.fillStyle = rb.teeth;
      cx.fillRect(-2, _headY+15.5, 1.8, 2);
      cx.fillRect(0.2, _headY+15.5, 1.8, 2);
    }

    // 胡须（左右各3根细线）
    cx.strokeStyle = rb.whisker;
    cx.lineWidth = 0.6;
    cx.beginPath();
    // 左胡须
    cx.moveTo(-7, _headY+13);
    cx.lineTo(-16, _headY+12);
    cx.moveTo(-7, _headY+14);
    cx.lineTo(-16, _headY+14);
    cx.moveTo(-7, _headY+15);
    cx.lineTo(-15, _headY+16.5);
    // 右胡须
    cx.moveTo(7, _headY+13);
    cx.lineTo(16, _headY+12);
    cx.moveTo(7, _headY+14);
    cx.lineTo(16, _headY+14);
    cx.moveTo(7, _headY+15);
    cx.lineTo(15, _headY+16.5);
    cx.stroke();

    cx.restore(); // head section
    cx.restore();
  }

  // ===== 各状态姿态生成 =====
  for (let i = 0; i < count; i++) {
    const cv = document.createElement('canvas');
    // 精灵图分辨率提升至 128×128（2 倍），用 scale 让 64×64 坐标系绘制代码自动放大，画面更细腻
    cv.width = 128; cv.height = 128;
    const cx = cv.getContext('2d');
    cx.scale(2, 2);  // 后续所有绘制按 64×64 坐标系，实际输出 128×128 像素

    // 背景：同一状态内颜色完全一致，alpha 半透明，不闪烁
    cx.fillStyle = bgColor;
    cx.fillRect(0, 0, 64, 64);
    // 轻微网格（辅助对齐，统一 alpha，不造成闪烁）
    cx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let gy = 0; gy < 64; gy += 8) {
      for (let gx = 0; gx < 64; gx += 8) {
        cx.fillRect(gx, gy, 1, 1);
      }
    }

    let pose = {};

    switch (state) {
      case 'idle': {
        // 6 帧：呼吸式站立，末帧眨眼
        const breathe = Math.sin(i / count * Math.PI * 2) * 1.5;
        const blink = (i === count - 1);
        pose = {
          headX: 0,
          headY: breathe,
          leftEar: -25 + Math.sin(i / count * Math.PI * 2 + 0.5) * 2 + Math.sin(i / count * Math.PI * 2 + 1) * 0.25,
          rightEar: 25 + Math.sin(i / count * Math.PI * 2 + 0.5) * 2 - Math.sin(i / count * Math.PI * 2 + 1) * 0.25,
          earY: Math.sin(i / count * Math.PI * 2 + 1) / 2,
          leftLeg:  0,
          rightLeg:  0,
          leftArm:  1 + breathe,
          rightArm: 1 - breathe,
          leftLegX: 0, leftLegY: 0, rightLegX: 0, rightLegY: 0,
          leftArmX: 0, leftArmY: 0, rightArmX: 0, rightArmY: 0,
          eyeClose: blink
        };
        break;
      }
      case 'walk': {
        // 10 帧：完整行走周期（正弦插值，步幅略小）
        const phase = i / count * Math.PI * 2;
        const legSwing = Math.sin(phase) * 18;
        const armSwing = -Math.sin(phase) * 14;
        const bob = Math.abs(Math.sin(phase * 2)) * 1.8;
        pose = {
          headX: 0,
          headY: -bob,
          leftEar: -25 + Math.sin(phase) * 4 - bob * 0.35,
          rightEar: 25 + Math.sin(phase) * 4 + bob * 0.35,
          earY: -bob * 0.7,
          leftLeg: legSwing,
          rightLeg: -legSwing,
          leftArm: armSwing,
          rightArm: -armSwing,
          leftLegX: 0, leftLegY: 0, rightLegX: 0, rightLegY: 0,
          leftArmX: 0, leftArmY: 0, rightArmX: 0, rightArmY: 0
        };
        break;
      }
      case 'run': {
        // 5 帧：奔跑 —— 缩短帧数加快节奏，整体身体上下颠簸，摆幅更大、频率更快
        const phase = i / count * Math.PI * 2;
        // 腿部/手臂摆动：频率加倍（phase*2）+ 幅度加大
        const legSwing = Math.sin(phase * 2) * 18;
        const armSwing = -Math.sin(phase * 2) * 14;
        // 整体身体上下颠簸（crouchY 控制全身）
        const bodyBob = Math.abs(Math.sin(phase * 2)) * 3;
        // 头部细微独立摆动
        const headMicroBob = Math.abs(Math.sin(phase * 4 + 0.5)) * 1.5;
        pose = {
          crouchY: -bodyBob,      // 整体身体上下运动
          headX: 0,
          headY: -headMicroBob,   // 头部微调
          leftEar: -40 - bodyBob * 5,
          rightEar: -20 - bodyBob * 5,
          earY: -bodyBob * 0.4,
          earFlat: true,
          bodyLean: 8,
          leftLeg: legSwing,
          rightLeg: -legSwing,
          leftArm: armSwing,
          rightArm: -armSwing,
          leftLegX: 0, leftLegY: 1, rightLegX: 0, rightLegY: 0,
          leftArmX: 0, leftArmY: 0, rightArmX: 0, rightArmY: 0,
          speedLines: true
        };
        break;
      }
      case 'jump': {
        // 6 帧：下蹲蓄力 → 蹬地起身 → 起跳伸展 → 上升最高点 → 顶点团身 → 下落着陆
        // 手臂轨迹：双臂向两侧外抬起 → 逐渐朝上 → 末帧保持朝上不放下
        // 角度系统：左臂正值=向外侧上扬；右臂负值=向外侧上扬；±160°≈接近垂直朝上
        if (i === 0) {
          // 下蹲蓄力：手臂自然下垂稍向外
          pose = {
            crouchY: 6, leftEar: -29.5, rightEar: 23.5, earY: -3,
            headX: 0, headY: 1,
            leftArm: 15, rightArm: -15,
            leftLeg: -10, rightLeg: 10,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        } else if (i === 1) {
          // 蹬地起身：双臂向外抬起
          pose = {
            crouchY: 3, leftEar: -27, rightEar: 23, earY: 0,
            headX: 0, headY: 0,
            leftArm: 50, rightArm: -50,
            leftLeg: -2, rightLeg: 6,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        } else if (i === 2) {
          // 起跳伸展：双臂向外水平偏上
          pose = {
            jumpStretch: true, crouchY: 3, leftEar: -27.5, rightEar: 17.5, earY: 5,
            headX: 0, headY: -3,
            leftArm: 90, rightArm: -90,
            leftLeg: -14, rightLeg: 4,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        } else if (i === 3) {
          // 上升中：双臂斜向上
          pose = {
            crouchY: 2, leftEar: -26.5, rightEar: 18.5, earY: 5,
            headX: 0, headY: -4,
            leftLeg: -18, rightLeg: -6,
            leftArm: 125, rightArm: -125,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        } else if (i === 4) {
          // 顶点：双臂接近朝上
          pose = {
            crouchY: 3, leftEar: -25, rightEar: 21, earY: 4,
            headX: 0, headY: -4,
            leftLeg: -20, rightLeg: -10,
            leftArm: 160, rightArm: -160,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        } else {
          // 下落着陆准备：双臂保持朝上不放下
          pose = {
            crouchY: 4, leftEar: -22, rightEar: 26, earY: 2,
            headX: 0, headY: -1,
            leftLeg: 16, rightLeg: 8,
            leftArm: 160, rightArm: -160,
            leftLegX: 0, rightLegX: 0,
            leftLegY: 0, rightLegY: 0,
            leftArmX: 0, rightArmX: 0,
            leftArmY: 0, rightArmY: 0
          };
        }
        break;
      }
      case 'crouch': {
        // 8 帧：尺蠖式匍匐前进（4 相位 × 2 帧）
        // 双臂与双腿交替支撑摆动：臂支撑→臂后摆+腿前摆→腿支撑→腿后摆+臂前摆
        // 双臂/双腿同向运动：leftArm正=向前，rightArm负=向前；leftLeg正=向前，rightLeg负=向前
        // 帧0为静止蹲伏的默认中性姿态，其余7帧形成完整匍匐循环
        if (i === 0) {
          // 中性蹲伏（静止默认姿态）：臂自然微前伸，腿微屈
          pose = {
            crouchY: 6, leftEar: -50, rightEar: -35, earY: 0,
            headX: 1, headY: 1, bodyLean: 20,
            leftLeg: -110, rightLeg: -110,
            leftArm: -20, rightArm: -40,
            leftLegX: -4, rightLegX: -6,
            leftLegY: 5, rightLegY: 0,
            leftArmX: 10, rightArmX: -2,
            leftArmY: 5, rightArmY: 2
          };
        } else if (i === 1) {
          // 相位1：双臂前撑地面，双腿后拖
          pose = {
            crouchY: 5, leftEar: -60, rightEar: -45, earY: 0,
            headX: 1, headY: 1, bodyLean: 25,
            leftLeg: -105, rightLeg: -105,
            leftArm: -50, rightArm: -70,
            leftLegX: -3, rightLegX: -5,
            leftLegY: 5, rightLegY: 0,
            leftArmX: 10, rightArmX: -1,

/* ==================== 公式面板 ==================== */
function refreshFormula() {
  // 安全获取数值，防止 NaN 和 Infinity
  function safeNum(v, defaultVal) {
    const n = +v;
    if (!isFinite(n) || isNaN(n)) return defaultVal;
    return n;
  }
  
  const hGrid = safeNum(jumpHIn ? jumpHIn.value : 4, 4);
  jumpMaxH   = hGrid * GRID;
  jumpT      = Math.max(0.01, safeNum(jumpTimeIn ? jumpTimeIn.value : 1.0, 1.0));
  crouchWalkD= safeNum(crouchDistIn ? crouchDistIn.value : 1.2, 1.2);
  walkJumpD  = safeNum(walkDistIn ? walkDistIn.value : 2, 2);
  runJumpD   = safeNum(runDistIn ? runDistIn.value : 4, 4);
  sprintSpeedD = safeNum(sprintSpeedDistIn ? sprintSpeedDistIn.value : 6, 6);
  sprintDistD  = safeNum(sprintDistIn ? sprintDistIn.value : 20, 20);
  airSprintSegMax = Math.max(0, Math.floor(safeNum(airSprintSegIn ? airSprintSegIn.value : 1, 1)));
  airSprintSegUsed = 0;
  sprintLatch = true;

  // 特殊选项
  jumpLockEnabled = !!(chkJumpLock && chkJumpLock.checked);
  smoothSpeedEnabled = !!(chkSmoothSpeed && chkSmoothSpeed.checked);
  accelRate = Math.max(0.1, safeNum(accelRateIn ? accelRateIn.value : 3, 3));
  decelRate = Math.max(0.1, safeNum(decelRateIn ? decelRateIn.value : 5, 5));
  // 体力限制
  staminaEnabled = !!(chkStamina && chkStamina.checked);
  staminaRecoverTime = Math.max(0.1, safeNum(staminaRecoverIn ? staminaRecoverIn.value : 3, 3));
  staminaRunMax = Math.max(0.1, safeNum(staminaRunMaxIn ? staminaRunMaxIn.value : 5, 5));
  staminaSprintMax = Math.max(1, Math.floor(safeNum(staminaSprintMaxIn ? staminaSprintMaxIn.value : 3, 3)));
  // 蹬壁跳反作用力开关
  wallClimbJumpRecoilEnabled = !!(chkWallClimbJumpRecoil && chkWallClimbJumpRecoil.checked);

  GRAVITY = (8 * jumpMaxH) / (jumpT * jumpT);
  JUMP_V0 = GRAVITY * jumpT / 2;

  // 移动速度按"格/秒"计算，与跳跃期望时间 T 无关
  CROUCH_SPD = crouchWalkD * GRID;
  WALK_SPD   = walkJumpD  * GRID;
  RUN_SPD    = runJumpD   * GRID;
  SPRINT_SPD = sprintSpeedD * GRID;

  // 安全格式化函数
  function safeFixed(v, decimals) {
    if (!isFinite(v) || isNaN(v)) return '0';
    return v.toFixed(decimals);
  }

  if (formulaEl) {
    formulaEl.textContent =
      'h  = ' + hGrid + '格 = ' + safeFixed(jumpMaxH, 1) + 'px\n' +
      'T  = ' + safeFixed(jumpT, 4) + ' s\n' +
      'g  = 8h/T² = ' + safeFixed(GRAVITY, 2) + ' px/s²\n' +
      'v₀ = gT/2 = ' + safeFixed(JUMP_V0, 2) + ' px/s';
  }

  if (moveFormulaEl) {
    let txt =
      'v_蹲 = ' + safeFixed(crouchWalkD, 1) + '×格宽/s' + ' ≈ ' + safeFixed(CROUCH_SPD, 1) + ' px/s\n' +
      'v_走 = ' + safeFixed(walkJumpD, 1)  + '×格宽/s' + ' ≈ ' + safeFixed(WALK_SPD, 1)   + ' px/s\n' +
      'v_奔 = ' + safeFixed(runJumpD, 1) + '×格宽/s ≈ ' + safeFixed(RUN_SPD, 1) + ' px/s';
    // 缓加速缓减速开启时：附加加减速公式
    if (smoothSpeedEnabled) {
      // 像素加速度：a_px = a_rate × GRID  px/s²
      const accelPx = accelRate * GRID;
      const decelPx = decelRate * GRID;
      // 走动↔奔跑速度差（格宽/s）
      const spdDiff = Math.max(0, runJumpD - walkJumpD);
      // 加速时长：t_a = (v_奔-v_走) / a_加 = (D_奔-D_走) / a_rate  s
      const tAccel = (accelRate > 0.001) ? spdDiff / accelRate : 0;
      // 减速时长：t_d = (v_奔-v_走) / a_减
      const tDecel = (decelRate > 0.001) ? spdDiff / decelRate : 0;
      // 加速距离（匀加速）：s_a = v_走×t_a + 0.5×a_加×t_a² = (v_奔²-v_走²)/(2a_加)  格
      const sAccel = (accelRate > 0.001) ? (runJumpD * runJumpD - walkJumpD * walkJumpD) / (2 * accelRate) : 0;
      // 减速距离（匀减速）：s_d = v_奔×t_d - 0.5×a_减×t_d² = (v_奔²-v_走²)/(2a_减)  格
      const sDecel = (decelRate > 0.001) ? (runJumpD * runJumpD - walkJumpD * walkJumpD) / (2 * decelRate) : 0;
      txt += '\n--- 缓加速缓减速 ---';
      txt += '\na_加 = ' + safeFixed(accelRate, 1) + ' 格/s² = ' + safeFixed(accelPx, 0) + ' px/s²';
      txt += '\na_减 = ' + safeFixed(decelRate, 1) + ' 格/s² = ' + safeFixed(decelPx, 0) + ' px/s²';
      txt += '\nt_走→奔 = (D_奔-D_走)/a_加 ≈ ' + safeFixed(tAccel, 3) + ' s';
      txt += '\ns_走→奔 = (D_奔²-D_走²)/(2*a_加) ≈ ' + safeFixed(sAccel, 2) + ' 格';
      txt += '\nt_奔→走 = (D_奔-D_走)/a_减 ≈ ' + safeFixed(tDecel, 3) + ' s';
      txt += '\ns_奔→走 = (D_奔²-D_走²)/(2*a_减) ≈ ' + safeFixed(sDecel, 2) + ' 格';
    }
    moveFormulaEl.textContent = txt;
  }

  if (sprintFormulaInfoEl) {
    const lockSec = sprintDistD / Math.max(0.001, sprintSpeedD);
    sprintFormulaInfoEl.textContent =
      'v_冲 = D_冲 × 格宽 / s\n' +
      'v_冲 ≈ ' + safeFixed(SPRINT_SPD, 1) + ' px/s\n' +
      '冲刺时间上限 = D_上限 / D_冲 ≈ ' + safeFixed(lockSec, 3) + ' s';
  }
  
  // 更新体力条
  updateStaminaRing();
}

/**
 * 更新圆环体力条显示
 * 根据 stamina 值（0~1）和 sprintCount/staminaSprintMax 计算显示
 * 颜色从 #5ce0fd（满）渐变到 #ff802b（空）
 */
function updateStaminaRing() {
  if (!staminaRing || !staminaRingProgress) return;
  
  // 两种模式都使用 stamina 值（0~1）
  const ratio = Math.max(0, Math.min(1, stamina));
  
  const circumference = 2 * Math.PI * 16; // r=16
  staminaRingProgress.setAttribute('stroke-dasharray', circumference.toFixed(2));
  staminaRingProgress.setAttribute('stroke-dashoffset', (circumference * (1 - ratio)).toFixed(2));
  
  // 颜色渐变：体力降到 25% 开始渐变，到 10% 完成渐变
  // #5ce0fd（满）→ #ff802b（空）
  const r1 = 0x5c, g1 = 0xe0, b1 = 0xfd; // #5ce0fd
  const r2 = 0xff, g2 = 0x80, b2 = 0x2b; // #ff802b
  // 渐变进度 t：ratio>=0.25 时为 0（保持满体力色），ratio<=0.10 时为 1（完全变色），中间线性插值
  const gradStart = 0.25, gradEnd = 0.10;
  let t = (gradStart - ratio) / (gradStart - gradEnd);
  t = Math.max(0, Math.min(1, t));
  const r = Math.round(r1 + (r2 - r1) * t);
  const g = Math.round(g1 + (g2 - g1) * t);
  const b = Math.round(b1 + (b2 - b1) * t);
  staminaRingProgress.setAttribute('stroke', `rgb(${r},${g},${b})`);
}

// 状态编号 → 文本状态键（供 stateColors / frames / STATE_CSS 共用，避免硬编码数组下标越界）
function stateKey(stateNum) {
  switch ((stateNum|0)) {
    case IDLE:           return 'idle';
    case WALK:           return 'walk';
    case RUN:            return 'run';
    case JUMP:           return 'jump';
    case CROUCH:         return 'crouch';
    case SPRINT:         return 'sprint';
    case CROUCH_SPRINT:  return 'crouch-sprint';
    default:             return 'idle';
  }
}
// CROUCH_SPRINT 取哪个状态的帧 → 用 crouch（碰撞框矮、姿态接近）
function frameKey(stateNum) {
  switch ((stateNum|0)) {
    case CROUCH:
    case CROUCH_SPRINT:  return 'crouch';
    default:             return stateKey(stateNum);
  }
}

/* ==================== 文件加载 ==================== */
folderInput.addEventListener('change', async function(e) {
  // 兼容两种来源：
  //   1) 常规 input[webkitdirectory] → e.target.files（FileList，自带 webkitRelativePath）
  //   2) FSA showDirectoryPicker() → 挂在 folderInput._fsaFiles 上，每个 File 已补 webkitRelativePath
  const rawFiles = (folderInput && Array.isArray(folderInput._fsaFiles) && folderInput._fsaFiles.length > 0)
    ? folderInput._fsaFiles.slice()
    : Array.from(e.target.files || []);
  const files = rawFiles.filter(f => /\.(png|jpg|jpeg|webp)$/i.test(f.name));
  const groups = { idle:[], walk:[], run:[], jump:[], crouch:[], sprint:[] };
  files.forEach(function(f) {
    const parts = (f.webkitRelativePath || '').split('/');
    const folder = parts.length > 1 ? parts[parts.length-2].toLowerCase() : '';
    if      (folder.includes('idle')  || folder.includes('stand')) groups.idle.push(f);
    else if (folder.includes('walk') || folder.includes('move'))  groups.walk.push(f);
    else if (folder.includes('sprint')||folder.includes('dash')|| folder.includes('rush')) groups.sprint.push(f);
    else if (folder.includes('run'))  groups.run.push(f);
    else if (folder.includes('jump') || folder.includes('hop'))   groups.jump.push(f);
    else if (folder.includes('crouch')|| folder.includes('croun')|| folder.includes('squat')|| folder.includes('sit')) groups.crouch.push(f);
  });
  const sortFn = (a,b) => a.name.localeCompare(b.name, undefined, {numeric:true});
  Object.keys(groups).forEach(k => groups[k].sort(sortFn));

  for (const k of ['idle','walk','run','jump','crouch','sprint']) {
    if (groups[k].length === 0) continue;
    const dataUrls = await Promise.all(groups[k].map(f => new Promise(res => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.readAsDataURL(f);
    })));
    frames[k] = dataUrls;
    hasRealImg[k] = true;
  }
  Object.keys(hasRealImg).forEach(k => {
    if (hasRealImg[k]) charEl.classList.remove('p-' + k);
  });
  // 提取根目录名用于显示（兼容 webkitdirectory 和 FSA，只要有文件就从第一个拿）
  let rootFolderDisplayName = '';
  if (files && files.length > 0 && files[0].webkitRelativePath) {
    const p0 = (files[0].webkitRelativePath || '').split('/');
    if (p0.length >= 2) rootFolderDisplayName = p0[0];
  }
  const currFrames = {};
  const placeholderMask = {};
  for (const k of ['idle','walk','run','jump','crouch','sprint']) {
    currFrames[k] = frames[k] ? frames[k].length : 0;
    placeholderMask[k] = !hasRealImg[k];
  }
  folderInfo.innerHTML = buildSeqFrameGridHtml(currFrames, {
    placeholderMask: placeholderMask,
    headerLabel: rootFolderDisplayName ? '📁 <b>' + String(rootFolderDisplayName).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</b>（真实加载）' : '📁 真实帧已加载',
    footerLabel: (Object.values(placeholderMask).some(Boolean) ? '<span style="color:#777;font-size:11px;">标有"(占位)"的动作暂无真实图片，将使用默认占位图渲染</span>' : '')
  });
  frameIdx = 0;
  renderFrame();
  updateStatus();
});

    btnCreateFolders.addEventListener('click', async function() {
      try {
        const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });

        // 获取当前所有子目录

/* ==================== 键盘事件 ==================== */
const keys = {};
/* ==================== 状态机 ====================
 * 状态：IDLE=0 / WALK=1 / RUN=2 / JUMP=3 / CROUCH=4 / SPRINT=5 / CROUCH_SPRINT=6
 * 规则：
 *   1. CROUCH / CROUCH_SPRINT / SPRINT 中禁止跳跃：W/Space 被忽略；必须先松 S（从蹲态起）或松 Shift/切档（从SPRINT退）才能跳
 *      JUMP 中允许按冲刺档/Shift：空速按冲刺档走 SPRINT_SPD（curState 保持 JUMP）
 *      JUMP 中允许按 S 记录"下蹲意图" airCrouchRequest，但空中仍保持 JUMP；
 *      落地时：若 airCrouchRequest 仍有效（且 S 未松）→ 切下蹲（普通蹲 or 冲刺蹲看前一基础态+冲刺档+Shift）
 *      跳跃中若在落地前松开 S → airCrouchRequest=false，落地不下蹲
 *   2. IDLE/WALK + S → CROUCH；走动+下蹲使用 CROUCH_SPD（比 WALK_SPD 慢）
 *   3. RUN + S → CROUCH（强制降速到 CROUCH_SPD，等同"走动+下蹲"）；CROUCH 中按 Shift 不会变 RUN（也不会变 SPRINT）
 *   4. SPRINT（冲刺档 sprintMode=true 且按住 Shift 且移动）+ S → CROUCH_SPRINT：
 *        移动速度保持 SPRINT_SPD 不变，碰撞框变矮（colHCrouch）；
 *      先进入 CROUCH 普通蹲之后，再切到冲刺档+按 Shift 不允许直接升 SPRINT（即"下蹲时不可以冲刺"）；
 *      只有先松 S 起立再按 Shift+冲刺档，才会变 SPRINT，然后再 S 才变 CROUCH_SPRINT
 *   以上通过 baseModeBeforeCrouch 记忆"进入下蹲那一刻所处的基础态（SPRINT/RUN/WALK/IDLE）"实现
 */
let spaceLocked = false, wLocked = false, sLocked = false, rLocked = false, pendingJump = false;
let sprintEndJumpBuffer = false; // 冲刺剩余≤0.25秒内按下跳跃的缓冲：冲刺结束后自动触发跳跃
let airCrouchRequest = false; // 跳跃中按下S记录的意图：落地时若S仍按住才应用，落地前松S则清掉

/* ---------- 自定义覆盖式滚动条（左栏/右栏，悬浮在舞台区域） ---------- */
let customSBLeft = null, customSBRight = null;   // 滚动条 DOM（含 sb-thumb
let customSBHideTimers = { left:null, right:null }; // 3s 自动隐藏计时器
let customSBDrag = { which:null, startY:0, startScrollTop:0, trackH:0, scrollH:0 }; // 拖拽状态
function buildCustomScrollbar(containerEl, whichSide) {
  if (!containerEl) return null;
  const sb = document.createElement('div');
  sb.className = 'custom-scrollbar track';
  sb.id = (whichSide === 'left') ? 'customScrollbarLeft' : 'customScrollbarRight';
  const thumb = document.createElement('div');
  thumb.className = 'sb-thumb';
  sb.appendChild(thumb);
  document.body.appendChild(sb);
  function syncSB() {
    const ch = containerEl.clientHeight, sh = containerEl.scrollHeight, st = containerEl.scrollTop;
    if (sh <= ch + 1) { sb.classList.remove('show'); return; } // 无需滚动
    const ratio = ch / sh;
    const thumbH = Math.max(40, Math.round(ch * ratio));
    const maxThumb = ch - thumbH;
    const maxScroll = sh - ch;
    const top = maxScroll > 0 ? Math.round((st / maxScroll) * maxThumb) : 0;
    thumb.style.height = thumbH + 'px';
    thumb.style.top = top + 'px';
  }
  function showSB() {
    syncSB();
    const ch = containerEl.clientHeight, sh = containerEl.scrollHeight;
    if (sh <= ch + 1) return;
    sb.classList.add('show');
    if (customSBHideTimers[whichSide]) clearTimeout(customSBHideTimers[whichSide]);
    customSBHideTimers[whichSide] = setTimeout(function(){ sb.classList.remove('show'); }, 3000);
  }
  containerEl.addEventListener('scroll', showSB, { passive:true });
  // 滚轮 + 尺寸变化时重新同步
  window.addEventListener('resize', function(){ syncSB(); });
  new ResizeObserver(function(){ syncSB(); }).observe(containerEl);
  // 拇指拖拽：滚动
  thumb.addEventListener('mousedown', function(ev){
    ev.preventDefault(); ev.stopPropagation();
    const ch = containerEl.clientHeight, sh = containerEl.scrollHeight;
    customSBDrag.which = whichSide;
    customSBDrag.startY = ev.clientY;
    customSBDrag.startScrollTop = containerEl.scrollTop;
    customSBDrag.trackH = ch;
    customSBDrag.scrollH = sh;
    thumb.classList.add('dragging');
    showSB();
  });
  // 初始化一次
  setTimeout(syncSB, 0);
  return { el:sb, thumb:thumb, sync:syncSB, show:showSB };
}
// 全局鼠标移动：拖拽滚动条（document级监听
document.addEventListener('mousemove', function(ev){
  if (!customSBDrag.which) return;
  const container = (customSBDrag.which === 'left') ? document.getElementById('displayPanel') : document.getElementById('panel');
  if (!container) return;
  const dY = ev.clientY - customSBDrag.startY;
  const ratio = container.clientHeight / customSBDrag.scrollH;
  container.scrollTop = Math.max(0, Math.min(customSBDrag.scrollH - container.clientHeight, customSBDrag.startScrollTop + dY / ratio));
});
document.addEventListener('mouseup', function(){
  if (customSBDrag.which) {
    const sb = (customSBDrag.which === 'left') ? customSBLeft : customSBRight;
    if (sb && sb.thumb) sb.thumb.classList.remove('dragging');
    customSBDrag.which = null;
  }
});
/* ---------- 初始化自定义覆盖式滚动条（左/右栏，变量已声明，函数已定义，此时可安全调用） ---------- */
(function initCustomScrollbars(){
  const dp = document.getElementById('displayPanel');
  const rp = document.getElementById('panel');
  if (dp) customSBLeft  = buildCustomScrollbar(dp, 'left');
  if (rp) customSBRight = buildCustomScrollbar(rp, 'right');
})();
// 基于"冲刺档+Shift+moving"判断当前若站着会是哪个基础态（不考虑下蹲）
function currentStandBase(moving, shift) {
  if      (!moving)              return IDLE;
  else if (sprintMode && shift)  return SPRINT;
  else if (shift)                return RUN;
  else                           return WALK;
}

// 尝试切换"下蹲"：着地时立即切换（并记录/清空 baseModeBeforeCrouch）；跳跃中如果是请求下蹲则记到 airCrouchRequest，落地再应用
function tryToggleCrouch(toCrouch, baseHint) {
  if (isJumping) {
    if (toCrouch) airCrouchRequest = true;
    else          airCrouchRequest = false;
    return false;
  }
  if (toCrouch === isCrouching) return true;   // 已为目标状态
  if (toCrouch) {
    // 蹲下：脚底 posY 不变，头顶降低；记住"进入下蹲前的基础态"，用于区分 CROUCH vs CROUCH_SPRINT
    const b = (typeof baseHint === 'number') ? baseHint : (curState === SPRINT || curState === RUN || curState === WALK || curState === IDLE ? curState : IDLE);
    baseModeBeforeCrouch = b;
    isCrouching = true;
    if (posY > mapTotalH - colHCrouch) posY = mapTotalH - colHCrouch;
    return true;
  } else {
    // 起立：先检测上方是否有障碍，挡住则保持蹲下
    if (checkStandUpOverlap()) {
      return false;                             // 上方有障碍 → 保持蹲下
    }
    isCrouching = false;
    baseModeBeforeCrouch = IDLE;               // 起立后清空
    if (posY > mapTotalH - colHNormal) posY = mapTotalH - colHNormal;
    return true;
  }
}

// 起立上方重叠检测（不修改 posY，只返回 true 代表会撞）
// 始终使用 colHNormal（站立高度）检测站起后的碰撞
function checkStandUpOverlap() {
  const ch = colHNormal;
  const charLeft   = charX - colW/2;
  const charRight  = charX + colW/2;
  const charBottom = posY;
  const charTop    = posY + ch;
  // 世界顶部边界限制
  if (charTop > mapTotalH) return true;
  for (const p of platforms) {
    // 可穿越平台只有顶部一条线碰撞，不阻碍角色身体（含起立时的头顶扩展）
    // → 起立检测跳过可穿越平台，避免头顶碰到上方可穿越平台时被误判为无法起立
    if (p.passable) continue;
    const pLeft   = p.x * GRID;
    const pRight  = (p.x + p.w) * GRID;
    const pBottom = p.y * GRID;
    const pTop    = pBottom + p.h * GRID;
    if (charRight <= pLeft || charLeft >= pRight) continue;
    if (charBottom >= pTop  || charTop  <= pBottom) continue;
    return true;
  }
  return false;
}

document.addEventListener('keydown', function(e) {
  keys[e.code] = true;

  // W/Space → 跳跃；下蹲/冲刺/冲刺蹲中禁止跳跃（必须先退档/松S再按）
  if (e.code === 'Space' || e.code === 'KeyW') {
    const cannotJump = isCrouching || curState === SPRINT || curState === CROUCH_SPRINT;
    if (!cannotJump) {
      if (e.code === 'Space') {
        if (!spaceLocked) { spaceLocked = true; pendingJump = true; e.preventDefault(); }
      } else {
        if (!wLocked) { wLocked = true; pendingJump = true; e.preventDefault(); }
      }
    } else {
      // 冲刺剩余≤0.25秒且非下蹲：缓冲跳跃，冲刺结束后自动触发
      if (!isCrouching && sprintLockTimer > 0 && sprintLockTimer <= 0.25) {
        if (e.code === 'Space') {
          if (!spaceLocked) { spaceLocked = true; sprintEndJumpBuffer = true; }
        } else {
          if (!wLocked) { wLocked = true; sprintEndJumpBuffer = true; }
        }
      }
      // 蹲下状态下按空格：若正站在可穿越平台上，则穿越平台并坠落
      // 若下方普通实体平台会阻碍穿越则不执行、不占用 spaceLocked，避免输入被"吃掉"
      if (e.code === 'Space' && isCrouching && !spaceLocked && isStandingOnPassable()) {
        if (triggerPassableDrop()) spaceLocked = true;
      }
      e.preventDefault(); // 仍阻止 Space 滚动 / 页面 W 快捷
    }
  }

  // S → 下蹲；跳跃中禁止下蹲（落地时由落地逻辑触发）
  if (e.code === 'KeyS') {
    if (!sLocked) {
      sLocked = true;
      const mv = !!(keys['KeyA']||keys['KeyD']);
      const sh = !!(keys['ShiftLeft']||keys['ShiftRight']);
      tryToggleCrouch(true, currentStandBase(mv, sh));
      e.preventDefault();
    }
  }

  // R → 将人物移回重置点（按住只触发一次，松开后才能再次触发）
  if (e.code === 'KeyR' && !rLocked) {
    rLocked = true;
    playSnd(sndReturn);   // 按下 R 播放一次 return 音效
    velY = 0;
    isJumping = false;
    isFalling = false;
    fallRecorded = false;
    jumpsUsed = 0; jumpCount = 0;
    moveDistPx = 0; maxHeightCur = 0; startPosY = 0;
    airTimeAccum = 0; segElapsedList = [];
    sprintCount = 0; airSprintSegUsed = 0;
    airCrouchRequest = false;
    sprintLockTimer = 0;
    sprintEndJumpBuffer = false; // 清除冲刺结束跳跃缓冲
    currentSpd = 0; prevMoveDir = 0; blockedLastFrame = false;
    isWallClimbJumping = false; wallClimbJumpDir = 0; wallClimbJumpWalkForced = false; wallClimbJumpInitDirLocked = false; wallClimbJumpJustStarted = false; wallClimbJumpAirborne = false;
    // 重置回重置点：回满体力条，清除体力相关状态
    stamina = 1; isRunning = false; isSprinting = false; staminaDepleted = false; staminaShiftRecovering = false;
    charX = resetPointX;
    posY = resetPointY;
    curState = IDLE;
    setCharClass(STATE_CSS[IDLE]);
    frameIdx = 0;
    updateStatus();
    renderFrame();
    if (staminaEnabled) updateStaminaRing();  // 立即刷新体力环显示
    e.preventDefault();
  }

  const isCtrlDown = (e.ctrlKey || e.metaKey); // 兼容 Mac 的 Cmd

  // Ctrl+Z / Ctrl+Shift+Z / Ctrl+Y → 绘制模式下的撤回/还原
  // 注意：仅在绘制模式生效；e.repeat 用于系统自动重复时去抖
  if (isCtrlDown && drawMode && !e.repeat) {
    // 撤回：Ctrl+Z （Mac: Cmd+Z）
    if (e.code === 'KeyZ' && !e.shiftKey) {
      const did = performUndo();
      if (did) showGroupBubble('↺ 撤回');
      e.preventDefault();
    }
    // 还原：Ctrl+Y 或 Ctrl+Shift+Z（两个通用撤销重做快捷键都支持）
    else if (e.code === 'KeyY' || (e.code === 'KeyZ' && e.shiftKey)) {
      const did = performRedo();
      if (did) showGroupBubble('↻ 还原');
      e.preventDefault();
    }
  }
});
document.addEventListener('keyup', function(e) {

  if (e.code === 'Space') spaceLocked = false;
  if (e.code === 'KeyW')    wLocked = false;

  // 松开 Shift → 允许下次地面冲刺，并清除"本次 Shift 冲刺上限"标记
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    sprintLatch = true;
    sprintExpiredThisShift = false;

  }
  // 松开 S → 尝试起立（上方无阻挡才能成功）
  if (e.code === 'KeyS')    { sLocked = false; tryToggleCrouch(false); }
});

/* ==================== 跳跃 ==================== */
let jumpGraceTimer = 0;
let startCrouchFlag = false;   // 记录本次起跳/掉落前是否处于下蹲状态，用于移动记录

/* ==================== 音效（内置，无需用户上传） ==================== */
const sndWalk   = new Audio('sound/walk.wav');
const sndRun    = new Audio('sound/run.wav');
const sndIdle   = new Audio('sound/idle.wav');
const sndJump   = new Audio('sound/jump.wav');
const sndSprint = new Audio('sound/sprint.wav');
const sndReturn = new Audio('sound/return.wav');
const sndPen    = new Audio('sound/pen.wav');
const sndFire   = new Audio('sound/fire.wav');
const allSnds   = [sndWalk, sndRun, sndIdle, sndJump, sndSprint, sndReturn, sndPen, sndFire];
let isMuted = false;
muteBtn.addEventListener('click', function() {
  isMuted = !isMuted;
  allSnds.forEach(function(s){ s.muted = isMuted; });
  muteIconOn.style.display  = isMuted ? 'none' : '';
  muteIconOff.style.display = isMuted ? '' : 'none';
  muteBtn.title = isMuted ? '取消静音' : '静音';
  showGroupBubble(isMuted ? '🔇 已静音' : '🔊 已开启声音');
});
let footstepTimer = 0;            // 脚步音效累计计时
let footstepSnd = null;           // 上一帧脚步用的音效（null=非脚步态，用于检测"刚进入/切换"→立刻播放）
let runSndPlaying = false;        // run.wav 是否正在循环播放
let idleSndPlaying = false;       // idle.wav 是否正在循环播放（蹲下走动）
let penSndPlaying = false;        // pen.wav 是否正在循环播放（绘制平台中）
let lastDrawMoveTs = 0;           // 绘制中最近一次鼠标移动的时间戳（pen 据此暂停/恢复）
let prevIsDrawing = false;        // 上一帧是否在绘制（用于检测绘制结束→归零 pen）
function playSnd(audio) {
  if (!audio) return;
  try {
    audio.currentTime = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}
// 脚步音效：走动每秒2次（walk）；刚进入脚步状态时立刻播放一次，再按节奏继续；非脚步状态停止累计
// （奔跑循环 run.wav、蹲下走动循环 idle.wav，见 updateLoopSounds）
function updateFootstepSound(dt) {
  let interval = 0;
  let snd = null;
  if (curState === WALK)  { interval = 1 / 2; snd = sndWalk; }  // 走动：2次/秒
  if (snd) {
    if (footstepSnd !== snd) {
      playSnd(snd);   // 刚进入脚步状态：立刻播放
      footstepTimer = 0;
      footstepSnd = snd;
    }
    footstepTimer += dt;
    while (footstepTimer >= interval) {
      footstepTimer -= interval;
      playSnd(snd);
    }
  } else {
    footstepTimer = 0;
    footstepSnd = null;
  }
}
// 循环音效：奔跑循环 run.wav、蹲下走动循环 idle.wav；离开对应状态则停止
function updateLoopSounds(moving) {
  // 奔跑：循环 run.wav
  const wantRun = (curState === RUN);
  if (wantRun && !runSndPlaying) {
    sndRun.loop = true;
    sndRun.currentTime = 0;
    const p = sndRun.play();
    if (p && p.catch) p.catch(() => {});
    runSndPlaying = true;
  } else if (!wantRun && runSndPlaying) {
    sndRun.pause();
    sndRun.currentTime = 0;
    sndRun.loop = false;
    runSndPlaying = false;
  }
  // 蹲下走动：循环 idle.wav
  const wantIdle = (curState === CROUCH && moving);
  if (wantIdle && !idleSndPlaying) {
    sndIdle.loop = true;
    sndIdle.currentTime = 0;
    const p = sndIdle.play();
    if (p && p.catch) p.catch(() => {});
    idleSndPlaying = true;
  } else if (!wantIdle && idleSndPlaying) {
    sndIdle.pause();
    sndIdle.currentTime = 0;
    sndIdle.loop = false;
    idleSndPlaying = false;
  }
  // 绘制平台中：鼠标移动时循环 pen.wav，鼠标停住则暂停；结束绘制则停止并归零
  if (isDrawing) {
    const penMoving = (performance.now() - lastDrawMoveTs) < 100;  // 100ms 内有鼠标移动视为"正在绘制"
    if (penMoving && !penSndPlaying) {
      sndPen.loop = true;
      const p = sndPen.play();   // 恢复：从暂停处继续（首次或上次结束归零后从0开始）
      if (p && p.catch) p.catch(() => {});
      penSndPlaying = true;
    } else if (!penMoving && penSndPlaying) {
      sndPen.pause();   // 鼠标停住：暂停（保留位置，恢复时继续）
      penSndPlaying = false;
    }
  } else if (prevIsDrawing) {
    // 绘制刚结束：无论播放中还是暂停中，都停止并归零（下次绘制从头开始）
    sndPen.pause();
    sndPen.currentTime = 0;
    sndPen.loop = false;
    penSndPlaying = false;
  }
  prevIsDrawing = isDrawing;
}

function doJump(ts) {
  const maxSeg = +jumpSegIn.value || 999;
  if (jumpsUsed >= maxSeg) return;
  if (isCrouching) return; // 下蹲中禁止跳跃（双保险，正常由 keydown 拦截）
  if (curState === SPRINT || curState === CROUCH_SPRINT) return; // 冲刺态禁止跳跃

  const v0 = JUMP_V0;

  if (jumpsUsed === 0) {
    startCrouchFlag = false; // 起跳前必为非冲刺非下蹲（已被拦截）
    isJumping    = true;
    isFalling    = false;
    airCrouchRequest = sLocked || !!keys['KeyS']; // 若起跳前就已按住S，也算空中下蹲请求（落地自动回蹲）
    fallRecorded = false;
    velY         = v0;
    startPosY    = posY;
    maxHeightCur = posY;
    moveDistPx   = 0;
    jumpCount    = 1;
    airTimeAccum = 0;
    segElapsedList = [];
    sprintCount  = 0;
    airSprintSegUsed = 0;
    jumpGraceTimer = 0.05;
  } else {
    if (isClimbing) {
      // 攀登中起跳：重置滞空时间（攀登期间累计的不再保留，从 0 重新累加）
      segElapsedList = [];
    } else {
      segElapsedList.push(airTimeAccum);
    }
    velY = v0;
    jumpCount++;
    airTimeAccum = 0;
    jumpGraceTimer = 0.05;
  }
  // 奔跑模式+缓加减速关闭：蹬壁跳反作用力期间再次跳跃（非攀登中，跳跃段数未耗尽）可打断方向锁定
  // 清除 isWallClimbJumping 后，反作用力覆盖不再生效，玩家朝按键方向跳跃
  if (!sprintMode && !smoothSpeedEnabled && isWallClimbJumping && !isClimbing) {
    isWallClimbJumping = false;
    wallClimbJumpDir = 0;
    wallClimbJumpWalkForced = false;
    wallClimbJumpInitDirLocked = false;
    wallClimbJumpAirborne = false;  // 新跳跃打断蹬壁跳，不再是蹬壁跳跳跃
    // 同步重置跳跃锁定状态，使本帧新方向可被重新捕获（若启用了"跳跃时禁止改变方向和速度"）
    if (jumpLockEnabled) prevJumpLockActive = false;
  }
  // 奔跑模式+缓加减速开启：蹬壁跳反作用力期间再次跳跃（非攀登中，跳跃段数未耗尽）立即将移动速度变为0
  // 清除 isWallClimbJumping 后反作用力覆盖不再生效，currentSpd 归零后由缓加速重新加速（而非重复施加 RUN_SPD）
  if (!sprintMode && smoothSpeedEnabled && isWallClimbJumping && !isClimbing) {
    isWallClimbJumping = false;
    wallClimbJumpDir = 0;
    wallClimbJumpWalkForced = false;
    wallClimbJumpInitDirLocked = false;
    wallClimbJumpAirborne = false;  // 新跳跃打断蹬壁跳，不再是蹬壁跳跳跃
    currentSpd = 0;  // 立即将移动速度变为0，而非重复施加奔跑速度
    if (jumpLockEnabled) prevJumpLockActive = false;
  }
  // 蹬壁跳反作用力：攀登中起跳（首跳/二段跳均生效）——检测墙壁方向，锁定远离方向
  // （修复：坠落中蹬壁后首跳不施加反作用力——原逻辑仅在 jumpsUsed>0 的二段跳分支处理）
  if (isClimbing && wallClimbJumpRecoilEnabled) {
    // 优先使用实时检测；若位置已滑过墙底导致检测为0，回退到上一帧攀登检测的方向
    let wallDir = detectClimbableWallContact();
    if (wallDir === 0 && lastClimbContact !== 0) wallDir = lastClimbContact;
    if (wallDir !== 0) {
      isWallClimbJumping = true;
      wallClimbJumpDir = -wallDir;        // 远离方向 = 墙壁反方向
      wallClimbJumpWalkForced = false;    // 重置降速锁定标志
      wallClimbJumpInitDirLocked = true;  // 缓加减速开启时：第一帧锁定方向朝远离，随后清除
      wallClimbJumpJustStarted = true;    // 标记本帧刚启动反作用力，防止冲刺同帧自动触发清除
      wallClimbJumpAirborne = true;       // 标记本次跳跃源自蹬壁跳（持续到落地，顶点不清除）
      // 跳跃锁定模式下：重置锁定状态，使本帧反作用力方向被重新捕获（而非沿用上次跳跃的锁定方向）
      // 流程：doJump重置prevJumpLockActive → 反作用力覆盖dir/spd → 跳跃锁定捕获反作用力方向并维持
      if (jumpLockEnabled) prevJumpLockActive = false;
    }
  }
  jumpsUsed++;
  frameIdx = 0; frameTimer = 0;
  curState = JUMP;
  isClimbing = false;  // 起跳/二段跳脱离墙面，退出攀登
  playSnd(sndJump);   // 跳跃音效：每次起跳播放一次
  setCharClass(STATE_CSS[JUMP]);
  updateStatus();
  renderFrame();
}

/* ==================== 帧推进 ==================== */
function getFrameList() { return frames[frameKey(curState)] || []; }
// 将 hex 颜色按 factor（0~1）变暗：0=黑，1=原色
function darkenHex(hex, factor) {
  const h = (hex || '#000').replace('#','');
  const r = parseInt(h.substring(0,2),16) || 0;
  const g = parseInt(h.substring(2,4),16) || 0;
  const b = parseInt(h.substring(4,6),16) || 0;
  return 'rgb(' + Math.round(r*factor) + ',' + Math.round(g*factor) + ',' + Math.round(b*factor) + ')';
}

function setCharClass(cls) {
  charEl.className = cls;
  // 加载真实序列帧后：对应状态不显示占位背景色（crouch-sprint 复用 crouch 帧判定）
  const cssToKey = {
    'p-idle':'idle','p-walk':'walk','p-run':'run','p-jump':'jump',
    'p-crouch':'crouch','p-sprint':'sprint','p-crouch-sprint':'crouch'
  };
  const k = cssToKey[cls];
  if (k && hasRealImg && hasRealImg[k]) {
    // 真实帧：charSprite 显示帧图，charWrap（碰撞框）不着色
    charEl.style.backgroundColor = 'transparent';
    charWrap.style.backgroundColor = 'transparent';
  } else {
    // 占位：仅碰撞框区域着色（charWrap = colW×colH），颜色取状态色加深，不超出碰撞框
    charEl.style.backgroundColor = 'transparent';
    charWrap.style.backgroundColor = k ? darkenHex(stateColors[k], 0.4) : '#3a3a4e';
  }
  if (outlineOn) updateOutlineColor();
}

function renderFrame() {
  const list = getFrameList();
  if (list.length) charEl.style.backgroundImage = 'url(' + list[frameIdx % list.length] + ')';
}

function updateStatus() {
  const list = getFrameList();
  const total = list.length || 0;
  const maxSeg = +jumpSegIn.value || 999;
  const showCount = maxSeg >= 999 ? Math.max(5, jumpsUsed) : maxSeg;
  let segHtml = '';
  for (let i = 0; i < showCount; i++) segHtml += '<span class="seg-dot' + (i < jumpsUsed ? ' used' : '') + '" style="border-color:' + stateColors.jump + ';"></span>';

  let airDisplay = '0.0000';
  if (isJumping) {
    if (jumpCount === 1) airDisplay = Math.min(airTimeAccum, jumpT).toFixed(4);
    else {
      let c = airTimeAccum;
      for (const s of segElapsedList) c += s;
      airDisplay = c.toFixed(4);
    }
  }

  const moveDisplay = (moveDistPx / GRID).toFixed(2);
  const riseDisplay = isJumping
    ? Math.max(0, (maxHeightCur - startPosY) / GRID).toFixed(4)
    : '0.0000';

  const C_DIM = '#888';
  const stateColor = stateColors[stateKey(curState)];
  const sprintLight = (sprintLockTimer > 0) ? ' <span class="sprint-light" title="冲刺中"></span>' : '';
  // 攀登仍处于跳跃态（curState=JUMP），仅右边栏文字显示"攀登"，序列帧/记录沿用跳跃
  const stateLabel = isClimbing ? '攀壁时间' : STATE_NAME[curState];
  // 攀登时"滞空"标签改为"攀壁时间"（值仍为攀登期间的累计时间）
  const airLabel   = isClimbing ? '攀壁时间' : '滞空时间';

  let airSegHtml = '';
  for (let i = 0; i < airSprintSegMax; i++) airSegHtml += '<span class="seg-dot' + (i < airSprintSegUsed ? ' used' : '') + '" style="border-color:#ffeb35;"></span>';

  statusEl.innerHTML =
    '<span style="color:#fff">状态：</span><span style="color:' + stateColor + '">' + stateLabel + sprintLight + '</span>' +
    ' <span style="color:#fff">帧：</span>' + (frameIdx+1) + '/' + total + '<br>' +
    '<span style="color:' + stateColors.jump + '">跳跃段数：</span>' + segHtml + ' (' + jumpsUsed + '/' + (maxSeg >= 999 ? '∞' : maxSeg) + ')<br>' +
    '<span style="color:#ffeb35">空冲段数：</span>' + airSegHtml + ' (' + airSprintSegUsed + '/' + airSprintSegMax + ')<br>' +
    '<span style="color:' + stateColors.jump + '">' + airLabel + '：</span>' + airDisplay + '秒<br>' +
    '<span style="color:' + stateColors.walk + '">上升高度：</span>' + riseDisplay + '秒<br>' +
    '<span style="color:' + stateColors.walk + '">移动距离：</span>' + moveDisplay + '格' +
    (smoothSpeedEnabled && !sprintMode ? '<br><span style="color:#bd93f9">当前速度：</span>' + displaySpd.toFixed(2) + '格/s' : '');
}

/* ==================== 记录表格 ==================== */
function renderRecordTable() {
  recordBody.innerHTML = '';
  jumpRecords.forEach(function(r, idx) {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (idx+1) + '</td>' +
      '<td style="color:' + stateColors.jump + '">' + r.time.toFixed(4) + 's</td>' +
      '<td style="color:' + stateColors.walk + '">' + r.height.toFixed(2) + '</td>' +
      '<td style="color:' + stateColors.walk + '">' + r.distance.toFixed(2) + '格</td>' +
      '<td style="color:' + stateColors.jump + '">' + r.jumps + '次</td>' +
      '<td style="color:#ffeb35;">' + r.sprints + '次</td>';
    recordBody.appendChild(tr);
  });
  countLabel.textContent = '(' + jumpRecords.length + ')';
  if (jumpRecords.length > 10 && scrollBox) scrollBox.scrollTop = scrollBox.scrollHeight;
}
clearBtn.addEventListener('click', function() { jumpRecords = []; renderRecordTable(); });

/* ==================== 主循环 ==================== */
let lastTs = 0;
function loop(ts) {
  let dt = lastTs ? (ts - lastTs) / 1000 : 0;
  if (dt > 0.05) dt = 0.05;
  lastTs = ts;

  if (pendingJump) { pendingJump = false; doJump(ts); }

  // 可穿越平台穿越状态清理：
  //   - 已落地（isJumping=false）→ 清除，允许下一次穿越
  //   - 脚底已落到该平台底面之下（完整穿出此层）→ 清除，该平台恢复碰撞
  if (passableDropPlatform) {
    const pb = passableDropPlatform.y * GRID;
    if (!isJumping || posY < pb) passableDropPlatform = null;
  }
  // 非跳跃态必非攀登（落地/重置等情况下兜底清除攀登标志）
  if (!isJumping) isClimbing = false;

  const aDown = !!keys['KeyA'], dDown = !!keys['KeyD'];
  const shift = !!keys['ShiftLeft'] || !!keys['ShiftRight'];
  let moving = false, dir = 0;
  if (aDown) { dir = -1; moving = true; }
  if (dDown) { dir =  1; moving = true; }

  /* ---------- 冲刺进入判定 ----------
   * 条件：冲刺档 + Shift 实按 + 有方向键（且当前不在冲刺锁定中）
   * 允许从任意态（包括 JUMP 空中）切入冲刺：一旦进入 → velY=0、锁定posY高度、
   *   启动 sprintLockTimer = (sprintDistD / sprintSpeedD) × jumpT 秒，锁定期间必须保持冲刺态直到到期
   * 空中冲刺段数限制：在空中时冲刺消耗段数，地面冲刺不受限制
   * 空中冲刺不打断滞空/上升/移动的记录，只冻结物理和高度
   */
  const wantSprintNow = sprintMode && shift && moving;
  const isInAir = isJumping || isFalling;
  if (sprintLockTimer <= 0 && wantSprintNow) {
    let canSprint = true;
    // 体力检查：冲刺模式下剩余体力不够一次冲刺时禁止启动
    if (staminaEnabled && sprintMode && stamina < 1 / Math.max(1, staminaSprintMax)) {
      canSprint = false;
    }
    // 冲刺按一次只触发一次：Shift未松开时不允许再次触发冲刺
    if (sprintExpiredThisShift) {
      canSprint = false;
    }
    // 蹬壁跳反作用力刚启动的本帧禁止冲刺自动触发：否则冲刺会在反作用力覆盖之前清除 isWallClimbJumping，
    // 导致坠落中蹬壁后首跳（jumpsUsed=0 重置 airSprintSegUsed=0）反作用力完全不生效
    // 玩家可在下一帧主动冲刺打断反作用力（与"可消耗1次空中冲刺段数打断"设计一致）
    if (wallClimbJumpJustStarted) {
      canSprint = false;
    }
    if (isInAir) {
      // 空中/攀壁冲刺同样需等待 Shift 松开再按下：一次按键只触发一次冲刺
      // （修复：蹬壁跳后再次蹬壁时 Shift 持续按住会自动释放冲刺）
      if (!sprintLatch) {
        canSprint = false;
      } else if (airSprintSegUsed >= airSprintSegMax) {
        // 空中冲刺需要消耗段数
        canSprint = false;
      } else {
        airSprintSegUsed++;
      }
    } else {
      // 地面冲刺需等待Shift松开再按下
      if (!sprintLatch) canSprint = false;
    }
    if (canSprint) {
      sprintLatch = false;
      sprintLockIsGround = !isInAir;   // 记录本次冲刺是否为地面冲刺（用于锁定结束时判定是否触发"切回走动"）
      const dDur = Math.max(0.001, sprintSpeedD);
      sprintLockDurMax = sprintDistD / dDur;
      sprintLockTimer   = sprintLockDurMax;
      // 冲刺开始瞬间：垂直速度清零，锁定高度（posY不再被重力改变）
      velY = 0;
      // 攀壁冲刺：朝墙壁反方向冲刺脱墙（覆盖输入方向，冲刺锁定期间强制脱墙方向）
      if (isClimbing) {
        const wallDir = detectClimbableWallContact();
        climbDashDir = (wallDir !== 0) ? -wallDir : 0;
        isClimbing = false;
      }
      // 冲刺打断蹬壁跳反作用力：冲刺启动后由冲刺接管方向（玩家按键方向），解除反作用力约束
      if (isWallClimbJumping) {
        isWallClimbJumping = false;
        wallClimbJumpDir = 0;
        wallClimbJumpWalkForced = false;
        wallClimbJumpInitDirLocked = false;
        wallClimbJumpAirborne = false;  // 冲刺打断蹬壁跳，不再是蹬壁跳跳跃
      }
      if (isInAir) {
        // 空中冲刺：保留 isJumping/isFalling 和记录变量，只冻结物理
        // 让滞空/上升距离等记录继续累加
        sprintCount++;
      } else {
        // 地面冲刺：重置跳跃相关状态
        isJumping   = false;
        isFalling   = false;
        fallRecorded= false;
        jumpsUsed   = 0; jumpCount = 0;
        airCrouchRequest = false;
        airTimeAccum = 0; segElapsedList = [];
        moveDistPx  = 0; maxHeightCur = 0; startPosY = 0;
        sprintCount = 0;
      }
      // 冲刺必然以"冲刺基础态"进入，即便是从下蹲状态切入 → 也会把 baseModeBeforeCrouch 改成 SPRINT
      // （但冲刺档启动瞬间通常不是下蹲，因为下蹲禁止冲刺升级；这里只做保险赋值）
      baseModeBeforeCrouch = SPRINT;
    }
  }
  // 蹬壁跳反作用力启动标志仅在本帧生效（防止冲刺同帧触发），冲刺检查结束后立即清除
  wallClimbJumpJustStarted = false;

  /* ---------- 冲刺锁定倒计时 ---------- */
  // 记录本帧开始时是否仍处于冲刺锁定期（用于检测"刚刚结束"的瞬间）
  const wasSprintLocked = sprintLockTimer > 0;
  if (sprintLockTimer > 0) {
    sprintLockTimer -= dt;
    if (sprintLockTimer < 0) sprintLockTimer = 0;
  }
  // 攀壁冲刺方向随冲刺锁定结束而清除
  if (wasSprintLocked && sprintLockTimer <= 0) climbDashDir = 0;
  // 冲刺结束瞬间：若有缓冲的跳跃（冲刺剩余≤0.25秒内按下跳跃），触发跳跃
  if (wasSprintLocked && sprintLockTimer <= 0 && sprintEndJumpBuffer) {
    sprintEndJumpBuffer = false;
    pendingJump = true;
  }
  // 冲刺锁定刚结束的瞬间：若用户仍按住冲刺条件（Shift+sprintMode+方向）
  // → 标记本次 Shift 期间冲刺已触发 → 后续禁止自动再次触发，必须松开 Shift 再按
  if (wasSprintLocked && sprintLockTimer <= 0 && wantSprintNow) {
    sprintExpiredThisShift = true;
  }
  /* ---------- 锁定期结束后，若用户已松开冲刺条件（档/Shift/方向）→ 回退 baseModeBeforeCrouch=SPRINT，避免冲刺蹲停不下来 ---------- */
  if (sprintLockTimer <= 0 && baseModeBeforeCrouch === SPRINT && !wantSprintNow) {
    // 回退到"如果站起来会是什么基础态"（此时仍可能蹲着）
    baseModeBeforeCrouch = currentStandBase(moving, shift);
  }

  // 速度选择：
  //   冲刺锁定中（sprintLockTimer>0）→ 恒使用 SPRINT_SPD（不管是否按 Shift、是否蹲下，速度不变）
  //   未锁定：按是否蹲下/冲刺档+Shift/Shift 选择速度
  //   空中且冲刺段数耗尽时，不允许使用 SPRINT_SPD
  //   sprintExpiredThisShift=true（本次 Shift 冲刺已上限，Shift 未松）→ 强制 WALK_SPD/CROUCH_SPD，不再冲刺或奔跑
  //   体力耗尽时：奔跑模式立即切为走动（不降速），冲刺模式仅禁止再次冲刺（锁定中不降速）
  let spd = WALK_SPD;
  if (sprintLockTimer > 0) {
    // 冲刺锁定中：启动冲刺时已校验体力足够，全程保持 SPRINT_SPD，体力为 0 也不降速
    spd = SPRINT_SPD;                              // 锁定冲刺速度（包含冲刺+下蹲也保持 SPRINT_SPD）
  } else if (sprintExpiredThisShift) {
    // 冲刺上限后 Shift 未松：切回走动速度（站立 WALK_SPD / 下蹲 CROUCH_SPD）
    spd = isCrouching ? CROUCH_SPD : WALK_SPD;
  } else {
    const canSprintSpeed = !isInAir ? sprintLatch : (sprintMode && shift && !sprintExpiredThisShift && airSprintSegUsed < airSprintSegMax);
    // 体力限制检查
    let staminaBlockRun = false;
    let staminaBlockSprint = false;
    if (staminaEnabled) {
      if (sprintMode) {
        // 冲刺模式：剩余体力不够一次冲刺时，禁止冲刺 AND 禁止奔跑（维持走动）
        if (stamina < 1 / Math.max(1, staminaSprintMax)) {
          staminaBlockSprint = true;
          staminaBlockRun = true;
        }
      } else {
        // 奔跑模式：体力耗尽后必须抬起 Shift 才能再跑
        // staminaDepleted=true 时，按住 Shift 即使体力恢复也不能奔跑
        // 只有 Shift 松开后才能解除耗尽状态
        const minFrameCost = dt / Math.max(0.001, staminaRunMax);
        if (staminaDepleted) {
          staminaBlockRun = true;
          if (!shift) staminaDepleted = false;  // 松开 Shift 解除锁定
        } else if (stamina < minFrameCost && shift && moving) {
          staminaBlockRun = true;
          staminaDepleted = true;
        }
      }
    }
    if (isCrouching) {
      if (baseModeBeforeCrouch === SPRINT && canSprintSpeed && !staminaBlockSprint) spd = SPRINT_SPD;
      else                                                   spd = CROUCH_SPD;
    } else {
      if      (sprintMode && shift && canSprintSpeed && !staminaBlockSprint) spd = SPRINT_SPD;
      else if (shift && !staminaBlockRun)                                  spd = RUN_SPD;
      else                                             spd = WALK_SPD;
    }
  }

  /* ---------- 蹬壁跳反作用力：速度与方向覆盖 ----------
   * 奔跑模式+缓加减速关闭：RUN_SPD 远离，锁定方向朝远离；按 Shift 立即降到 WALK_SPD 并锁定（松开 Shift 也不回升）
   * 奔跑模式+缓加减速开启：跳过缓加速直接 RUN_SPD；不锁定方向（dir 由玩家按键决定）；
   *   reversalDecel 目标改为0，减速到0才可改方向（见缓加减速块）
   * 冲刺模式：WALK_SPD 远离，锁定方向（可被冲刺打断，见冲刺进入判定）
   */
  if (isWallClimbJumping) {
    if (!sprintMode) {
      if (!smoothSpeedEnabled) {
        // 缓加减速关闭：锁定方向朝远离墙壁
        dir = wallClimbJumpDir;
        moving = true;
        // 首次按 Shift 触发降速锁定，之后保持 WALK_SPD（松开 Shift 也不回升）
        if (shift && !wallClimbJumpWalkForced) wallClimbJumpWalkForced = true;
        spd = wallClimbJumpWalkForced ? WALK_SPD : RUN_SPD;
        currentSpd = spd;
      } else {
        // 缓加减速开启：不持续锁定方向（dir 由玩家按键决定）；但起跳第一帧强制朝远离墙壁方向
        // （wallClimbJumpInitDirLocked 只锁一瞬间，本帧使用后立即清除，之后由玩家按键决定方向）
        if (wallClimbJumpInitDirLocked) {
          dir = wallClimbJumpDir;
          moving = true;
          wallClimbJumpInitDirLocked = false;
          // 起跳第一帧跳过缓加速直接拉满到 RUN_SPD
          if (currentSpd < RUN_SPD) currentSpd = RUN_SPD;
        }
        // 反作用力期间目标速度强制为 RUN_SPD（无论是否按 Shift），防止缓减速将速度降到 WALK_SPD
        // 反转减速（reversalDecel）有独立分支且优先判定，不受此影响，仍按 decelRate 减速到 0
        spd = RUN_SPD;
      }
    } else {
      // 冲刺模式：以走动速度远离，锁定方向
      dir = wallClimbJumpDir;
      moving = true;
      spd = WALK_SPD;
      currentSpd = spd;
    }
  }
  // 蹬壁跳跳跃中顶点后（isWallClimbJumping已清除，wallClimbJumpAirborne仍为true）：目标速度强制为 RUN_SPD
  // 使转向后可从0逐渐加速到奔跑速度，且到达奔跑速度后不因 targetIsWalk 降速回 WALK_SPD
  if (wallClimbJumpAirborne && !isWallClimbJumping && !sprintMode && smoothSpeedEnabled) {
    spd = RUN_SPD;
  }

  /* ---------- 跳跃锁定：空中禁止改变方向和速度（冲刺期间除外） ---------- */
  if (jumpLockEnabled && isJumping) {
    if (!prevJumpLockActive) {
      // 刚进入跳跃：锁定当前方向和实际速度（currentSpd 含缓加速渐变值，而非目标 spd）
      lockedAirDir = dir;
      lockedAirSpd = currentSpd;
      prevJumpLockActive = true;
    }
    // 冲刺刚结束（本帧从 sprintLockTimer>0 变为 <=0）：锁定方向更新为冲刺方向，锁定速度保持为冲刺前速度
    if (prevJumpLockActive && wasSprintLocked && sprintLockTimer <= 0) {
      lockedAirDir = dir;  // 锁定方向 = 冲刺时的新方向（冲刺改变了方向，之后以此方向为准）
      // lockedAirSpd 保持不变：仍为冲刺前的速度（跳跃起始时锁定的速度）
    }
    // 冲刺锁定中不覆盖方向和速度：允许冲刺改变方向和速度
    // 冲刺结束后恢复：方向=冲刺后的新方向（已在上方更新），速度=冲刺前的原速度（保持不变）
    if (sprintLockTimer <= 0) {
      dir = lockedAirDir;
      spd = lockedAirSpd;
      moving = (dir !== 0);
    }
  } else if (prevJumpLockActive && !isJumping) {
    // 落地：重置锁定状态
    prevJumpLockActive = false;
    lockedAirDir = 0;
    lockedAirSpd = 0;
  }

  /* ---------- 奔跑中切换方向：需先减速到走动速度才可变换方向 ---------- */
  // 仅在缓加速缓减速启用、且上一帧确实在朝某方向实际移动（prevMoveDir≠0）时生效；
  // 被墙阻挡（prevMoveDir=0）或从静止起步时不触发，避免方向锁死；
  // 蹲下状态下禁用（与缓加减速约束一致：蹲下时方向立即变换）。
  let reversalDecel = false;
  if (smoothSpeedEnabled && !sprintMode && sprintLockTimer <= 0 && moving
      && !isCrouching && prevMoveDir !== 0 && dir !== 0 && dir !== prevMoveDir
      && currentSpd > (wallClimbJumpAirborne ? 0 : WALK_SPD + 1)) {  // 蹬壁跳跳跃中（含顶点后下落）：减速到0才可改方向
    reversalDecel = true;
    dir = prevMoveDir;  // 保持原方向继续移动，待减速到目标后才变换方向
  }

  /* ---------- 奔跑退出减速：松开 Shift 或方向键后需缓减速到 WALK_SPD 才退出奔跑态 ---------- */
  // 触发：当前为奔跑态、速度仍高于走动、且不再同时按 Shift+方向（runIntentLost）。
  // 期间保持奔跑态（在状态判定中强制 RUN）；若方向键已松开则按 facing 惯性滑行使速度能继续递减。
  // 体力耗尽时不触发（按约束应立即切走动，而非降速）。
  let runExitDecel = false;
  if (smoothSpeedEnabled && !sprintMode && sprintLockTimer <= 0 && !isCrouching
      && !(staminaEnabled && staminaDepleted)
      && curState === RUN && currentSpd > WALK_SPD + 1 && !(shift && moving)) {
    runExitDecel = true;
    if (!moving) { moving = true; dir = facing; }  // 惯性滑行：保持原方向继续移动以便减速
  }

  /* ---------- 缓加速缓减速（仅走动↔奔跑切换时生效；冲刺档/冲刺锁定时禁用） ---------- */
  // 体力耗尽（staminaDepleted）时跳过缓减速：奔跑模式应立即切为走动，而非逐步降速
  // 跳跃锁定时跳过：空中速度锁定在跳跃瞬间的 currentSpd，不渐变加速/减速
  if (smoothSpeedEnabled && !sprintMode && sprintLockTimer <= 0 && moving && !(staminaEnabled && staminaDepleted)
      && !(jumpLockEnabled && isJumping)) {
    const tol = 1;
    const targetIsRun  = Math.abs(spd - RUN_SPD)  < tol;
    const targetIsWalk = Math.abs(spd - WALK_SPD) < tol;
    // 蹬壁跳跳跃中按 Shift：加速度和减速度暂时翻倍（消耗耐力），松开恢复原值
    const wclRateMul = (wallClimbJumpAirborne && shift && !(staminaEnabled && staminaDepleted)) ? 2 : 1;
    if (reversalDecel) {
      // 反转减速：强制从 currentSpd 减速到目标（蹬壁跳跳跃中=0，否则=WALK_SPD，方向暂不翻转）
      const decelPx = decelRate * wclRateMul * GRID;
      const floor = wallClimbJumpAirborne ? 0 : WALK_SPD;
      currentSpd = Math.max(currentSpd - decelPx * dt, floor);
      spd = currentSpd;
    }
    // 撞墙：上一帧被阻挡 → 立即降速到走动速度，且持续顶墙期间不重新加速
    // 蹬壁跳反作用力期间跳过：攀登中顶墙导致 blockedLastFrame=true，不应影响反作用力的 RUN_SPD
    else if (blockedLastFrame && !isCrouching && !isWallClimbJumping) {
      currentSpd = WALK_SPD;
      spd = currentSpd;
    }
    // 奔跑退出减速：松开 Shift/方向后强制减速到 WALK_SPD（方向松开时按 facing 滑行）
    else if (runExitDecel) {
      const decelPx = decelRate * GRID;
      currentSpd = Math.max(currentSpd - decelPx * dt, WALK_SPD);
      spd = currentSpd;
    }
    // 蹬壁跳跳跃中转向后：从 currentSpd（通常为0）按 accelRate 逐渐加速到 RUN_SPD
    // 不按 Shift 也可加速到奔跑速度（spd 被强制 RUN_SPD），按 Shift 则加速度翻倍（消耗耐力）
    else if (wallClimbJumpAirborne && currentSpd < RUN_SPD - tol) {
      const accelPx = accelRate * wclRateMul * GRID;
      currentSpd = Math.min(currentSpd + accelPx * dt, RUN_SPD);
      spd = currentSpd;
    }
    // 缓加速：目标=奔跑，当前低于奔跑速度即加速；currentSpd 低于走动速度时先拉到走动速度起步
    // 蹬壁跳期间跳过缓加速：反作用力仅需首帧拉满 RUN_SPD，后续帧保持/恢复时直接取 spd（跳过渐变加速）
    else if (targetIsRun && currentSpd < RUN_SPD - tol && !isWallClimbJumping) {
      const accelPx = accelRate * GRID;
      currentSpd = Math.min(Math.max(currentSpd, WALK_SPD) + accelPx * dt, RUN_SPD);
      spd = currentSpd;
    }
    // 缓减速：目标=走动，当前在(走动, 奔跑]区间（蹬壁跳期间 spd 被强制 RUN_SPD，targetIsWalk 不会为 true）
    else if (targetIsWalk && currentSpd > WALK_SPD + tol && currentSpd <= RUN_SPD + tol) {
      const decelPx = decelRate * GRID;
      currentSpd = Math.max(currentSpd - decelPx * dt, WALK_SPD);
      spd = currentSpd;
    }
    else {
      currentSpd = spd;
    }
  } else if (smoothSpeedEnabled && !sprintMode && sprintLockTimer <= 0 && !moving && !isCrouching
      && !(jumpLockEnabled && isJumping)) {
    // 静止（站立）时把速度基准设为走动速度，避免按住 Shift 静止后起步直接跳到 RUN_SPD 跳过缓加速
    currentSpd = WALK_SPD;
  } else {
    currentSpd = spd;
  }
  // 状态栏显示用：实际在移动才取 currentSpd，静止归零（不改变缓加减速的插值基准）
  displaySpd = moving ? currentSpd : 0;

  /* ---------- 体力消耗与恢复 ---------- */
  if (staminaEnabled) {
    if (sprintMode) {
      // 冲刺模式：使用连续的 stamina 值（0~1）
      const nowSprinting = (sprintLockTimer > 0) || (isInAir && shift && !sprintExpiredThisShift && airSprintSegUsed < airSprintSegMax);
      if (nowSprinting && !isSprinting) {
        // 开始冲刺：消耗一次冲刺的体力
        stamina = Math.max(0, stamina - 1 / staminaSprintMax);
      }
      isSprinting = nowSprinting;
      // 冲刺模式：判定是否因体力不足进入"按 Shift 也持续恢复"的状态
      // 一旦 stamina 低于单次冲刺消耗，就锁定 staminaShiftRecovering=true
      // 持续恢复直到：① 体力回满 1.0  ② 真正触发一次冲刺（nowSprinting=true）  ③ 松开 Shift
      const sprCost = 1 / Math.max(1, staminaSprintMax);
      if (stamina < sprCost) staminaShiftRecovering = true;
      if (isSprinting) staminaShiftRecovering = false;
      if (stamina >= 1) staminaShiftRecovering = false;
      // 正常恢复条件：不冲刺 + 地面 +（不按 Shift / 不动 / 冲刺冷却中 / 下蹲）
      const normalRecover = !isSprinting && !isInAir && (!shift || !moving || sprintExpiredThisShift || isCrouching);
      // 附加恢复条件：按 Shift 期间因体力不足启动的持续恢复
      const sustainedRecover = staminaShiftRecovering && !isSprinting && !isInAir;
      // 空中恢复条件：在空中且未冲刺时也恢复体力
      const airRecover = !isSprinting && isInAir;
      if (normalRecover || sustainedRecover || airRecover) {
        if (stamina < 1) {
          stamina = Math.min(1, stamina + dt / staminaRecoverTime);
          if (stamina >= 1) staminaShiftRecovering = false; // 回满后清除持续恢复标志
        }
      }
    } else {
      // 奔跑模式：追踪奔跑状态
      // 缓加速时（按住 Shift 意图奔跑，速度从走动渐变到奔跑）消耗体力；
      // 缓减速时（runExitDecel/reversalDecel，松开 Shift 或切换方向滑行减速）不消耗体力，开始恢复
      // 奔跑（Shift+移动，含缓加速）、蹬壁攀登中 均消耗体力；蹬壁攀登不要求 Shift（攀登本身即为消耗），与奔跑同速率
      // 蹬壁跳跳跃中按 Shift 加速度减速度翻倍（wclRateMul=2），但开启跳跃锁定时滞空不消耗体力
      // 仅开启跳跃锁定时：滞空（isInAir）不消耗体力（无论是否按Shift，含普通跳跃和蹬壁跳），蹬壁攀登中仍消耗（|| isClimbing）
      const nowRunning = (shift && moving && !isCrouching && !staminaDepleted && !runExitDecel && (!reversalDecel || wallClimbJumpAirborne) && !(jumpLockEnabled && isInAir && !isClimbing)) || isClimbing;
      if (nowRunning) {
        // 奔跑中（含缓加速渐变期间）：消耗体力（staminaRunMax秒耗尽）
        stamina -= dt / staminaRunMax;
        stamina = Math.max(0, stamina);
      } else {
        // 停止奔跑 / 缓减速滑行：开始恢复（staminaRecoverTime秒完全恢复）
        if (stamina < 1) {
          stamina = Math.min(1, stamina + dt / staminaRecoverTime);
        }
      }
      isRunning = nowRunning;
    }
  }

  /* ---------- 水平移动（拖拽期间完全跳过，角色由鼠标控制） ---------- */
  // 攀壁反方向冲刺：冲刺锁定期间强制使用脱墙方向（覆盖玩家朝墙的输入方向）
  if (sprintLockTimer > 0 && climbDashDir !== 0) {
    dir = climbDashDir;
    moving = true;
  }
  if (!isCharDragging) {
    const prevCharX = charX;  // 记录移动前水平位置，用于累计实际位移
    if (moving) {
      const dx = dir * spd * dt;
      charX += dx; facing = dir;
      checkHorizontalCollision();
    }
    charX = Math.max(colW / 2, Math.min(worldW - colW / 2, charX));
    // 累计"实际"水平位移：被墙/边界阻挡时 charX 不变 → 不增加；
    // 来回运动取绝对值累加（右移+左移都计入）。仅跳跃中累计（落地后归零）。
    if (isJumping) moveDistPx += Math.abs(charX - prevCharX);
    // 记录本帧实际水平移动方向（被墙阻挡时为0），供下一帧奔跑切换方向减速判定
    prevMoveDir = (charX > prevCharX) ? 1 : (charX < prevCharX ? -1 : 0);
    // 撞墙判定：尝试移动但无位移（被墙/边界阻挡）→ 下一帧立即降速到走动速度
    blockedLastFrame = moving && (prevMoveDir === 0);
  } else {
    // 拖拽期间角色由鼠标控制，键盘移动不生效 → 清空方向基准，避免拖拽结束后误触发反转减速
    prevMoveDir = 0;
    blockedLastFrame = false;
  }

  /* ---------- 自动起立：蹲着松开S后移动到上方无障碍时自动退出蹲下 ---------- */
  if (isCrouching && !isJumping && !sLocked && !keys['KeyS']) {
    if (!checkStandUpOverlap()) {
      isCrouching = false;
      baseModeBeforeCrouch = IDLE;
      if (posY > mapTotalH - colHNormal) posY = mapTotalH - colHNormal;
    }
  }

  /* ---------- 重力/跳跃/掉落物理：冲刺锁定期 + 人物拖拽期完全禁用（锁定高度 posY 不变） ---------- */
  // 拖拽期间：完全冻结物理，角色跟随鼠标位置（在 mousemove 中更新）
  if (isCharDragging) {
    // 保持冻结状态，不应用重力/支撑检测
  } else if (sprintLockTimer <= 0) {
    // 记录逻辑始终运行（包括冲刺锁定期），确保滞空/上升距离不中断
    if (isJumping) {
      airTimeAccum += dt;
      if (posY > maxHeightCur) maxHeightCur = posY;
      // 蹬壁跳反作用力：达到最高高度（velY<=0，抛物线顶点）时解除约束
      if (isWallClimbJumping && velY <= 0) {
        isWallClimbJumping = false;
        wallClimbJumpDir = 0;
        wallClimbJumpWalkForced = false;
        wallClimbJumpInitDirLocked = false;
      }
    }

    // 非跳跃状态：支撑检测
    if (!isJumping) {
      const support = findSupportUnderneath();
      if (!support) {
        // 脚下为空 → 自由下落
        startCrouchFlag = !!isCrouching; // 记录掉落开始时是否处于下蹲
        airCrouchRequest = sLocked || !!keys['KeyS']; // 若S仍按住则记录请求，落地回蹲
        isCrouching  = false;            // 空中不再为下蹲状态
        isJumping     = true;
        isFalling     = true;
        fallRecorded  = false;
        velY          = 0;
        startPosY     = posY;
        maxHeightCur  = posY;
        moveDistPx    = 0;
        jumpCount     = 0;
        airTimeAccum  = 0;
        segElapsedList = [];
        sprintCount   = 0;
        airSprintSegUsed = 0;
        frameIdx = 0; frameTimer = 0;
        curState = JUMP;
        setCharClass(STATE_CSS[JUMP]);
      }
    }

    // 跳跃/下落物理
    if (isJumping) {
      // ===== 可攀登平台：贴墙慢降 =====
      // 进入条件：下落中(velY<=0) + 贴可攀登墙 + 朝墙方向按住移动键
      // 退出条件：松开朝墙方向 / 离开墙面（ climbed past bottom or moved away）
      // 退出时 velY=0（恢复正常坠落，初始移速0）；攀登中 velY 恒为 -CROUCH_SPD（=蹲下移动速度）
      const climbContact   = detectClimbableWallContact();
      lastClimbContact     = climbContact;  // 保存本帧攀登检测结果，供 doJump 兜底使用
      const pressingToward = (climbContact === -1 && !!keys['KeyA']) || (climbContact === +1 && !!keys['KeyD']);
      if (!isClimbing && velY <= 0 && climbContact !== 0 && pressingToward) {
        isClimbing = true;
        // 进入攀登：把"到达墙面前的这一段跳跃"立即记入日志
        const segTotal = segElapsedList.reduce((s,v)=>s+v, 0) + airTimeAccum;
        const climbH   = Math.max(0, maxHeightCur - startPosY) / GRID;
        if (segTotal > 0 && (jumpCount > 0 || isFalling)) {
          jumpRecords.push({
            time:     +segTotal.toFixed(4),
            height:   +climbH.toFixed(2),
            distance: +(moveDistPx / GRID).toFixed(2),
            jumps:    isFalling ? 0 : jumpCount,
            sprints:  sprintCount,
            startCrouch: startCrouchFlag
          });
          renderRecordTable();
        }
        // 只重置滞空时间为 0（下次跳跃段重新累加；高度/距离/次数继续累计）
        airTimeAccum = 0;
        segElapsedList = [];
        // 攀登对跳跃/冲刺次数的影响（二选一，互斥）：
        // ① 蹬壁补次数：耗尽时各补 1 次；② 攀登重置：直接重置为满
        if (wallClimbGrantEnabled) {
          const maxSegC = +jumpSegIn.value || 999;
          if (jumpsUsed >= maxSegC) jumpsUsed = Math.max(0, maxSegC - 1);
          if (airSprintSegMax > 0 && airSprintSegUsed >= airSprintSegMax)
            airSprintSegUsed = airSprintSegMax - 1;
        } else if (wallClimbResetEnabled) {
          jumpsUsed = 0;
          airSprintSegUsed = 0;
        }
      }
      if (isClimbing && (!pressingToward || climbContact === 0 || velY > 0)) {
        isClimbing = false;
        velY = 0;  // 退出攀登：恢复正常坠落，初始移速为 0
      }

      // 使用Verlet积分（半步法）以获得更精确的跳跃高度
      prevPosY = posY;  // 记录移动前脚底位置（供可穿越平台穿越判定）
      if (isClimbing) {
        // 攀登：恒定慢速下落（=蹲下移动速度 CROUCH_SPD，px/s），不应用重力加速
        velY = -CROUCH_SPD;
        posY += velY * dt;
      } else {
        const newVelY = velY - GRAVITY * dt;
        posY += (velY + newVelY) / 2 * dt;  // 使用平均速度更新位置
        velY = newVelY;
      }

      const hit = checkPlatformCollision();
      const totalAirTime = segElapsedList.reduce((s,v)=>s+v, 0) + airTimeAccum;

      if (jumpGraceTimer > 0) {
        jumpGraceTimer -= dt;
      } else {

      if (hit === 'top') {
        // 落地（地面或平台）
        const jumpHeight = Math.max(0, maxHeightCur - startPosY) / GRID;
        if (totalAirTime > 0 && (jumpsUsed > 0 || (isFalling && !fallRecorded))) {
          jumpRecords.push({
            time:     +totalAirTime.toFixed(4),
            height:   +jumpHeight.toFixed(2),
            distance: +(moveDistPx / GRID).toFixed(2),
            jumps:    isFalling ? 0 : jumpCount,
            sprints:  sprintCount,
            startCrouch: startCrouchFlag
          });
          fallRecorded = true;
          renderRecordTable();
        }
        // 落地：若有空中下蹲请求或 S 仍实按 → 进入下蹲
        // 传入落地瞬间的站立基础态（冲刺档+Shift+方向=SPRINT等）作为 baseHint
        const wantCrouch = airCrouchRequest || sLocked || !!keys['KeyS'];
        velY = 0; isJumping = false; isFalling = false; fallRecorded = false; jumpsUsed = 0; jumpCount = 0;
        moveDistPx = 0; maxHeightCur = 0; startPosY = 0;
        airTimeAccum = 0; segElapsedList = [];
        airCrouchRequest = false;
        airSprintSegUsed = 0;
        sprintCount = 0;
        // 跳跃锁定重置
        prevJumpLockActive = false;
        lockedAirDir = 0;
        lockedAirSpd = 0;
        // 蹬壁跳反作用力重置
        isWallClimbJumping = false;
        wallClimbJumpDir = 0;
        wallClimbJumpWalkForced = false;
        wallClimbJumpInitDirLocked = false;
        wallClimbJumpAirborne = false;  // 落地：不再处于蹬壁跳跳跃中
        if (wantCrouch) {
          const base = currentStandBase(moving, shift);
          tryToggleCrouch(true, base);
        }
        updateStatus();
      } else if (hit === 'bottom') {
        updateStatus();
      }

      }

      // 上限：世界顶部
      const curColH = getColH();
      if (posY > mapTotalH - curColH) {
        posY = mapTotalH - curColH;
        if (velY > 0) velY = 0;
        updateStatus();
      }
    }
  } else {
    // 冲刺锁定期：高度绝对锁定不变，velY 保持 0
    velY = 0;
  }

  // 写入 DOM（注意：地面平台 y=0，角色 bottom = posY）
  const loopColH = getColH();
  charWrap.style.left   = (charX - colW / 2) + 'px';
  charWrap.style.bottom = posY + 'px';
  charWrap.style.height = loopColH + 'px';
  applyRenderScaleAndOffset();
  charWrap.style.transform = facing < 0 ? 'scaleX(-1)' : 'scaleX(1)';

  // 更新重置点指示器位置（与站立碰撞框大小一致）
  // 碰撞推挤：如果重置点与平台重叠，则推挤到最近的合法位置
  fixResetPointCollision();
  resetMarker.style.left   = (resetPointX - colW / 2) + 'px';
  resetMarker.style.bottom = resetPointY + 'px';
  resetMarker.style.width  = colW + 'px';
  resetMarker.style.height = colHNormal + 'px';
  resetMarker.style.display = 'block';

  /* ---------- targetState 选择 ----------
   * 优先级：
   *   冲刺锁定期最高（必须保持冲刺/冲刺蹲）
   *   JUMP 次高（非锁定期空中保持 JUMP）
   *   着地时 isCrouching=true：
   *     - baseModeBeforeCrouch=SPRINT → CROUCH_SPRINT
   *     - 否则 → CROUCH（普通蹲，不允许中途升级为冲刺蹲）
   *   着地非下蹲：IDLE/WALK/RUN/SPRINT 按条件
   */
  let targetState;
  if (sprintLockTimer > 0) {
    // 锁定期间：只要下蹲就是冲刺蹲；否则冲刺态（即便松开 Shift 也不会降级，直到锁定期结束）
    targetState = isCrouching ? CROUCH_SPRINT : SPRINT;
  } else if (isJumping) {
    targetState = JUMP;
  } else if (isCrouching) {
    // 下蹲：仅当 baseModeBeforeCrouch=SPRINT 且本次 Shift 冲刺未上限时才显示冲刺蹲
    if (baseModeBeforeCrouch === SPRINT && !sprintExpiredThisShift) targetState = CROUCH_SPRINT;
    else                                                            targetState = CROUCH;
  } else {
    // 站立：sprintExpiredThisShift=true 时强制 WALK（即使 Shift 按着也不进 SPRINT/RUN）
    // 奔跑模式体力耗尽（staminaDepleted）时强制 WALK，不进 RUN
    // 冲刺模式剩余体力不够一次冲刺时强制 WALK，不进 SPRINT（与速度选择阈值一致）
    const sprintStaminaOK = !staminaEnabled || !sprintMode || stamina >= 1 / Math.max(1, staminaSprintMax);
    if      (runExitDecel)                                  targetState = RUN;   // 减速未到走动速度前保持奔跑态
    else if (!moving)                                       targetState = IDLE;
    else if (sprintMode && shift && !sprintExpiredThisShift && sprintStaminaOK) targetState = SPRINT;
    // 冲刺模式体力不足时（sprintStaminaOK=false）也不进 RUN，维持走动
    else if (shift && !sprintExpiredThisShift && sprintStaminaOK && !(staminaEnabled && staminaDepleted)) targetState = RUN;
    else                                                targetState = WALK;
  }

  if (targetState !== curState) {
    const wasSprint = (curState === SPRINT || curState === CROUCH_SPRINT);
    const isSprint  = (targetState === SPRINT || targetState === CROUCH_SPRINT);
    curState = targetState;
    if (isSprint && !wasSprint) playSnd(sndSprint);   // 进入冲刺（含蹲下冲刺）播放一次
    frameIdx = 0; frameTimer = 0;
    setCharClass(STATE_CSS[curState]);
  }
  updateFootstepSound(dt);           // 脚步音效（走动）
  updateLoopSounds(moving);          // 循环音效（奔跑/蹲下走动）

  const interval = 1 / Math.max(1, fps);
  frameTimer += dt;
  const list = getFrameList();
  if (list.length) {
    if (curState === JUMP) {
      while (frameTimer >= interval && frameIdx < list.length - 1) {
        frameTimer -= interval;
        frameIdx++;
      }
    } else if ((curState === CROUCH || curState === CROUCH_SPRINT) && !moving) {
      // 蹲下不移动时（含冲刺锁定中松开方向键）：只播第一帧，不循环
      frameIdx = 0;
      frameTimer = 0;
    } else {
      while (frameTimer >= interval) {
        frameTimer -= interval; frameIdx = (frameIdx + 1) % list.length;
      }
    }
  }

  updateStatus();
  renderFrame();
  // 更新体力条显示
  if (staminaEnabled && staminaRing) {
    staminaRing.style.display = '';
    updateStaminaRing();
  } else if (staminaRing) {
    staminaRing.style.display = 'none';
  }
  // 摄像机锁定到角色时跟随
  followCharacter();
  requestAnimationFrame(loop);
}

fpsInput.addEventListener('input', function() { fps = Math.max(1, +fpsInput.value || 10); });
fps = +fpsInput.value || 10;

/* ==================== 初始化 ==================== */
applyBackground();
applyWorldColor();
applyGridColor();

// 初始化表头颜色
thAir.style.color = stateColors.jump;
thHeight.style.color = stateColors.walk;
thDist.style.color = stateColors.walk;
thJumps.style.color = stateColors.jump;
thSprints.style.color = stateColors.sprint;

// 初始化地面平台
platforms.push(createGroundPlatform());
applyMapSize();
renderPlatforms();

// 初始化碰撞框显示
outlineSw.classList.add('on');
charWrap.classList.add('outline');
updateOutlineColor();

// 初始化"正在编辑的配置"状态：
// - 把当前"默认配置"作为首次的内存保存点（savedConfigSnapshot）
// - dirty=false（还没改动过），所以不会显示"未保存/有改动"
savedConfigSnapshot = getFullConfig();
updateConfigStatus();

// 页面加载完成后：
// 1) 默认进入绘制模式（自动点击绘制平台按钮）
// 2) 配置默认视为"已新建未保存"，当前编辑名 = 未命名配置
window.addEventListener('load', function() {
  if (platDrawBtn && !drawMode) {
    try { platDrawBtn.click(); } catch(e) {}
  }
  // 初始化后再刷新一次状态（进入绘制模式可能改变了显示）
  updateConfigStatus();
});

requestAnimationFrame(function(ts) { lastTs = ts; loop(ts); });
</script>
