<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>人物动画 & 跳跃系统（地面=平台）</title>
<style>
  :root {
    --font-main: 'Segoe UI','PingFang SC','SimHei','黑体','Microsoft YaHei','微软雅黑',sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family: var(--font-main); }
  html, body, button, input, select, textarea { font-family: var(--font-main); }
  body {
    background:#1e1e2e; color:#eee;
    height:100vh; overflow:hidden;
    user-select:none;
  }

  #stage {
    position:absolute; top:0;
    left:340px; right:340px; bottom:0;
    background:var(--bg-color, linear-gradient(180deg, #2a2a40 0%, #15151e 100%));
    overflow:hidden; outline:none;
    transition: left 0.3s ease;
  }
  body.sidebar-collapsed #stage { left:0; }
  #stage.dragging { cursor:grabbing; }
  #stage.dragging #charWrap { cursor:grabbing; }
  #stage.dragging .platform { cursor:grabbing; }
  #stage.drawing { cursor:crosshair; }
  #stage.drawing #charWrap { cursor:grab; pointer-events:auto; }
  #stage.drawing #charWrap:active { cursor:grabbing; }
  #stage.dragging.drawing { cursor:grabbing; }
  #stage.dragging.drawing #charWrap { cursor:grabbing; }
  #stage.dragging.drawing .platform { cursor:grabbing; }
  #charWrap { cursor:grab; }
  #charWrap:active { cursor:grabbing; }
  #stage.drawing .platform.normal:hover { cursor:grab; }
  #stage.drawing .platform.normal:active { cursor:grabbing; }
  /* 摄像机锁定时：人物和平台不显示抓手（用更高优先级覆盖上方规则）*/
  #stage.camLocked #charWrap,
  #stage.camLocked #charWrap:active,
  #stage.camLocked.drawing #charWrap,
  #stage.camLocked.drawing #charWrap:active,
  #stage.camLocked.drawing .platform.normal:hover,
  #stage.camLocked.drawing .platform.normal:active { cursor:default; }
  body.sidebar-collapsed #displayPanel { transform:translateX(-100%); }

  #map {
    position:absolute;
    width:2000px; height:1000px;
    transform-origin:0 0;
    will-change:transform;
    background:#e4e4e4;
    transition: transform 0.3s ease, left 0.3s ease, top 0.3s ease;
    z-index:1;
  }
  /* 渐变背景叠加层：通过 opacity 过渡实现颜色动画（避免 @property 兼容问题） */
  .map-bg-layer {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.2s ease;
    z-index:0;
  }
  #mapBgDanger  { background:linear-gradient(180deg, #851d41 0%, #d82e2e 100%); }
  #mapBgConfirm { background:linear-gradient(180deg, #851d41 0%, #fed436 100%); }
  #mapBgDraw    { background-color:#2263ad; }

  /* Shift框选框样式：描边颜色与platform hover一致（#ffb86c） */
  #shiftSelectBox {
    position:absolute;
    border:2px solid #ffb86c;
    background:rgba(255, 184, 108, 0.12);
    pointer-events:none;
    z-index:9998;
    display:none;
  }

  /* 舞台背景叠加层：与 map 背景同步变化，但整体亮度更暗（约40%亮度） */
  .stage-bg-layer {
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.2s ease;
    z-index:0;
  }
  #stageBgDraw    { background:linear-gradient(180deg, #0f3559 0%, #0a2540 100%); }
  #stageBgDanger  { background:linear-gradient(180deg, #3a0c1c 0%, #5c1212 100%); }
  #stageBgConfirm { background:linear-gradient(180deg, #3a0c1c 0%, #66530c 100%); }
  #mapGrid {
    position:absolute; top:0; left:0; right:0; bottom:100px;
    pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(180,180,180,0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(180,180,180,0.4) 1px, transparent 1px);
    background-size:100px 100px;
    z-index:1;
  }
  #drawGrid {
    position:absolute; top:0; left:0; right:0; bottom:100px;
    pointer-events:none;
    display:none;
    z-index:2;
  }

  /* ===== 调整大小手柄 ===== */
  .resize-handle {
    position:absolute;
    background:#42ffff;
    border:2px solid #ffffff;
    border-radius:4px;
    z-index:9999;
    pointer-events:auto;
    display:none;
    box-shadow:0 0 6px rgba(0,0,0,0.8);
  }
  .resize-handle.n, .resize-handle.s { width:20px; height:12px; }
  .resize-handle.e, .resize-handle.w { width:12px; height:20px; }
  .resize-handle.n { cursor:n-resize; }
  .resize-handle.s { cursor:s-resize; }
  .resize-handle.e { cursor:e-resize; }
  .resize-handle.w { cursor:w-resize; }

  .plat-size-tag {
    position:absolute;
    color:#42ffff;
    font-weight:bold;
    pointer-events:none;
    z-index:9999;
    display:none;
    white-space:nowrap;
    text-align:center;
    font-family: var(--font-main);
  }

  .platform {
    position:absolute;
    border-radius:3px;
    z-index:3;
  }
  .platform.ground {
    background:repeating-linear-gradient(90deg, #4a4a4a 0 100px, #666666 100px 200px);
    border:3px solid #000;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55);
    cursor:default;
  }
  .platform.normal {
    background:rgba(120,120,120,0.85);
    border:3px solid #000;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55);
  }
  /* 可穿越平台：仅顶部一条线碰撞，外观浅灰 + 白色实线描边 + 顶部高亮线 */
  .platform.normal.passable {
    background:rgba(200,200,200,0.5);
    border:3px solid #fff;
    box-shadow: 0 6px 12px rgba(0,0,0,0.35), inset 0 2px 0 0 rgba(80,80,80,0.9);
  }
  /* 可攀登平台：外观与普通平台一致，仅背景为深灰色（跳跃中贴墙可慢速下滑） */
  .platform.normal.climbable {
    background:rgba(55,55,55,0.92);
  }
  .platform.normal:hover { border-color:#ffb86c; }
  /* 鼠标按下拖拽/绘制/框选期间：暂停平台 hover 高亮（仅 :hover 触发的橙色）
     .selected/.editing/.drag-delete 用各自类规则显示描边，不受影响 */
  #stage.drag-active .platform.normal:not(.selected):not(.editing):not(.drag-delete):hover {
    border-color: #000;
  }
  #stage.drag-active .platform.normal.passable:not(.selected):not(.editing):not(.drag-delete):hover {
    border-color: #fff;
  }
  .platform.normal.selected {
    border-color:#ffb86c;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55), 0 0 0 1px #ffb86c inset;
  }
  .platform.normal.selected:hover { border-color:#ffb86c; }
  .platform.normal.editing,
  .platform.normal.editing:hover {
    border-color:#42ffff;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55);
  }
  .platform.normal.drag-delete {
    border-color:#FF0000 !important;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55), 0 0 8px rgba(255,0,0,0.8) inset !important;
  }
  .platform.normal.drag-delete::after {
    content:'松开左键删除';
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    color:#FF0000;
    font-weight:bold;
    font-size:var(--del-fs, 14px);
    text-shadow:0 0 3px #fff, 0 0 6px #fff, 0 0 2px #000;
    white-space:nowrap;
    pointer-events:none;
    font-family: var(--font-main);
    z-index:2;
  }
  /* 返回原位的移动动画（0.5s ease） */
  .platform.normal.returning {
    transition: left 0.5s cubic-bezier(.2,.8,.2,1),
                bottom 0.5s cubic-bezier(.2,.8,.2,1),
                transform 0.5s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
  }
  /* 坠落动画：轻微弹跳后倾斜飞出舞台底部之外，过程中颜色渐变为#ae7a58 */
  .platform.normal.falling {
    pointer-events:none;
    animation: platFall 0.5s cubic-bezier(.4,.1,.6,.9) forwards;
  }
  @keyframes platFall {
    0%   { transform: translate(0,0) rotate(0deg);   opacity:1; background-color:rgba(174,122,88,0.85); border-color:#ae7a58; box-shadow:none; }
    15%  { transform: translate(0, -8px) rotate(-3deg); opacity:1; background-color:#ae7a58; border-color:#ae7a58; }
    25%  { transform: translate(0, -18px) rotate(-6deg); opacity:1; background-color:#ae7a58; border-color:#ae7a58; }
    50%  { transform: translate(0, -8px) rotate(3deg);  opacity:0.85; background-color:#ae7a58; border-color:#ae7a58; }
    100% { transform: translate(10px, 130vh) rotate(25deg); opacity:0; background-color:#ae7a58; border-color:#ae7a58; }
  }

  /* ============ 火星粒子：从舞台底部飘起、S形左右晃动上升、同步缩小变透明 ============ */
  .spark {
    position:absolute;
    left:0; bottom:0;
    width: var(--sp-size, 10px);
    height: var(--sp-size, 10px);
    border-radius:50%;
    background:#fff800;
    pointer-events:none;
    z-index:200;
    box-shadow:0 0 8px rgba(255,248,0,0.85), 0 0 16px rgba(255,220,0,0.55);
    opacity:0;
    transform-origin:center center;
    animation: sparkRise var(--sp-dur, 1.6s) linear var(--sp-delay, 0s) forwards;
  }
  @keyframes sparkRise {
    /* S形轨迹：中心 → 第一侧峰值 → 反折到中心(反曲点) → 第二侧峰值(反向) → 淡出
       缩放与透明度严格同步：0%→100%→75%→50%→25%→0% */
    0%   { transform: translate(var(--sp-x, 0px), 0) scale(1);                                opacity:1;   }
    20%  { transform: translate(calc(var(--sp-x, 0px) + var(--sp-s1, 30px) * 0.55), -18vh) scale(0.8);  opacity:0.8; }
    40%  { transform: translate(calc(var(--sp-x, 0px) + var(--sp-s1, 30px) * 1.0),  -36vh) scale(0.6);  opacity:0.6; }
    60%  { transform: translate(calc(var(--sp-x, 0px) + var(--sp-s2,-30px) * 0.6),  -55vh) scale(0.4);  opacity:0.4; }
    80%  { transform: translate(calc(var(--sp-x, 0px) + var(--sp-s2,-30px) * 1.0),  -75vh) scale(0.2);  opacity:0.2; }
    100% { transform: translate(calc(var(--sp-x, 0px) + var(--sp-s2,-30px) * 0.4),  -100vh) scale(0);    opacity:0;   }
  }

  #charWrap {
    position:absolute; bottom:100px;
    width:200px; height:200px;
    transform-origin:center bottom;
    will-change:transform, left, bottom;
    z-index:5;
    cursor:grab;
  }
  #charSprite {
    position:absolute;
    width:200px; height:200px;
    background-size:contain; background-repeat:no-repeat; background-position:center bottom;
    image-rendering:pixelated;
    pointer-events:none;
    z-index:1;
  }
  #charWrap.outline::after {
    content:'';
    position:absolute;
    top:-3px; left:-3px; right:-3px; bottom:-3px;
    border:3px solid var(--outline-color, #ff79c6);
    pointer-events:none;
    z-index:10;
  }

  /* 重置点指示器 - 与站立碰撞框大小一致，内部透明，外部红色描边 */
  #resetMarker {
    position:absolute;
    pointer-events:none;
    z-index:4;
    display:none;
    border:2px solid #ff5555;
    background:transparent;
    box-shadow:0 0 8px rgba(255,85,85,0.5), inset 0 0 8px rgba(255,85,85,0.2);
    animation: resetPulse 1.5s ease-in-out infinite;
  }
  @keyframes resetPulse {
    0%, 100% { box-shadow:0 0 8px rgba(255,85,85,0.5), inset 0 0 8px rgba(255,85,85,0.2); }
    50%      { box-shadow:0 0 16px rgba(255,85,85,0.8), inset 0 0 12px rgba(255,85,85,0.3); }
  }

  .zoomBtns {
    position:absolute; bottom:14px; right:14px;
    display:flex; gap:6px; z-index:60;
  }
  .zoomBtns button {
    min-width:40px; height:32px; padding:0 8px; border-radius:6px;
    border:1px solid #555; background:#44475a; color:#eee;
    font-size:13px; cursor:pointer; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    white-space:nowrap;
  }
  .zoomBtns button#zoomReset { min-width:52px; font-size:13px; }
  .zoomBtns button:hover { background:#6272a4; color:#fff; }
  .zoomBtns button:active { background:#3b3b5a; }
  .zoomLabel { display:none !important; }
  .biliLink {
    position:absolute; bottom:55px; right:14px; z-index:60;
    color:rgba(0,0,0,0.6); font-weight:bold; font-size:22px;
    text-decoration:none; cursor:pointer;
    background:none; border:none; outline:none;
    line-height:1; user-select:none;
    font-family:"Segoe UI","PingFang SC",sans-serif;
  }
  .biliLink:hover { color:rgba(0,0,0,0.85); }

  #displayPanel {
    position:fixed; top:0; left:0; bottom:0;
    width:340px; background:#252537; padding:16px;
    border-right:1px solid #333;
    overflow-y:scroll; overflow-x:hidden;
    scrollbar-width: none;
    z-index:10;
    transform:translateX(0);
    transition: transform 0.3s ease;
    box-shadow:2px 0 8px rgba(0,0,0,0.3);
  }
  #displayPanel::-webkit-scrollbar { display:none; }
  #sidebarToggle {
    position:fixed; top:50%;
    left:340px; transform:translateY(-50%);
    width:36px; height:80px;
    background:#44475a; border:1px solid #555; border-left:none;
    border-radius:0 6px 6px 0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:#ccc; font-size:12px; z-index:100;
    transition: left 0.3s ease, background 0.2s;
  }
  #sidebarToggle:hover { background:#6272a4; color:#fff; }
  body.sidebar-collapsed #sidebarToggle { left:0; }

  #panel {
    position:absolute; top:0; right:0; bottom:0;
    width:340px; background:#252537; padding:18px;
    border-left:1px solid #333; overflow-y:scroll; z-index:9;
    scrollbar-width: none;
  }
  #panel::-webkit-scrollbar { display:none; }
  #panel h3 { color:#8be9fd; margin:0 0 10px 0; font-size:15px; display:flex; align-items:center; gap:6px; }
  #displayPanel h3 { color:#8be9fd; margin:0 0 10px 0; font-size:14px; display:flex; align-items:center; gap:6px; }
  #displayPanel h4 { font-size:12px; margin:12px 0 6px; border-bottom:1px solid #333; padding-bottom:4px; }
  .row { margin-bottom:12px; }
  .row label { display:block; margin-bottom:4px; font-size:12.5px; color:#bbb; }
  .row input[type=number] {
    width:100%; padding:7px 8px; border-radius:5px;
    border:1px solid #444; background:#1a1a28; color:#eee; font-size:14px; outline:none;
  }
  .row input[type=number]:focus { border-color:#6272a4; }
  .row input[type=file] { width:100%; font-size:12px; color:#ccc; }

  /* 右侧面板：label + number输入框 改为水平同列，输入框贴右侧 */
  #panel .row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  #panel .row label { display:inline; flex:1; margin:0; font-size:12.5px; color:#bbb; }
  #panel .row input[type=number] {
    width:80px; flex-shrink:0; text-align:left;
    padding:7px 8px; border-radius:5px;
    border:1px solid #444; background:#1a1a28; color:#eee; font-size:14px; outline:none;
  }
  #panel .row input[type=number]:focus { border-color:#6272a4; }

  .toggle-row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .toggle-row label { margin:0; font-size:13px; color:#bbb; cursor:pointer; }
  .toggle-row input[type=color] { width:40px; height:28px; border:none; border-radius:4px; background:transparent; cursor:pointer; padding:0; }

  .switch {
    position:relative; width:42px; height:22px;
    background:#444; border-radius:11px; cursor:pointer; transition:background 0.2s; flex-shrink:0;
  }
  .switch::after {
    content:''; position:absolute; top:2px; left:2px;
    width:18px; height:18px; border-radius:50%; background:#fff; transition:transform 0.2s;
  }
  .switch.on { background:#50fa7b; }
  .switch.on::after { transform:translateX(20px); }

  .info {
    background:#1a1a28; padding:10px; border-radius:6px;
    font-family: var(--font-main); font-size:11px;
    color:#a6e3a1; white-space:pre; line-height:1.7;
    margin-bottom:12px; border:1px solid #333;
    overflow-x:auto;
  }
  .status {
    margin-bottom:10px; padding:10px; background:#1a1a28;
    border-radius:6px; font-size:13px; font-family: var(--font-main);
    border:1px solid #333; line-height:2;
  }
  kbd { background:#444; padding:2px 7px; border-radius:3px; font-size:12px; color:#fff; border:1px solid #555; }

  .folder-info { font-size:11.5px; color:#777; margin-top:5px; line-height:1.6; }
  .folder-info b { color:#8be9fd; }

  .seg-dot {
    width:12px; height:12px; border-radius:50%;
    background:transparent; border:2px solid #555;
    display:inline-block; margin:0 2px;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .seg-dot.used { background:#ffb86c; border-color:#ffb86c; box-shadow:0 0 6px #ffb86c; }

  .sprint-light {
    display:inline-block; width:10px; height:10px; border-radius:50%;
    background:#ffeb35; box-shadow:0 0 8px #ffeb35;
    animation: sprintBlink 0.5s infinite alternate;
    margin-left:4px; vertical-align:middle;
  }
  @keyframes sprintBlink {
    from { opacity:0.4; }
    to { opacity:1; }
  }

  /* .p-* 仅作状态标记（className），占位背景色由 setCharClass 动态写入 charWrap（碰撞框区域），取状态色加深 */
  .p-idle,.p-walk,.p-run,.p-jump,.p-crouch,.p-sprint,.p-crouch-sprint {}

  #recordBody td { padding:5px 4px; text-align:center; border-top:1px solid #2a2a3e; }
  #recordBody tr:nth-child(even) { background:#1e1e30; }
  #recordBody tr:hover { background:#2a2a45; }

  #recordScrollBox { max-height:308px; overflow-y:auto; overflow-x:hidden; }
  #recordScrollBox::-webkit-scrollbar { width:6px; }
  #recordScrollBox::-webkit-scrollbar-track { background:#1a1a28; }
  #recordScrollBox::-webkit-scrollbar-thumb { background:#555; border-radius:3px; }
  #recordScrollBox::-webkit-scrollbar-thumb:hover { background:#777; }
  #clearRecordBtn:hover { background:#6272a4 !important; }
  #clearRecordBtn:active { background:#3b3b5a !important; }

  .plat-row { display:flex; gap:4px; margin-bottom:6px; align-items:center; }
  .plat-row input { width:60px; padding:4px; border-radius:3px; border:1px solid #444; background:#1a1a28; color:#eee; font-size:12px; }
  .plat-row label { font-size:11px; color:#999; margin:0; white-space:nowrap; }
  .plat-row button { padding:4px 8px; border-radius:3px; border:1px solid #555; background:#44475a; color:#eee; font-size:11px; cursor:pointer; }
  .plat-row button:hover { background:#6272a4; }
  /* 绘制模式专用按钮 */
  .plat-btn { border-radius:4px; border:1px solid #555; color:#fff; font-size:12px; cursor:pointer; transition:background 0.15s ease, opacity 0.2s ease; }
  .plat-btn-draw   { background:#2263ad; border-color:#1a4a85; color:#fff; }
  .plat-btn-draw:hover:not(:disabled)   { background:#2a79d0; }
  .plat-btn-undo   { background:#2263ad; border-color:#1a4a85; color:#fff; }
  .plat-btn-undo:hover:not(:disabled)   { background:#2a79d0; }
  .plat-btn-redo   { background:#2263ad; border-color:#1a4a85; color:#fff; }
  .plat-btn-redo:hover:not(:disabled)   { background:#2a79d0; }
  .plat-btn-delall { background:#ff5555; border-color:#c63a3a; color:#fff; }
  .plat-btn-delall:hover:not(:disabled) { background:#ff6f6f; }
  .plat-btn:disabled { opacity:0.45; cursor:not-allowed; }
  .plat-list { font-size:11px; color:#888; max-height:360px; overflow-y:auto; margin-top:6px; }
  .plat-list .plat-item {
    display:flex; align-items:center; gap:4px;
    padding:4px 0; border-bottom:1px solid #2a2a3e;
  }
  /* 宽/高输入框容器均分删除按钮后剩余的宽度 */
  .plat-list .plat-item .dim-wrap {
    flex:1 1 0; min-width:0;
    display:inline-flex; align-items:center;
  }
  .plat-list .plat-item input[type=number] {
    width:100%; min-width:0; padding:2px 4px; border-radius:3px;
    border:1px solid #444; background:#1a1a28; color:#eee; font-size:11px;
  }
  .plat-list .plat-item input[type=number]:focus { border-color:#6272a4; outline:none; }
  .plat-list .plat-item .dim-label { font-size:10px; color:#8be9fd; margin-right:2px; flex:0 0 auto; }
  .plat-list .plat-item button {
    flex:0 0 auto; padding:2px 8px; font-size:11px; cursor:pointer;
    border-radius:3px; border:1px solid #555; background:#44475a; color:#eee;
  }
  .plat-list .plat-item button:hover:not(:disabled) { background:#6272a4; }
  .plat-list .plat-item input:disabled,
  .plat-list .plat-item button:disabled {
    opacity:0.45; cursor:not-allowed;
  }
  /* 悬浮提示：列表行悬浮时对应平台描边变青 */
  .platform.normal.highlight {
    border-color:#42ffff;
    box-shadow: 0 6px 12px rgba(0,0,0,0.55), 0 0 6px rgba(66,255,255,0.4);
  }
  /* 选中平台的 XY 坐标标签（颜色 #ffb86c，居中）
     显示完全由 CSS 控制：需同时满足 .coord-fits（尺寸够，由 refreshSelCoordFit 测量后切换）
     + .selected（选中）且非 .editing。避免 showPlatTag 的 inline display 与 CSS 冲突。 */
  .platform .sel-coord-tag {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    color:#ffb86c; font-weight:bold;
    pointer-events:none; white-space:nowrap; text-align:center;
    font-family: var(--font-main);
    z-index:5; display:none;
  }
  .platform.coord-fits.selected .sel-coord-tag { display:block; }
  .platform.coord-fits.editing .sel-coord-tag { display:none; }

  #hintTip {
    position:absolute; top:12px;
    left:50%;
    transform:translateX(-50%);
    max-width:min(90%, 820px);
    padding:8px 48px;          /* 左右留出 48px 给翻页按钮 */
    background:rgba(0,0,0,0.65); color:#ddd; font-size:13px;
    border-radius:6px; pointer-events:auto;
    opacity:0; transition:opacity 0.3s ease;
    z-index:50; line-height:1.6;
    text-align:center;
  }
  #hintTip.visible { opacity:1; }
  #hintTip kbd { background:#666; font-size:11px; padding:1px 5px; }
  #hintTip .hint-line { display:block; }
  #hintTip .hint-line + .hint-line { margin-top:2px; }

  /* 翻页按钮（提示框内部左右两侧） */
  .hint-nav-btn {
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08); color:#ddd;
    font-size:13px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    transition:background 0.2s ease, opacity 0.2s ease, color 0.2s ease;
    font-family: var(--font-main);
    user-select:none;
  }
  .hint-nav-btn:hover:not(:disabled) {
    background:rgba(139,233,253,0.25); color:#8be9fd; border-color:rgba(139,233,253,0.5);
  }
  .hint-nav-btn:disabled {
    opacity:0.3; cursor:not-allowed;
    background:rgba(255,255,255,0.04);
  }
  .hint-nav-btn.prev { left:10px; }
  .hint-nav-btn.next { right:10px; }

  /* 页码指示器（小点） */
  .hint-pager {
    margin-top:4px; font-size:10px;
    color:rgba(221,221,221,0.55);
    letter-spacing:1px;
  }

  /* 鼠标按键图标（内联 SVG 风格占位 + 文字色块） */
  .hint-icon-mb {
    display:inline-flex; align-items:center; gap:2px;
    padding:0 5px; height:16px; min-width:16px;
    border:1px solid rgba(255,255,255,0.45);
    border-radius:3px;
    font-size:10px; font-weight:bold; color:#fff;
    background:rgba(102,102,102,0.85);
    vertical-align:baseline;
    line-height:1;
    font-family: var(--font-main);
  }
  .hint-icon-mb.lmb { background:rgba(107,224,253,0.75); border-color:rgba(107,224,253,0.9); color:#001; }
  .hint-icon-mb.rmb { background:rgba(255,128,43,0.8); border-color:rgba(255,128,43,1); color:#fff; }
  .hint-icon-mb .lbl { display:inline-block; font-size:9px; opacity:0.9; }

  /* 组合操作气泡提示：从舞台底部向上弹出，悬停一段时间后向下消失 */
  #groupBubble {
    position:absolute;
    left:50%;
    bottom:-80px;                       /* 初始隐藏在舞台底部外（下方） */
    transform:translateX(-50%);
    padding:10px 22px;
    background:rgba(189, 147, 249, 0.92); /* 紫色系，与下蹲状态配色呼应 */
    color:#282a36;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.5px;
    border-radius:20px;
    pointer-events:none;
    opacity:0;
    transition:
      bottom 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2),
      opacity 0.25s ease;
    z-index:55;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
    white-space:nowrap;
  }
  /* 上方小三角（指向舞台下方） */
  #groupBubble::after {
    content:'';
    position:absolute;
    left:50%;
    bottom:-6px;
    transform:translateX(-50%) rotate(45deg);
    width:12px; height:12px;
    background:rgba(189, 147, 249, 0.92);
    border-radius:2px;
  }
  #groupBubble.show {
    bottom:28px !important;
    opacity:1 !important;
  }
  /* ---------- 自定义覆盖式滚动条（悬浮在舞台区域，不挤占侧栏内部空间） ---------- */
  .custom-scrollbar {
    position:fixed; top:0;
    width:8px; height:100%;
    z-index:100;
    pointer-events:none;
    opacity:0;
    transition: opacity 0.3s ease;
  }
  .custom-scrollbar.show {
    pointer-events:auto;
    opacity:1;
  }
  .custom-scrollbar.track {
    background: transparent;
  }
  .custom-scrollbar .sb-thumb {
    position:absolute; left:0; right:0;
    background: rgba(200,200,200,0.45);
    border-radius:4px;
    cursor:pointer;
    min-height:40px;
    transition: background 0.2s ease;
  }
  .custom-scrollbar .sb-thumb:hover,
  .custom-scrollbar .sb-thumb.dragging {
    background: rgba(220,220,220,0.7);
  }
  #customScrollbarLeft {
    /* 左栏滚动条：在左栏右边外边缘（舞台上） */
    left:340px;
  }
  body.sidebar-collapsed #customScrollbarLeft {
    left:0px;
    display:none;
  }
  #customScrollbarRight {
    /* 右栏滚动条：在右栏左边外边缘（舞台上） */
    left: calc(100% - 340px - 8px);
  }
</style>
</head>

function applyRunModeUI() {
  runModeSwitch.classList.toggle('on', sprintMode);
  if (runModeRow)      runModeRow.style.display   = sprintMode ? 'none' : '';
  if (sprintModeGroup) sprintModeGroup.style.display = sprintMode ? '' : 'none';

  if (lblSprintMode)   lblSprintMode.style.color = sprintMode ? '#8be9fd' : '#666';
  // 冲刺模式下隐藏缓加速缓减速选项

    smoothSpeedContainer.style.display = sprintMode ? 'none' : '';
    if (sprintMode && chkSmoothSpeed) chkSmoothSpeed.checked = false;
    if (sprintMode && smoothSpeedGroup) smoothSpeedGroup.style.display = 'none';

  // 根据模式切换体力输入框

  // 调用者需保证 formulaEl/moveFormulaEl 已赋值
  if (typeof formulaEl !== 'undefined' && formulaEl) refreshFormula();
}

// 显示组合操作气泡提示（从舞台底部向上弹出，悬停一段时间后向下消失）
let groupBubbleHideTimer = null;
function showGroupBubble(text) {
  if (!groupBubble) return;
  // 重置隐藏定时器（新一次触发时重新计时，避免快速连续操作时气泡提前消失）
  if (groupBubbleHideTimer) { clearTimeout(groupBubbleHideTimer); groupBubbleHideTimer = null; }
  groupBubble.textContent = text;

  // 初始状态：位于舞台底部之外（透明）
  groupBubble.style.transition = 'none';
  groupBubble.style.bottom = '-80px';
  groupBubble.style.opacity = '0';
  // 短暂延时后启用过渡并弹到目标位置（setTimeout 兼容性更可靠）
  setTimeout(function() {
    groupBubble.style.transition =
      'bottom 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.25s ease';
    groupBubble.style.bottom = '28px';
    groupBubble.style.opacity = '1';
  }, 20);

  // 悬停 1.6 秒后向下消失（透明）
  groupBubbleHideTimer = setTimeout(function() {
    groupBubble.style.transition =
      'bottom 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.45s ease';
    groupBubble.style.bottom = '-80px';
    groupBubble.style.opacity = '0';
    groupBubbleHideTimer = null;
  }, 1600);
}

// 刷新"正在编辑的配置"显示
function updateConfigStatus() {
  if (currentConfigNameEl) {
    currentConfigNameEl.textContent = currentConfigName;
  }
  if (configSaveStatusEl) {
    if (currentConfigDirty) {
      // 有改动 → 显示提示（橙色）
      configSaveStatusEl.textContent = '（有改动）';
      configSaveStatusEl.style.color = '#ffb86c';
      configSaveStatusEl.style.display = '';
    } else {
      // 没有改动过 → 不显示任何状态
      configSaveStatusEl.textContent = '';
      configSaveStatusEl.style.color = '';
      configSaveStatusEl.style.display = 'none';
    }
  }
}
// 标记配置已被修改（需要时由"任何会改变配置的操作"调用）
function markConfigDirty() {
  currentConfigDirty = true;
  updateConfigStatus();
}
// 把文件名（如 mover_config_xxx.json）提取成显示用的短名
function shortConfigNameFromFileName(fname) {
  if (!fname) return '未命名配置';
  let s = '' + fname;
  if (s.toLowerCase().endsWith('.json')) s = s.slice(0, -5);
  return s.length > 24 ? s.slice(0, 24) + '…' : s;
}
// 重命名当前编辑的配置（点击铅笔图标时调用）
function renameCurrentConfig() {
  const name = prompt('输入配置名称：', currentConfigName || '未命名配置');
  if (name == null) return; // 用户取消
  const trimmed = ('' + name).trim();
  if (trimmed.length === 0) {
    showGroupBubble('⚠ 名称不能为空');
    return;
  }
  currentConfigName = trimmed.length > 24 ? trimmed.slice(0, 24) + '…' : trimmed;
  updateConfigStatus();
  showGroupBubble('✏️ 已重命名为：' + currentConfigName);
}
if (btnRenameConfig) {
  btnRenameConfig.addEventListener('click', function(e) {
    e.stopPropagation();
    renameCurrentConfig();
  });
}

// 保存当前配置到内存（不下载/不写文件，导出时才写本地）
function saveCurrentConfigToMemory() {
  savedConfigSnapshot = getFullConfig();
  currentConfigDirty = false;
  updateConfigStatus();
  showGroupBubble('💾 已保存到内存');
}
// 重置：恢复到上次内存保存的配置（不是清空配置）
function resetCurrentConfigFromMemory() {
  if (!savedConfigSnapshot) {
    showGroupBubble('⚠ 还没有保存过，无法重置');
    return false;
  }
  const ok = applyConfig(savedConfigSnapshot);
  if (ok) {
    // 重置成功后视为"与保存点一致，没有改动"
    currentConfigDirty = false;
    updateConfigStatus();
    showGroupBubble('↻ 已恢复到上次保存');
  }
  return ok;
}

/* ============ 序列帧帧数显示辅助（3列Grid + 中文标签 + 独立容器） ============ */
const SEQ_STATE_ZH = {
  idle:   { zh:'站立', color:'#42ffff' },
  walk:   { zh:'走动', color:'#6cff6c' },
  run:    { zh:'奔跑', color:'#ffeb35' },
  jump:   { zh:'跳跃', color:'#ff5555' },
  crouch: { zh:'下蹲', color:'#bd93f9' },
  sprint: { zh:'冲刺', color:'#ffeb35' }
};
// 生成帧数 HTML：每行3个均分容器宽度，每个帧数包在独立容器内用中文显示
// 字体颜色取自 SEQ_STATE_ZH（在 refreshSeqFrameUI / 颜色选择器 input / applyConfig 中与碰撞框 stateColors 保持同步），不加文字描边
// 参数：stateFrames = {idle:n, walk:n, ...}，opts = {placeholderMask: {idle:true,...} 标记占位帧而非真实加载，headerLabel:'顶部文件夹名说明', footerLabel:'底部提示说明'}
function buildSeqFrameGridHtml(stateFrames, opts) {
  opts = opts || {};
  const keys = ['idle','walk','run','jump','crouch','sprint'];
  const placeholderMask = opts.placeholderMask || {};
  let html = '';
  if (opts.headerLabel) html += '<div style="margin-bottom:8px;">' + opts.headerLabel + '</div>';
  html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px;margin:6px 0;">';
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i];
    const zh = SEQ_STATE_ZH[k].zh;
    // 字体颜色取自 SEQ_STATE_ZH（在 refreshSeqFrameUI / 颜色选择器 input / applyConfig 中与碰撞框 stateColors 保持同步）
    // 注意：不能直接引用 stateColors——它在文件后方用 let 声明，初始化前访问会触发 TDZ 报错并中断脚本
    const accent = SEQ_STATE_ZH[k].color;
    const n = (stateFrames && typeof stateFrames[k] === 'number') ? stateFrames[k] : 0;
    const isPlaceholder = !!placeholderMask[k];
    const borderColor = isPlaceholder ? '#444' : accent;
    const countColor = isPlaceholder ? '#777' : accent;
    const tagText = isPlaceholder ? '<span style="font-size:10px;color:#777;margin-left:4px;">(占位)</span>' : '';
    html += '<div style="background:#212236;border:1px solid ' + borderColor + ';border-radius:5px;padding:6px 8px;text-align:center;">'
          +   '<div style="font-size:11px;color:' + accent + ';margin-bottom:2px;font-weight:bold;">' + zh + tagText + '</div>'
          +   '<div style="font-size:15px;font-weight:bold;color:' + countColor + ';">' + n + '<span style="font-size:11px;color:' + countColor + ';font-weight:normal;margin-left:2px;opacity:0.8;">帧</span></div>'
          + '</div>';
  }
  html += '</div>';
  if (opts.footerLabel) html += '<div style="margin-top:4px;">' + opts.footerLabel + '</div>';
  return html;
}

/* ==================== 配置导入/导出 ==================== */
// 获取完整配置
function getFullConfig() {
  // 从 folderInput.files 计算序列帧各状态帧数（与 folderInput change 事件同一套分组规则）
  const seqStateCounts = { idle:0, walk:0, run:0, jump:0, crouch:0, sprint:0 };
  let seqRootFolderName = '';
  if (folderInput && folderInput.files && folderInput.files.length > 0) {
    const firstPath = folderInput.files[0].webkitRelativePath || '';
    if (firstPath) {
      const parts = firstPath.split('/');
      if (parts.length >= 2) seqRootFolderName = parts[0];
    }
    for (let i = 0; i < folderInput.files.length; i++) {
      const f = folderInput.files[i];
      const folder = ((f.webkitRelativePath || '') + '/' + f.name).toLowerCase();
      if      (folder.includes('idle')  || folder.includes('stand')) seqStateCounts.idle++;
      else if (folder.includes('walk') || folder.includes('move'))  seqStateCounts.walk++;
      else if (folder.includes('sprint')||folder.includes('dash')|| folder.includes('rush')) seqStateCounts.sprint++;
      else if (folder.includes('run'))  seqStateCounts.run++;
      else if (folder.includes('jump') || folder.includes('hop'))   seqStateCounts.jump++;
      else if (folder.includes('crouch')|| folder.includes('croun')|| folder.includes('squat')|| folder.includes('sit')) seqStateCounts.crouch++;
    }
  }
  return {
    version: 1,
    timestamp: new Date().toISOString(),
    // 序列帧文件夹（FPS、所选文件夹名、各状态帧数、文件列表含相对路径）
    folder: {
      // FPS
      fps: fpsInput ? +fpsInput.value : 10,
      // 所选根目录名（从 webkitRelativePath 提取，例如"角色帧_奔跑"）
      rootFolderName: seqRootFolderName,
      // 每个状态的帧数（导入后可直接显示，无需真正重选文件夹）
      stateCounts: seqStateCounts,
      // 是否已选择了真实的文件夹
      hasFiles: !!(folderInput && folderInput.files && folderInput.files.length > 0),
      // 兼容旧字段
      name: folderInfo && folderInfo.textContent ? folderInfo.textContent.split('\n')[0] : '',
      // 每个文件的相对路径 + 文件名（供以后恢复用，目前主要是保存完整信息不丢）
      fileList: folderInput && folderInput.files ? Array.from(folderInput.files).map(f => ({
        name: f.name,
        relativePath: f.webkitRelativePath || f.name || ''
      })) : []
    },
    // 颜色设定
    colors: {
      bgTop: bgColorTop.value,
      bgBot: bgColorBot.value,
      world: worldColor.value,
      grid: gridColor.value,
      gridEnabled: gridSwitch.classList.contains('on')
    },
    // 世界设置
    world: {
      width: parseInt(mapWInput.value),
      height: parseInt(mapHInput.value)
    },
    // 碰撞框设置
    collision: {
      width: parseFloat(colWidthInput.value),
      heightNormal: parseFloat(colHeightNormalInput.value),
      heightCrouch: parseFloat(colHeightCrouchInput.value),
      offsetX: parseFloat(offsetXInput.value),
      offsetY: parseFloat(offsetYInput.value),
      renderScale: parseFloat(scaleInput.value) / 100,
      showOutline: charWrap.classList.contains('outline'),
      colorIdle: colorIdle ? colorIdle.value : '#42ffff',
      colorWalk: colorWalk ? colorWalk.value : '#6cff6c',
      colorRun:  colorRun  ? colorRun.value  : '#ffeb35',
      colorJump: colorJump ? colorJump.value : '#ff5555',
      colorCrouch: colorCrouch ? colorCrouch.value : '#bd93f9',
      colorSprint: colorSprint ? colorSprint.value : '#ffeb35'
    },
    // 跳跃参数
    jump: {
      height: parseFloat(jumpHIn.value),
      time: parseFloat(jumpTimeIn.value),
      segments: parseInt(jumpSegIn.value)
    },
    // 移动参数
    movement: {
      crouchSpeed: parseFloat(crouchDistIn.value),
      walkSpeed: parseFloat(walkDistIn.value),
      runSpeed: parseFloat(runDistIn.value),
      sprintSpeed: parseFloat(sprintSpeedDistIn.value),
      sprintDist: parseFloat(sprintDistIn.value),
      airSprintSeg: parseInt(airSprintSegIn.value),
      sprintMode: sprintMode,  // 使用全局变量
      // 特殊选项
      jumpLock: !!(chkJumpLock && chkJumpLock.checked),
      smoothSpeed: !!(chkSmoothSpeed && chkSmoothSpeed.checked),
      accelRate: parseFloat(accelRateIn ? accelRateIn.value : 3),
      decelRate: parseFloat(decelRateIn ? decelRateIn.value : 5),
      // 体力限制
      stamina: !!(chkStamina && chkStamina.checked),
      staminaRecover: parseFloat(staminaRecoverIn ? staminaRecoverIn.value : 3),
      staminaRunMax: parseFloat(staminaRunMaxIn ? staminaRunMaxIn.value : 5),
      staminaSprintMax: parseInt(staminaSprintMaxIn ? staminaSprintMaxIn.value : 3),
      // 蹬壁补次数 / 攀登重置次数（互斥）
      wallClimbGrant: !!(chkWallClimbGrant && chkWallClimbGrant.checked),
      wallClimbReset: !!(chkWallClimbReset && chkWallClimbReset.checked),
      // 蹬壁跳反作用力
      wallClimbJumpRecoil: !!(chkWallClimbJumpRecoil && chkWallClimbJumpRecoil.checked)
    },
    // 平台数据（不包括地面）
    platforms: platforms.filter(p => !p.isGround).map(p => {
      const o = { x: p.x, y: p.y, w: p.w, h: p.h, pid: p.pid };
      if (p.passable) o.passable = true;
      if (p.climbable) o.climbable = true;
      return o;
    }),
    // 重置点位置
    resetPoint: {
      x: resetPointOrigX,
      y: resetPointOrigY
    }
  };
}

// 应用配置
function applyConfig(config) {
  if (!config || config.version !== 1) {
    alert('配置版本不兼容');
    return false;
  }
  
  // 安全获取配置值（仅在 undefined/null 时使用默认值）
  function cv(val, defaultVal) {
    return (val !== undefined && val !== null) ? val : defaultVal;
  }

  // 自定义"是否加载序列帧"确认 modal（替代 window.confirm）
  // 原因：Edge/Chrome 中 window.confirm 返回后用户手势已被消耗，
  // 之后调用 showDirectoryPicker() / folderInput.click() 会被 transient activation 拦截；
  // 用自定义 modal 让"是"按钮的 click 事件成为真实的用户手势，
  // 在该回调内同步发起 picker 即可正常弹出选择器。
  function showFolderLoadConfirmModal(message, onYes) {
    // 创建遮罩层
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit;';
    // 创建对话框
    const dlg = document.createElement('div');
    dlg.style.cssText = 'background:#282a36;color:#f8f8f2;padding:22px 24px;border-radius:10px;max-width:520px;min-width:340px;box-shadow:0 12px 36px rgba(0,0,0,0.6);border:1px solid #44475a;';
    // 消息正文（保留换行）
    const msgEl = document.createElement('div');
    msgEl.style.cssText = 'white-space:pre-wrap;font-size:13px;line-height:1.7;margin-bottom:20px;color:#f8f8f2;';
    msgEl.textContent = message; // textContent 防注入
    dlg.appendChild(msgEl);
    // 按钮区
    const btnBar = document.createElement('div');
    btnBar.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;';
    const btnNo = document.createElement('button');
    btnNo.textContent = '否';
    btnNo.style.cssText = 'padding:8px 18px;border-radius:5px;border:1px solid #6272a4;background:#44475a;color:#f8f8f2;cursor:pointer;font-size:13px;';
    const btnYes = document.createElement('button');
    btnYes.textContent = '是（推荐）';
    btnYes.style.cssText = 'padding:8px 18px;border-radius:5px;border:1px solid #50fa7b;background:#50fa7b;color:#282a36;cursor:pointer;font-weight:bold;font-size:13px;';
    btnBar.appendChild(btnNo);
    btnBar.appendChild(btnYes);
    dlg.appendChild(btnBar);
    overlay.appendChild(dlg);
    document.body.appendChild(overlay);

    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    // 点"否"或遮罩：直接关闭，不触发 onYes
    btnNo.addEventListener('click', function(e) { e.stopPropagation(); close(); });
    overlay.addEventListener('click', function(e) {
      // 点遮罩空白处也算取消（但点到对话框内部不处理）
      if (e.target === overlay) close();
    });
    // ESC 关闭
    function onKey(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); }
    }
    document.addEventListener('keydown', onKey);
    // 点"是"：关闭并同步调用 onYes（保留用户手势 transient activation）
    btnYes.addEventListener('click', function(e) {
      e.stopPropagation();
      close();
      document.removeEventListener('keydown', onKey);
      // 关键：在 click 事件处理函数内同步调用 onYes
      // 不要 setTimeout、不要 await，否则 Edge/Chrome 会丢失用户手势链路
      if (typeof onYes === 'function') {
        try { onYes(); } catch(err) {
          try { showGroupBubble('⚠ 加载失败：' + err.message); } catch(_){}
        }
      }
    });
    // 默认聚焦"是"按钮
    setTimeout(function() { try { btnYes.focus(); } catch(_){} }, 0);
  }
  
  // 第一阶段：应用所有配置值（即使某些步骤失败，配置也尽量多地应用）
  let configApplied = true;
  const errors = [];
  
  // 颜色设定
  try {
    if (config.colors) {
      if (bgColorTop) bgColorTop.value = cv(config.colors.bgTop, '#2a2a40');
      if (bgColorBot) bgColorBot.value = cv(config.colors.bgBot, '#15151e');
      if (worldColor) worldColor.value = cv(config.colors.world, '#ffffff');
      if (gridColor) gridColor.value = cv(config.colors.grid, '#b4b4b4');
      if (gridSwitch && config.colors.gridEnabled !== gridSwitch.classList.contains('on')) {
        if (config.colors.gridEnabled) {
          gridSwitch.classList.add('on');
        } else {
          gridSwitch.classList.remove('on');
        }
      }
    }
  } catch(e) {
    errors.push('颜色设定: ' + e.message);
  }
  
  // 世界设置
  try {
    if (config.world) {
      if (mapWInput) mapWInput.value = cv(config.world.width, 30);
      if (mapHInput) mapHInput.value = cv(config.world.height, 20);
    }
  } catch(e) {
    errors.push('世界设置: ' + e.message);
  }
  
  // 碰撞框设置
  try {
    if (config.collision) {
      if (colWidthInput) colWidthInput.value = cv(config.collision.width, 1);
      if (colHeightNormalInput) colHeightNormalInput.value = cv(config.collision.heightNormal, 2);
      if (colHeightCrouchInput) colHeightCrouchInput.value = cv(config.collision.heightCrouch, 1);
      if (offsetXInput) offsetXInput.value = cv(config.collision.offsetX, 0);
      if (offsetYInput) offsetYInput.value = cv(config.collision.offsetY, 0);
      if (scaleInput)   scaleInput.value   = Math.round((cv(config.collision.renderScale, 1)) * 100);
      // 同步全局变量（仅设置 input.value 不会触发 input 事件，也不会更新全局变量）
      renderOffsetX = parseFloat(offsetXInput ? offsetXInput.value : 0) || 0;
      renderOffsetY = parseFloat(offsetYInput ? offsetYInput.value : 0) || 0;
      renderScale   = Math.max(0.1, Math.min(5, (parseFloat(scaleInput ? scaleInput.value : 100) || 100) / 100));
      if (charWrap && outlineSw && config.collision.showOutline !== charWrap.classList.contains('outline')) {
        if (config.collision.showOutline) {
          outlineSw.classList.add('on');
          charWrap.classList.add('outline');
        } else {
          outlineSw.classList.remove('on');
          charWrap.classList.remove('outline');
        }
      }
      // 导入每个状态的碰撞框颜色（仅设置值，不触发 input 事件；下面手动同步 stateColors）
      if (colorIdle)    colorIdle.value    = cv(config.collision.colorIdle,    colorIdle.value);
      if (colorWalk)    colorWalk.value    = cv(config.collision.colorWalk,    colorWalk.value);
      if (colorRun)     colorRun.value     = cv(config.collision.colorRun,     colorRun.value);
      if (colorJump)    colorJump.value    = cv(config.collision.colorJump,    colorJump.value);
      if (colorCrouch)  colorCrouch.value  = cv(config.collision.colorCrouch,  colorCrouch.value);
      if (colorSprint)  colorSprint.value  = cv(config.collision.colorSprint,  colorSprint.value);
      stateColors.idle   = colorIdle.value;
      stateColors.walk   = colorWalk.value;
      stateColors.run    = colorRun.value;
      stateColors.jump   = colorJump.value;
      stateColors.crouch = colorCrouch.value;
      stateColors.sprint = colorSprint.value;
      stateColors['crouch-sprint'] = colorCrouch.value;
      // 同时同步 SEQ_STATE_ZH（序列帧显示用）
      SEQ_STATE_ZH.idle.color   = colorIdle.value;
      SEQ_STATE_ZH.walk.color   = colorWalk.value;
      SEQ_STATE_ZH.run.color    = colorRun.value;
      SEQ_STATE_ZH.jump.color   = colorJump.value;
      SEQ_STATE_ZH.crouch.color = colorCrouch.value;
      SEQ_STATE_ZH.sprint.color = colorSprint.value;
    }
  } catch(e) {
    errors.push('碰撞框设置: ' + e.message);
  }
  
  // 跳跃参数
  try {
    if (config.jump) {
      if (jumpHIn) jumpHIn.value = cv(config.jump.height, 4);
      if (jumpTimeIn) jumpTimeIn.value = cv(config.jump.time, 1);
      if (jumpSegIn) jumpSegIn.value = cv(config.jump.segments, 2);
    }
  } catch(e) {
    errors.push('跳跃参数: ' + e.message);
  }
  
  // 移动参数
  try {
    if (config.movement) {
      if (crouchDistIn) crouchDistIn.value = cv(config.movement.crouchSpeed, 1.2);
      if (walkDistIn) walkDistIn.value = cv(config.movement.walkSpeed, 2);
      if (runDistIn) runDistIn.value = cv(config.movement.runSpeed, 4);
      if (sprintSpeedDistIn) sprintSpeedDistIn.value = cv(config.movement.sprintSpeed, 16);
      if (sprintDistIn) sprintDistIn.value = cv(config.movement.sprintDist, 4);
      if (airSprintSegIn) airSprintSegIn.value = cv(config.movement.airSprintSeg, 1);
      // 直接设置 sprintMode 和 UI（不通过 click 事件避免反转）
      sprintMode = !!config.movement.sprintMode;
      // 同步导入的速度到当前模式的速度记忆（各模式独立，避免切模式后丢回复旧值）
      const impMem = modeSpeedMemory[sprintMode];
      if (impMem) {
        if (crouchDistIn) { const v = parseFloat(crouchDistIn.value); if (!isNaN(v)) impMem.crouch = v; }
        if (walkDistIn)   { const v = parseFloat(walkDistIn.value);   if (!isNaN(v)) impMem.walk = v; }
        if (!sprintMode && runDistIn) { const v = parseFloat(runDistIn.value); if (!isNaN(v)) impMem.run = v; }
      }
      if (runModeSwitch) {
        if (sprintMode) {
          runModeSwitch.classList.add('on');
        } else {
          runModeSwitch.classList.remove('on');
        }
      }
      if (runModeRow) runModeRow.style.display = sprintMode ? 'none' : '';
      if (sprintModeGroup) sprintModeGroup.style.display = sprintMode ? '' : 'none';
      if (lblRunMode) lblRunMode.style.color = sprintMode ? '#666' : '#8be9fd';
      if (lblSprintMode) lblSprintMode.style.color = sprintMode ? '#8be9fd' : '#666';
      // 冲刺模式下隐藏缓加速缓减速容器
      if (smoothSpeedContainer) smoothSpeedContainer.style.display = sprintMode ? 'none' : '';
      // 特殊选项
      if (chkJumpLock) {
        chkJumpLock.checked = !!cv(config.movement.jumpLock, false);
      }
      if (chkSmoothSpeed) {
        chkSmoothSpeed.checked = sprintMode ? false : !!cv(config.movement.smoothSpeed, false);
        if (smoothSpeedGroup) smoothSpeedGroup.style.display = chkSmoothSpeed.checked ? '' : 'none';
      }
      if (accelRateIn) accelRateIn.value = cv(config.movement.accelRate, 3);
      if (decelRateIn) decelRateIn.value = cv(config.movement.decelRate, 5);
      // 体力限制
      if (chkStamina) {
        chkStamina.checked = !!cv(config.movement.stamina, false);
        if (staminaGroup) staminaGroup.style.display = chkStamina.checked ? '' : 'none';
      }
      if (staminaRecoverIn) staminaRecoverIn.value = cv(config.movement.staminaRecover, 3);
      if (staminaRunMaxIn) staminaRunMaxIn.value = cv(config.movement.staminaRunMax, 5);
      if (staminaSprintMaxIn) staminaSprintMaxIn.value = cv(config.movement.staminaSprintMax, 3);
      // 根据模式切换体力输入框
      if (staminaRunRow) staminaRunRow.style.display = sprintMode ? 'none' : '';
      if (staminaSprintRow) staminaSprintRow.style.display = sprintMode ? '' : 'none';
      // 重置体力状态
      stamina = 1;
    }
    // 蹬壁补次数 / 攀登重置次数（互斥）
    try {
      const wcg = config.movement.wallClimbGrant;
      const wcr = config.movement.wallClimbReset;
      let gEn = wcg === undefined ? true  : !!wcg;   // 缺省开启（向后兼容）
      let rEn = wcr === undefined ? false : !!wcr;   // 缺省关闭
      if (gEn && rEn) rEn = false;                   // 互斥：同时为真时优先补次数
      if (chkWallClimbGrant) chkWallClimbGrant.checked = gEn;
      if (chkWallClimbReset) chkWallClimbReset.checked = rEn;
      wallClimbGrantEnabled = gEn;
      wallClimbResetEnabled = rEn;
    } catch(e) { /* 忽略 */ }
    // 蹬壁跳反作用力
    try {
      const wcjr = config.movement.wallClimbJumpRecoil;
      const rEn = wcjr === undefined ? false : !!wcjr;  // 缺省关闭（向后兼容）
      if (chkWallClimbJumpRecoil) chkWallClimbJumpRecoil.checked = rEn;
      wallClimbJumpRecoilEnabled = rEn;
    } catch(e) { /* 忽略 */ }
  } catch(e) {
    errors.push('移动参数: ' + e.message);
  }

  // 序列帧（FPS + 文件夹名 + 各状态帧数）
  try {
    if (config.folder) {
      // 恢复 FPS
      const savedFps = cv(config.folder.fps, 10);
      if (fpsInput) fpsInput.value = savedFps;
      if (typeof fps !== 'undefined') { fps = Math.max(1, +savedFps || 10); }

      // 判定：当前配置是否"完全没有设置过序列帧文件夹"
      // 条件：hasFiles=false / rootFolderName空 / stateCounts全0(或不存在) / fileList空(或不存在)
      function _isNoFolderConfig(f) {
        if (cv(f.hasFiles, false)) return false;
        if (cv(f.rootFolderName, '')) return false;
        const sc = f.stateCounts;
        if (sc && typeof sc === 'object') {
          for (const k of ['idle','walk','run','jump','crouch','sprint']) {
            if (cv(sc[k], 0) !== 0) return false;
          }
        }
        if (Array.isArray(f.fileList) && f.fileList.length > 0) return false;
        // 兼容旧配置：folder.name 也为空或"未选择文件夹"开头则认为没有设置
        const name = (cv(f.name, '') || '').trim();
        if (name && !name.startsWith('未选择文件夹')) {
          // 非空且不是默认起始文案——认为该配置多少记录了一些文件夹信息，不清空
          return false;
        }
        return true;
      }
      const isNoFolder = _isNoFolderConfig(config.folder);
      if (isNoFolder) {
        // 导入"没有设置文件夹"的配置：清空当前会话中已加载的真实序列帧，回退到默认占位帧
        frames.idle   = genPlaceholder('idle',   6);
        frames.walk   = genPlaceholder('walk',  10);
        frames.run    = genPlaceholder('run',    3);
        frames.jump   = genPlaceholder('jump',   6);
        frames.crouch = genPlaceholder('crouch', 13);
        frames.sprint = genPlaceholder('sprint', 6);
        hasRealImg.idle = false;
        hasRealImg.walk = false;
        hasRealImg.run  = false;
        hasRealImg.jump = false;
        hasRealImg.crouch = false;
        hasRealImg.sprint = false;
        // folderInfo 回到初始状态
        if (folderInfo) {
          const defaultFrames = { idle:6, walk:10, run:3, jump:6, crouch:13, sprint:6 };
          const allPlaceholder = { idle:true, walk:true, run:true, jump:true, crouch:true, sprint:true };
          folderInfo.innerHTML = buildSeqFrameGridHtml(defaultFrames, {
            placeholderMask: allPlaceholder,
            headerLabel: '未选择文件夹 格式*.PNG <span style="color:#888;font-size:11px;">（以下为内置默认占位帧数）</span>',
            footerLabel: '<span style="color:#888;">子目录：idle / walk / run / jump / crouch / sprint</span>'
          });
        }
        // 跳过后续"真实加载 / 配置记录"渲染分支
      } else if (folderInfo) {
        // 简单转义，避免文件夹名含 < 等字符破坏 HTML
        function _esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        const sc = cv(config.folder.stateCounts, null);
        const rootFn = cv(config.folder.rootFolderName, '');
        const anyReal = !!(hasRealImg && Object.values(hasRealImg).some(Boolean));
        if (anyReal) {
          // 当前会话已经加载过真实图片，frames/hasRealImg 保留（我们不去重置图片，保持当前真实渲染）
          // 只用保存的 rootFolderName 做标题，真实帧数以当前 frames.length 为准显示
          const currFrames = {};
          const notRealMask = {};
          for (const k of ['idle','walk','run','jump','crouch','sprint']) {
            currFrames[k] = (frames && frames[k]) ? frames[k].length : 0;
            notRealMask[k] = !hasRealImg[k];
          }
          const header = rootFn
            ? '📁 <b>' + _esc(rootFn) + '</b>（真实加载）'
            : '📁 真实帧已加载';
          folderInfo.innerHTML = buildSeqFrameGridHtml(currFrames, {
            placeholderMask: notRealMask,
            headerLabel: header,
            footerLabel: '<span style="color:#666;font-size:11px;">（配置记录帧数仅作参考，实际显示以当前会话加载的真实图为准）</span>'
          });
        } else {
          // 完全没有真实图：明确使用"配置记录"视觉样式 + 灰字 + 未实际加载提示
          const stateFrames = (sc && typeof sc === 'object')
            ? { idle: cv(sc.idle,0), walk: cv(sc.walk,0), run: cv(sc.run,0), jump: cv(sc.jump,0), crouch: cv(sc.crouch,0), sprint: cv(sc.sprint,0) }
            : null;
          const allConfigMask = { idle:true, walk:true, run:true, jump:true, crouch:true, sprint:true };
          const folderLine = rootFn
            ? '📁 <b style="color:#888;">' + _esc(rootFn) + '</b> <span style="color:#ff5555;font-weight:bold;">【未实际加载】</span>'
            : (cv(config.folder.name, '') ? '📁 <b style="color:#888;">' + _esc(config.folder.name) + '</b> <span style="color:#ff5555;font-weight:bold;">【未实际加载】</span>' : '📁 <span style="color:#ff5555;font-weight:bold;">【未实际加载】</span>');
          folderInfo.innerHTML = buildSeqFrameGridHtml(stateFrames || {idle:0,walk:0,run:0,jump:0,crouch:0,sprint:0}, {
            placeholderMask: allConfigMask,
            headerLabel: folderLine,
            footerLabel: '<span style="color:#ffb86c;font-size:11px;">⚠ 请点击上方"选择资源文件夹"重新选择同一文件夹以恢复真实渲染</span>'
          });

          // 通过原生 confirm 询问用户：是否立即选择同一文件夹直接加载真实序列帧
          // （处于用户导入配置的手势链路内，confirm 确认后的 transient activation 有效，可合法触发系统文件/目录选择）
          try {
            if (folderInput && typeof folderInput.click === 'function') {
              const folderDesc = rootFn
                ? '「' + rootFn + '」'
                : (cv(config.folder.name, '') ? '（配置记录的文件夹）' : '');
              const frameCount = (sc && typeof sc === 'object')
                ? Object.values(sc).reduce((a,b)=>a+(+b||0),0)
                : (Array.isArray(config.folder.fileList) ? config.folder.fileList.length : 0);
              const msg = '📥 导入的配置中包含序列帧资源 ' + folderDesc
                + (frameCount ? '（共 ' + frameCount + ' 帧）' : '') + '。\n\n'
                + '浏览器安全限制：无法仅凭配置记录自动读取本地图片。\n'
                + '是否立即打开文件夹选择器，选择同一帧资源文件夹来加载真实图？\n\n'
                + '【是】打开选择文件夹（推荐）\n【否】暂不加载，保持占位帧显示';
              // 用自定义 modal 替代 window.confirm
              // 原因：Edge/Chrome 中 window.confirm 返回后用户手势已被消耗，
              // 之后调用 showDirectoryPicker() 或 folderInput.click() 会被 transient activation 检查拦截；
              // Firefox 手势判定宽松所以无此问题。
              // 自定义 modal 的"是"按钮 click 事件是真实的用户手势，
              // 在该回调内同步发起 picker 即可绕过该限制。
              showFolderLoadConfirmModal(msg, function() {
                // ============ Edge/Chrome 路径：用 File System Access 的 showDirectoryPicker() ============
                // 同步发起 showDirectoryPicker()（返回 Promise 但调用本身在用户手势内），
                // 等待用户选择目录后再异步处理 walk/装配/dispatch。
                if (window.showDirectoryPicker && typeof window.showDirectoryPicker === 'function') {
                  let pickerPromise;
                  try {
                    pickerPromise = window.showDirectoryPicker({ mode: 'read' });
                  } catch (syncErr) {
                    // 同步抛错（极少见，但兜底）
                    if (syncErr && syncErr.name !== 'AbortError') {
                      try { showGroupBubble('⚠ 无法打开文件夹选择器：' + syncErr.message); } catch(_){}
                    }
                    return;
                  }
                  pickerPromise.then(async function(dirHandle) {
                    try {
                      // 递归收集所有文件：返回 [{relPath, file}] 数组
                      // relPath 统一为 "RootDirName/subdir/filename.png"，与 input[webkitdirectory] 格式一致
                      function _isFSFileHandle(h) { return h && h.kind === 'file' && typeof h.getFile === 'function'; }
                      function _isFSDirHandle(h)  { return h && h.kind === 'directory' && (typeof h.values === 'function' || typeof h.entries === 'function'); }
                      async function walk(dirHandleIn, relSoFar, out) {
                        out = out || [];
                        relSoFar = relSoFar || '';
                        const iter = (typeof dirHandleIn.values === 'function') ? dirHandleIn.values() : dirHandleIn.entries();
                        for await (const entry of iter) {
                          // entries() 返回 [name, handle]，values() 返回 handle
                          const handle = Array.isArray(entry) ? entry[1] : entry;
                          const entryName = handle.name || (Array.isArray(entry) ? entry[0] : '');
                          const childRel = relSoFar ? (relSoFar + '/' + entryName) : entryName;
                          if (_isFSDirHandle(handle)) { await walk(handle, childRel, out); }
                          else if (_isFSFileHandle(handle)) {
                            const f = await handle.getFile();
                            out.push({ relPath: childRel, file: f });
                          }
                        }
                        return out;
                      }
                      const rootDirName = dirHandle.name || '';
                      const walked = await walk(dirHandle, rootDirName, []);
                      // 用 DataTransfer 把收集到的 File[] 赋给 folderInput
                      if (window.DataTransfer) {
                        const dt = new DataTransfer();
                        for (const it of walked) {
                          // 给每个 File 对象补充 webkitRelativePath（folderInput.change 依赖这个分组）
                          try {
                            Object.defineProperty(it.file, 'webkitRelativePath', {
                              value: it.relPath || it.file.name,
                              writable: false, configurable: true, enumerable: true
                            });
                          } catch(e) { /* 某些浏览器可能 readonly，忽略即可，folderInput.change 会退化用 name */ }
                          dt.items.add(it.file);
                        }
                        try { folderInput.files = dt.files; } catch(e) { /* 赋值失败就不赋值，直接手动派发也能拿到 files */ }
                      } else {
                        // 旧浏览器不支持 DataTransfer：也不阻塞，我们在 folderInput 上挂 _fsaFiles 备用
                        folderInput._fsaFiles = walked.map(it => {
                          try { Object.defineProperty(it.file, 'webkitRelativePath', { value: it.relPath || it.file.name, writable:false, configurable:true, enumerable:true }); } catch(e){}
                          return it.file;
                        });
                      }
                      // 派发 change 事件，完全复用 folderInput.onchange 的分组/渲染逻辑
                      folderInput.dispatchEvent(new Event('change', { bubbles: true, cancelable: true }));
                      // 用完清理临时引用
                      delete folderInput._fsaFiles;
                      showGroupBubble('📁 已选择文件夹：' + (rootDirName || '（FSA）'));
                    } catch(err) {
                      if (err && err.name !== 'AbortError' && err.name !== 'NotFoundError') {
                        try { showGroupBubble('⚠ 选择文件夹失败：' + err.message); } catch(_){}
                      }
                    }
                  }).catch(function(err) {
                    // 用户取消 showDirectoryPicker / 权限拒绝等：静默失败
                    if (err && err.name !== 'AbortError' && err.name !== 'NotFoundError') {
                      try { showGroupBubble('⚠ 选择文件夹失败：' + err.message); } catch(_){}
                    }
                  });
                } else {
                  // ============ Firefox 等无 FSA 路径：走 input[webkitdirectory].click() ============
                  // 在 modal 按钮的 click 事件处理函数内同步调用 folderInput.click()，
                  // 处于用户手势链路中，Firefox/旧浏览器可以正常弹出文件夹选择器。
                  try { folderInput.value = ''; } catch(e) {}
                  try { folderInput.click(); }
                  catch (clickErr) {
                    try { showGroupBubble('⚠ 无法打开文件夹选择器：' + clickErr.message); } catch(_){}
                  }
                }
              });
            }
          } catch (confirmErr) {
            // 静默失败：即便 modal / click 抛错也不影响配置导入本身的成功状态
          }
        }
      }

      // 注意：frames / hasRealImg 不做自动恢复——浏览器安全限制，无法仅凭文件路径重读本地图片；
      // 若导入的是"有文件夹配置"但当前会话未选文件夹，则保持占位帧，用户再点一次"选择资源文件夹"即可恢复真实图
    }
  } catch(e) {
    errors.push('序列帧: ' + e.message);
  }
  
  // 平台数据
  try {
    // 无论配置中是否有平台数据，都清空撤回/还原栈
    undoStack = [];
    redoStack = [];
    if (typeof updateUndoRedoBtns === 'function') updateUndoRedoBtns();
    
    if (config.platforms) {
      // 清除现有非地面平台
      platforms = platforms.filter(p => p.isGround);
      // 添加导入的平台
      config.platforms.forEach(p => {
        const np = {
          x: cv(p.x, 0), y: cv(p.y, 0), w: cv(p.w, 1), h: cv(p.h, 1), pid: cv(p.pid, 'p_' + Date.now() + '_' + Math.random()), isGround: false
        };
        if (p.passable) np.passable = true;
        if (p.climbable) np.climbable = true;
        platforms.push(np);
      });
      if (typeof renderPlatforms === 'function') renderPlatforms();
    }
  } catch(e) {
    errors.push('平台数据: ' + e.message);
  }
  
  // 重置点位置
  try {
    if (config.resetPoint) {
      const rx = cv(config.resetPoint.x, colW);
      const ry = cv(config.resetPoint.y, GROUND_H);
      resetPointOrigX = rx;
      resetPointOrigY = ry;
      resetPointX = rx;
      resetPointY = ry;
      charX = rx;
      posY = ry;
      // 重置所有跳跃和特殊运动状态
      isJumping = false; isFalling = false; fallRecorded = false;
      jumpsUsed = 0; jumpCount = 0; velY = 0;
      moveDistPx = 0; maxHeightCur = 0; startPosY = 0;
      airTimeAccum = 0; segElapsedList = [];
      airCrouchRequest = false; airSprintSegUsed = 0; sprintCount = 0;
      // 跳跃锁定重置
      prevJumpLockActive = false; lockedAirDir = 0; lockedAirSpd = 0;
      // 冲刺结束跳跃缓冲重置
      sprintEndJumpBuffer = false;
      // 缓加速重置
      currentSpd = 0;
      prevMoveDir = 0;
      blockedLastFrame = false;
      // 体力重置
      stamina = 1; isRunning = false; isSprinting = false; staminaDepleted = false; staminaShiftRecovering = false;
    }
  } catch(e) {
    errors.push('重置点位置: ' + e.message);
  }
  
  // 第二阶段：刷新公式和地图（即使失败也不影响配置应用结果）
  try {
    if (typeof refreshFormula === 'function') refreshFormula();
  } catch(e) {
    console.error('刷新公式失败:', e);
    errors.push('刷新公式: ' + e.message);
  }
  try {
    if (typeof applyMapSize === 'function') applyMapSize();
  } catch(e) {
    console.error('刷新地图尺寸失败:', e);
    errors.push('刷新地图: ' + e.message);
  }
  try {
    if (typeof updateCollisionBox === 'function') updateCollisionBox();
  } catch(e) {
    console.error('刷新碰撞框失败:', e);
    errors.push('刷新碰撞框: ' + e.message);
  }
  try {
    if (typeof updatePlatListUI === 'function') updatePlatListUI();
  } catch(e) {
    console.error('刷新平台列表失败:', e);
    errors.push('刷新平台列表: ' + e.message);
  }
  try {
    // 刷新角色占位背景色与帧图（导入的颜色/序列帧配置同步生效）
    if (typeof setCharClass === 'function') setCharClass(charEl.className);
    if (typeof renderFrame === 'function') renderFrame();
  } catch(e) { /* 忽略 */ }
  try {
    // 清空移动状态记录日志
    if (typeof jumpRecords !== 'undefined') jumpRecords = [];
    if (typeof renderRecordTable === 'function') renderRecordTable();
  } catch(e) {
    console.error('清空移动记录失败:', e);
    errors.push('清空移动记录: ' + e.message);
  }
  
  // 如果有错误但配置已基本应用，返回 true 并在控制台输出警告
  if (errors.length > 0) {
    console.warn('配置应用完成但部分步骤出现警告:', errors);
  }
  
  return configApplied;
}

// 把"显示用的配置名"转换成合法的文件名：去除非法字符 / \ : * ? " < > |，去除省略号，trim；如果结果为空则回退到默认名
function sanitizeConfigFileName(displayName, fallbackBase) {
  let s = '' + (displayName || '');
  // 先去掉末尾省略号（重命名时超过 24 字符会被加…）
  s = s.replace(/…+$/, '');
  // 去掉 Windows / macOS / Linux 非法文件名字符
  s = s.replace(/[\\/:*?"<>|]/g, '_');
  // 去掉控制字符
  s = s.replace(/[\x00-\x1f\x7f]/g, '');
  s = s.trim();
  // 去掉末尾的 .（Windows 文件夹/文件名不能以点结尾）和空白
  s = s.replace(/[.\s]+$/g, '');
  if (s.length === 0) s = fallbackBase || 'mover_config';
  // 超长截断
  if (s.length > 120) s = s.slice(0, 120);
  return s;
}

// 导出配置到本地文件：选择保存位置或浏览器下载（仅此路径才真正写本地）
// 文件名：按配置名导出（不加时间戳），形式 = {清洗后的配置名}.json
async function exportConfigToFile() {
  const config = getFullConfig();
  const jsonStr = JSON.stringify(config, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const jsonText = await blob.text();
  // 按配置名导出：{清洗后的配置名}.json  （如果用户改过名，就按那个名导出；没改过=未命名配置也会被清洗成"未命名配置.json"）
  const safeBase = sanitizeConfigFileName(currentConfigName, 'mover_config');
  const fileName = safeBase + '.json';

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: fileName,
        types: [{
          description: 'JSON 配置文件',
          accept: { 'application/json': ['.json'] }
        }]
      });
      const writer = await handle.createWritable();
      await writer.write(jsonText);
      await writer.close();
      showGroupBubble('📤 配置已导出：' + handle.name);
      // 导出只是下载快照，不改变内存保存点/脏状态
      return { ok: true, fileName: handle.name };
    } catch (err) {
      if (err.name === 'AbortError') return { ok: false, canceled: true };
      console.error('保存配置失败，降级为下载：', err);
    }
  }
  // 不支持 FSA / 写文件失败 → 浏览器下载（同样不加时间戳，文件名按配置名）
  fallbackDownload(blob, fileName);
  return { ok: true, fileName: fileName, downloaded: true };
}

// 直接传入完整文件名（含 .json），不再在函数内拼 mover_config_ + timestamp
function fallbackDownload(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName || 'mover_config.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showGroupBubble('📤 配置已导出：' + a.download);
}

// 选择文件并应用配置
configFileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const config = JSON.parse(ev.target.result);
      if (config.version !== 1) {
        alert('配置版本不兼容');
        return;
      }
      const success = applyConfig(config);
      if (success) {
        // 导入成功后：把当前"正在编辑的配置"切换为刚导入的那个；
        // 并把导入的这份配置当作新的"内存保存点"，dirty=false（刚导入，没有改动）
        currentConfigName = shortConfigNameFromFileName(file.name);
        savedConfigSnapshot = JSON.parse(JSON.stringify(config));
        currentConfigDirty = false;
        updateConfigStatus();
        showGroupBubble('📥 配置已导入：' + currentConfigName);
      }
    } catch (err) {
      alert('读取配置文件失败: ' + err.message);
    }
  };
  reader.readAsText(file);
});

// 导出后覆盖 - 先导出当前配置，再打开文件选择器
confirmBtnExportFirst.addEventListener('click', async function() {
  confirmModal.style.display = 'none';
  const config = getFullConfig();
  const jsonStr = JSON.stringify(config, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
  
  // 统一打开文件选择器的函数
  const openFilePicker = () => {
    configFileInput.value = '';
    configFileInput.click();
  };
  
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: 'mover_config_backup_' + timestamp + '.json',
        types: [{
          description: 'JSON 配置文件',
          accept: { 'application/json': ['.json'] }
        }]
      });
      const writer = await handle.createWritable();
      await writer.write(blob);
      await writer.close();
      showGroupBubble('💾 备份已保存');
    } catch (err) {
      if (err.name !== 'AbortError') {
        fallbackDownload(blob, timestamp + '_backup');
      }
    }
    // 保存完成后打开文件选择器
    setTimeout(openFilePicker, 100);
  } else {
    // 不支持 File System Access API：直接下载 + 立即打开文件选择器
    // 注意：在不支持的浏览器上，必须在用户手势同步链路中调用 click()
    fallbackDownload(blob, timestamp + '_backup');
    openFilePicker();
  }
});

/* ==================== 撤回 / 还原 系统（绘制模式下，最多 10 步撤回） ==================== */
const MAX_UNDO = 10;
let undoStack = [];   // 历史快照栈（最早在 0，最新在末尾）
let redoStack = [];   // 撤回后的未来栈

// 打快照：记录非地面平台的 {x,y,w,h,pid,gid} 完整副本（gid 用于组合关系撤回/还原）
function snapPlatforms() {
  return platforms
    .filter(function(p){ return !p.isGround; })
    .map(function(p){
      const s = { x:p.x, y:p.y, w:p.w, h:p.h, pid:p.pid };
      if (p.gid != null) s.gid = p.gid;
      if (p.passable) s.passable = true;
      if (p.climbable) s.climbable = true;
      return s;
    });
}

// 调用 recordUndoStep 之前若已经对 platforms 做了修改，必须把 BEFORE 快照主动传进来；
// 如果不传，则自动把当前状态作为"下一步要撤回的目标"入栈。
function recordUndoStep(optionalBeforeSnapshot) {
  if (!drawMode) return; // 仅绘制模式下记录
  const snap = (optionalBeforeSnapshot != null) ? optionalBeforeSnapshot : snapPlatforms();
  undoStack.push(snap);
  if (undoStack.length > MAX_UNDO) undoStack.shift(); // 超出上限丢弃最早的
  // 新操作产生时清空还原栈（分支树断裂，标准行为）
  redoStack = [];
  updateUndoRedoBtns();
  // 任何会产生新历史步骤的操作，都视为配置被修改
  markConfigDirty();
}

// 根据快照恢复非地面平台；保留地面并重置地面尺寸
function applySnapshot(snap) {
  // 保留地面平台（始终是数组 0 号）
  const ground = platforms.find(function(p){ return p.isGround; });
  // 快照也可能带 gid（组合号），完整拷贝
  const deepCopy = snap.map(function(p){
    const cp = { x:p.x, y:p.y, w:p.w, h:p.h, pid:p.pid };
    if (p.gid != null) cp.gid = p.gid;
    if (p.passable) cp.passable = true;
    if (p.climbable) cp.climbable = true;
    return cp;
  });
  platforms = (ground ? [ground] : []).concat(deepCopy);
  // 同步 pidCounter 为最大 pid + 1，避免后续新增平台重复 id
  let maxPid = 0;
  platforms.forEach(function(p){ if (p.pid > maxPid) maxPid = p.pid; });
  pidCounter = maxPid + 1;
  // 组合一致性修正（孤立组 <2 的解散；gidCounter 重置）
  rebuildGroupsFromPlatforms();
  // 撤回/还原后清除选中（因为快照可能改变了哪些平台存在）
  clearPlatformSelection();
  renderPlatforms(); // 重建 DOM + 刷新列表
  hideResizeHandles();
}

// 根据栈长度动态启用按钮
function updateUndoRedoBtns() {
  platUndoBtn.disabled = undoStack.length === 0;
  platRedoBtn.disabled = redoStack.length === 0;
}

// 统一的撤回入口（按钮点击 / Ctrl+Z 都走这里），返回是否真正执行了撤回
function performUndo() {
  if (!drawMode || undoStack.length === 0) return false;
  const prev = undoStack.pop();               // 目标状态（"撤回之后的样子"）
  redoStack.push(snapPlatforms());            // 当前 → 未来栈
  applySnapshot(prev);
  updateUndoRedoBtns();
  // 撤回也会改变配置（平台状态恢复到之前）
  markConfigDirty();
  return true;
}
// 统一的还原入口（按钮点击 / Ctrl+Y 都走这里），返回是否真正执行了还原
function performRedo() {
  if (!drawMode || redoStack.length === 0) return false;
  const next = redoStack.pop();               // 目标状态（"还原之后的样子"）
  undoStack.push(snapPlatforms());            // 当前 → 历史栈
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  applySnapshot(next);
  updateUndoRedoBtns();
  // 还原也会改变配置（平台状态前进到之后）
  markConfigDirty();
  return true;
}

let worldW = 30 * GRID;
let worldH = 20 * GRID;
let mapTotalW = worldW;
let mapTotalH = 21 * GRID;

/* ==================== 平台系统（地面是第 0 号平台） ==================== */
let platforms = [];
let pidCounter = 1; // 平台唯一标识（避免连续删除时数组索引漂移导致误删）

// 地面平台（不可删除，始终存在）
function createGroundPlatform() {
  return {
    x: 0,
    y: 0,
    w: worldW / GRID,
    h: 1,
    isGround: true,
    pid: 0          // 地面固定 pid=0，永不删除
  };
}

function clampPlatforms() {
  const maxY = worldH / GRID;
  const maxX = worldW / GRID;

  // 地面平台始终保留，不裁剪
  for (let i = 1; i < platforms.length; i++) {
    const p = platforms[i];
    if (p.y >= maxY || p.x >= maxX || p.y < 0 || p.x < 0) {
      // 删除前从组合中移除该平台
      removePidFromGroup(p.pid);
      platforms.splice(i, 1);
      i--;
      continue;
    }
    if (p.x + p.w > maxX) p.w = maxX - p.x;
    if (p.y + p.h > maxY) p.h = maxY - p.y;
  }
  // 最后再做一次一致性修正（如某组剩下 <2 个则解散）
  rebuildGroupsFromPlatforms();
}

// 通用平台标签测量函数（自适应字体大小、行数，测量尺寸是否足够）
// 仅设置字号/行高/字重/内容并测量 offsetWidth，测量后恢复原 inline display（不改变最终可见性）
// tagEl: 标签 DOM; p: 平台数据; twoLineHtml: 两行 HTML; oneLineText: 单行文本
// 返回 true=尺寸足够可显示, false=尺寸不够
// 可见性由调用方决定：mapEl 标签用 showCenteredTag 设置 inline display；
//                    选中坐标标签用 refreshSelCoordFit 切换 .coord-fits 类交由 CSS 控制
function showPlatTag(tagEl, p, twoLineHtml, oneLineText) {
  if (!tagEl) return false;
  const pw = p.w * GRID, ph = p.h * GRID;
  const lh = 1.35, pad = 4;
  const fs = Math.max(12, Math.min(28, ph * 0.40));
  tagEl.style.fontSize = fs + 'px';
  tagEl.style.lineHeight = lh;
  tagEl.style.fontWeight = 'bold';
  const prevDisp = tagEl.style.display;
  tagEl.style.display = 'block';   // 临时显示以便测量 offsetWidth
  let shown = false;
  // 够高 → 两行显示
  if (ph >= 2 * fs * lh + pad) {
    tagEl.innerHTML = twoLineHtml;
    if (tagEl.offsetWidth <= pw - pad) shown = true;
  }
  // 不够高 → 单行显示
  if (!shown && ph >= fs * lh + pad) {
    tagEl.textContent = oneLineText;
    if (tagEl.offsetWidth <= pw - pad) shown = true;
  }
  tagEl.style.display = prevDisp;  // 恢复原 inline display，由调用方控制可见性
  return shown;
}

// 平台坐标文本（以世界左上角为原点，规整到 0.25 格）：返回两行 HTML 与单行文本
function platCoordText(p) {
  const gx = (Math.round(p.x * 4) / 4).toFixed(2);
  const gy = (Math.round((mapTotalH / GRID - p.y - p.h) * 4) / 4).toFixed(2);
  return { two: 'X: ' + gx + '格<br>Y: ' + gy + '格', one: 'X: ' + gx + '格 Y: ' + gy + '格' };
}

// 在 mapEl 中显示一个居中标签（showPlatTag 测量 + 居中定位 + inline display 控制）
// 用于 platSizeTag（编辑尺寸）与 platListCoordTag（列表悬浮坐标），保证两者显示逻辑一致
function showCenteredTag(tagEl, p, twoLineHtml, oneLineText) {
  if (!tagEl) return false;
  const shown = showPlatTag(tagEl, p, twoLineHtml, oneLineText);
  tagEl.style.display = shown ? 'block' : 'none';
  if (shown) {
    const cx = p.x * GRID + p.w * GRID / 2;
    const cy = p.y * GRID + p.h * GRID / 2;   // 底原点中心
    tagEl.style.left = cx + 'px';
    tagEl.style.top  = (mapTotalH - cy) + 'px';
    tagEl.style.transform = 'translate(-50%, -50%)';
  }
  return shown;
}

// 刷新选中坐标标签：测量内容 + 切换 .coord-fits 类（显示完全由 CSS 控制）
// 用于 renderPlatforms / updateCoordTag；选中态与编辑态切换无需额外 JS（CSS 自动处理）
function refreshSelCoordFit(el, p) {
  if (!el || !p) return;
  const tag = el.querySelector('.sel-coord-tag');
  if (!tag) return;
  const t = platCoordText(p);
  const fit = showPlatTag(tag, p, t.two, t.one);
  el.classList.toggle('coord-fits', fit);
}

// 绘制模式下平台显示层级调整：面积越小的平台 z-index 越高（保证被大平台完全包住的小平台在上层可点击）
// 非绘制模式：清空所有 inline z-index（恢复 CSS 默认 z-index:3，DOM 顺序决定叠加）
function applyPlatformDrawZIndex() {
  // 先统一清空 ground 以外平台的 inline z-index
  Array.from(mapEl.querySelectorAll('.platform.normal')).forEach(function(el) {
    el.style.zIndex = '';
  });
  if (!drawMode) return;

  // 收集非 ground 平台（数据 + DOM 引用）
  const normals = [];
  platforms.forEach(function(p, idx) {
    if (p.isGround) return;
    const el = mapEl.querySelector('.platform.normal[data-idx="' + idx + '"]');
    if (!el) return;
    normals.push({ p: p, el: el, area: p.w * p.h, idx: idx });
  });
  // 按面积降序（大面积先排，z 小 → 底层；小面积后排，z 大 → 顶层）
  // 面积相同按原始 idx 升序，保证稳定顺序
  normals.sort(function(a, b) {
    const da = b.area - a.area;
    return da !== 0 ? da : (a.idx - b.idx);
  });
  // z 从 4 开始（CSS 默认 z-index:3，确保绘制模式下都比默认值略高便于管理，ground 仍保持 3 不动）
  const BASE_Z = 4;
  normals.forEach(function(item, i) {
    item.el.style.zIndex = BASE_Z + i;   // i=0（最大面积）→ BASE_Z，逐次+1，末尾最小面积得最大 z
  });
}

function renderPlatforms() {
  // 清除所有平台 DOM
  Array.from(mapEl.querySelectorAll('.platform')).forEach(el => el.remove());

  platforms.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'platform ' + (p.isGround ? 'ground' : 'normal') + (p.passable ? ' passable' : '') + (p.climbable ? ' climbable' : '');
    div.style.left   = (p.x * GRID) + 'px';
    div.style.bottom = (p.y * GRID) + 'px';
    div.style.width  = (p.w * GRID) + 'px';
    div.style.height = (p.h * GRID) + 'px';
    div.dataset.idx = idx;
    div.dataset.pid = p.pid;   // 唯一标识，用于连续删除时精确定位
    // 选中平台 XY 坐标标签子元素（显示由 CSS 控制：.coord-fits + .selected 且非 .editing）
    let coordTag = null;
    if (!p.isGround) {
      coordTag = document.createElement('div');
      coordTag.className = 'sel-coord-tag';
      div.appendChild(coordTag);
    }
    mapEl.appendChild(div);
    // 在 DOM 中后测量选中坐标标签（设置内容 + .coord-fits，可见性交由 CSS）
    if (coordTag) refreshSelCoordFit(div, p);
  });

  // 恢复选中状态 UI
  if (typeof applyPlatformSelectionUI === 'function') applyPlatformSelectionUI();

  updatePlatListUI();
  applyPlatformDrawZIndex();
}

// 应用精灵图的渲染偏移 + 缩放（缩放原点为碰撞框底部中心）
function applyRenderScaleAndOffset() {
  // 位置偏移
  charEl.style.left   = (colW - CHAR_W) / 2 + renderOffsetX + 'px';
  charEl.style.bottom = renderOffsetY + 'px';

  // 缩放：以"碰撞框底部中心"为原点
  // 碰撞框底部中心在 charEl 自身坐标系中的位置：
  //   X = CHAR_W/2 - renderOffsetX（从 charEl 左边缘算起）
  //   Y = CHAR_H + renderOffsetY（从 charEl 上边缘算起，因为 charEl 底部距碰撞框底部为 renderOffsetY）
  const ox = CHAR_W / 2 - renderOffsetX;
  const oy = CHAR_H + renderOffsetY;
  charEl.style.transformOrigin = ox + 'px ' + oy + 'px';
  charEl.style.transform = 'scale(' + renderScale + ')';
}

// 更新碰撞框显示（应用配置时使用）
function updateCollisionBox() {
  // 宽度
  const wVal = Math.max(0.1, +colWidthInput.value || 1);
  colW = wVal * GRID;
  charWrap.style.width = colW + 'px';
  charX = Math.max(colW / 2, Math.min(worldW - colW / 2, charX));
  
  // 正常高度
  const hVal = Math.max(0.1, +colHeightNormalInput.value || 2);
  colHNormal = hVal * GRID;
  
  // 蹲下高度（不允许超过正常高度）
  let cVal = Math.max(0.1, +colHeightCrouchInput.value || 1);
  if (cVal * GRID > colHNormal) { cVal = colHNormal / GRID; }
  colHCrouch = cVal * GRID;
  
  // 根据当前状态设置显示高度
  if (isCrouching) {
    charWrap.style.height = colHCrouch + 'px';
  } else {
    charWrap.style.height = colHNormal + 'px';
  }
  applyRenderScaleAndOffset();
  
  // 位置钳制
  posY = Math.max(0, Math.min(posY, mapTotalH - getColH()));
}

// 仅更新侧边栏平台列表（不重建平台 DOM，避免破坏 dblclick）
function updatePlatListUI() {
  platList.innerHTML = '';
  platforms.forEach((p, idx) => {

    const row = document.createElement('div');

    wInput.step = '0.25';
    wInput.min = '0.25';

    wInput.disabled = !drawMode;
    wInput.title = '宽度（格，步进 0.25）';
    wWrap.appendChild(wLabel);
    wWrap.appendChild(wInput);

    // 高度输入框（步进 0.25 格）
    const hWrap = document.createElement('span');
    hWrap.className = 'dim-wrap';
    const hLabel = document.createElement('span');
    hLabel.className = 'dim-label';
    hLabel.textContent = '高';
    const hInput = document.createElement('input');
    hInput.type = 'number';
    hInput.step = '0.25';
    hInput.min = '0.25';
    hInput.value = p.h;
    hInput.disabled = !drawMode;
    hInput.title = '高度（格，步进 0.25）';
    hWrap.appendChild(hLabel);
    hWrap.appendChild(hInput);

    // 删除按钮
    const delBtn = document.createElement('button');
    delBtn.textContent = '\u2716';
    delBtn.dataset.i = idx;
    delBtn.disabled = !drawMode;

    row.appendChild(wWrap);
    row.appendChild(hWrap);
    row.appendChild(delBtn);
    platList.appendChild(row);

    // 通过 data-pid 精确查找对应平台 DOM（避免连续删除时索引漂移）
    function findPlatEl() {
      return mapEl.querySelector('.platform.normal[data-pid="' + p.pid + '"]');
    }
    // 更新平台 DOM 内的 XY 坐标标签（位置/尺寸变化后调用）
    function updateCoordTag(el) {
      refreshSelCoordFit(el, p);
    }

    // 宽度变化：更新数据 + 平台 DOM，必要时同步手柄位置
    wInput.addEventListener('input', function() {
      const v = Math.max(0.25, +wInput.value || 0.25);
      p.w = v;
      const el = findPlatEl();
      if (el) el.style.width = (v * GRID) + 'px';
      if (el) updateCoordTag(el);   // 宽度变化影响标签是否放得下
      if (resizeTarget === idx) positionResizeHandles();
    });
    // 宽度修改：focus 时保存"修改前快照"，blur 时如确有变化则把修改前快照入栈（撤回→回到修改前）
    wInput.addEventListener('focus', function() { wInput._before = snapPlatforms(); });
    wInput.addEventListener('blur', function() {
      if (drawMode && wInput._before) {
        const curSnap = snapPlatforms();
        const changed = curSnap.length !== wInput._before.length ||
          curSnap.some(function(q, i) {
            const b = wInput._before[i];
            return !b || q.pid !== b.pid || q.w !== b.w || q.h !== b.h || q.x !== b.x || q.y !== b.y;
          });
        if (changed) recordUndoStep(wInput._before);
      }
      wInput._before = null;
    });
    // 高度变化
    hInput.addEventListener('input', function() {
      const v = Math.max(0.25, +hInput.value || 0.25);
      p.h = v;
      const el = findPlatEl();
      if (el) el.style.height = (v * GRID) + 'px';
      if (el) updateCoordTag(el);   // 高度变化影响 Y 坐标和字体大小
      if (resizeTarget === idx) positionResizeHandles();
    });
    hInput.addEventListener('focus', function() { hInput._before = snapPlatforms(); });
    hInput.addEventListener('blur', function() {
      if (drawMode && hInput._before) {
        const curSnap = snapPlatforms();
        const changed = curSnap.length !== hInput._before.length ||
          curSnap.some(function(q, i) {
            const b = hInput._before[i];
            return !b || q.pid !== b.pid || q.w !== b.w || q.h !== b.h || q.x !== b.x || q.y !== b.y;
          });
        if (changed) recordUndoStep(hInput._before);
      }
      hInput._before = null;
    });

    // 删除按钮（仅绘制模式可用）→ 调用与拖动删除相同的坠落动画
    delBtn.addEventListener('click', function() {
      if (!drawMode) return;
      const beforeSnap = snapPlatforms();
      const el = findPlatEl();
      playDeleteAnimation(el);
      recordUndoStep(beforeSnap); // 记录删除前快照
    });

    // 鼠标悬浮 → 对应平台描边变青色 + 显示坐标标签（与编辑尺寸标签同逻辑：showCenteredTag）
    row.addEventListener('mouseenter', function() {
      const el = findPlatEl();
      if (el) el.classList.add('highlight');
      if (platListCoordTag) {
        const t = platCoordText(p);
        showCenteredTag(platListCoordTag, p, t.two, t.one);

    });
    row.addEventListener('mouseleave', function() {
      const el = findPlatEl();
      if (el) el.classList.remove('highlight');
      if (platListCoordTag) platListCoordTag.style.display = 'none';
    });
  });
}
